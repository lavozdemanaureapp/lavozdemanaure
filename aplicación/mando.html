<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mando Manaure Final</title>
    <style>
        body { background: #0b0b0b; color: white; font-family: sans-serif; text-align: center; padding: 15px; margin: 0; }
        .audiencia-card { 
            background: linear-gradient(145deg, #000, #1a0000); 
            border: 2px solid #ff0000; padding: 20px; border-radius: 20px; 
            margin-bottom: 20px; box-shadow: 0 0 25px rgba(255,0,0,0.5);
        }
        #audiencia-total { font-size: 85px; font-weight: bold; color: #ff0000; line-height: 1; }
        .card { background: #1a1a1a; padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #333; }
        .flex-voz { display: flex; gap: 10px; }
        .btn-voz { flex: 1; height: 70px; font-size: 18px; border-radius: 12px; border: none; font-weight: bold; color: white; }
        .on { background: #1e7e34; border-bottom: 5px solid #114d1f; }
        .off { background: #bd2130; border-bottom: 5px solid #7d1620; }
        .grid-pub { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .btn-pub { background: #2a2a2a; color: #fff; padding: 15px; border-radius: 10px; border: 1px solid #444; font-weight: bold; }
        .btn-quitar { background: #444; color: white; width: 100%; margin-top: 15px; padding: 15px; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="audiencia-card">
        <div style="font-size: 14px; color: #ff4d4d; font-weight: bold;">OYENTES EN VIVO</div>
        <div id="audiencia-total">0</div>
    </div>

    <div class="card">
        <h3 style="color: #ffcc00; font-size: 0.8rem;">VOZ / MICRÓFONO</h3>
        <div class="flex-voz">
            <button class="on" onclick="setRadio('ON')">🎤 ENTRAR</button>
            <button class="off" onclick="setRadio('OFF')">🔇 SALIR</button>
        </div>
    </div>

    <div class="card">
        <h3 style="color: #ffcc00; font-size: 0.8rem;">PUBLICIDAD 1-10</h3>
        <div class="grid-pub">
            <button class="btn-pub" onclick="setPub('publicidad1.png')">PUB 1</button>
            <button class="btn-pub" onclick="setPub('publicidad2.png')">PUB 2</button>
            <button class="btn-pub" onclick="setPub('publicidad3.png')">PUB 3</button>
            <button class="btn-pub" onclick="setPub('publicidad4.png')">PUB 4</button>
            <button class="btn-pub" onclick="setPub('publicidad5.png')">PUB 5</button>
            <button class="btn-pub" onclick="setPub('publicidad6.png')">PUB 6</button>
            <button class="btn-pub" onclick="setPub('publicidad7.png')">PUB 7</button>
            <button class="btn-pub" onclick="setPub('publicidad8.png')">PUB 8</button>
            <button class="btn-pub" onclick="setPub('publicidad9.png')">PUB 9</button>
            <button class="btn-pub" onclick="setPub('publicidad10.png')">PUB 10</button>
        </div>
        <button class="btn-quitar" onclick="setPub('OFF')">QUITAR PUB</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk", 
            databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com", 
            projectId: "radiomanaure" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.setRadio = (est) => set(ref(db, 'radio_activa'), { estado: est });
        window.setPub = (img) => set(ref(db, 'publicidad_activa'), { imagen: img });

        // --- EL CONTADOR DE LA VERDAD ---
        // Escuchamos la rama 'audiencia' y forzamos el conteo
        onValue(ref(db, 'audiencia'), (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                // Contamos cuántas personas hay realmente en la lista
                const cantidad = Object.keys(data).length;
                document.getElementById('audiencia-total').innerText = cantidad;
                console.log("Audiencia actualizada:", cantidad);
            } else {
                document.getElementById('audiencia-total').innerText = "0";
            }
        }, (error) => {
            console.error("Error de Firebase:", error);
        });
    </script>
</body>
</html>
