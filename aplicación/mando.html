<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mando Manaure</title>
    <style>
        body { background: #111; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #222; padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #444; }
        button { padding: 15px; margin: 5px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; width: 45%; }
        .on { background: #28a745; color: white; }
        .off { background: #dc3545; color: white; }
    </style>
</head>
<body>
    <h1>MANDO PRIVADO</h1>
    <div class="card">
        <h3>CHAT EN PANTALLA</h3>
        <button class="on" onclick="setChat('ON')">ACTIVAR</button>
        <button class="off" onclick="setChat('OFF')">QUITAR</button>
    </div>
    <div class="card">
        <h3>VOZ RADIO (SILENCIA VIDEO)</h3>
        <button class="on" onclick="setRadio('ON')">HABLAR</button>
        <button class="off" onclick="setRadio('OFF')">CALLAR</button>
    </div>
    <div class="card">
        <h3>PUBLICIDAD</h3>
        <button onclick="setPub('publiidad1.png')">PUB 1</button>
        <button onclick="setPub('publicidad2.png')">PUB 2</button>
        <button onclick="setPub('publiidad3.png')">PUB 3</button>
        <button onclick="setPub('publicidad4.png')">PUB 4</button>
        <button onclick="setPub('publiidad5.png')">PUB 5</button>
        <button onclick="setPub('publicidad6.png')">PUB 6</button>
        <button onclick="setPub('publiidad7.png')">PUB 7</button>
        <button onclick="setPub('publicidad8.png')">PUB 8</button>
        <button onclick="setPub('publiidad9.png')">PUB 9</button>
        <button onclick="setPub('publicidad10.png')">PUB 10</button>
        <button class="off" onclick="setPub('OFF')" style="width:92%">QUITAR PUB</button>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        const firebaseConfig = { apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk", databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com", projectId: "radiomanaure" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        window.setChat = (est) => set(ref(db, 'chat_visible'), { estado: est });
        window.setRadio = (est) => set(ref(db, 'radio_activa'), { estado: est });
        window.setPub = (img) => set(ref(db, 'publicidad_activa'), { imagen: img });
    </script>
</body>
</html>
