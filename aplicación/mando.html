<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mando Manaure Pro - Audio Control</title>
    <style>
        body { background: #0b0b0b; color: white; font-family: sans-serif; text-align: center; padding: 15px; margin: 0; }
        h1 { font-size: 1rem; color: #444; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; }
        
        /* MONITOR DE AUDIENCIA */
        .audiencia-card { 
            background: linear-gradient(145deg, #000, #1a0000); 
            border: 2px solid #ff0000; padding: 20px; border-radius: 20px; 
            margin-bottom: 20px; box-shadow: 0 0 20px rgba(255,0,0,0.3);
        }
        #audiencia-total { font-size: 60px; font-weight: bold; color: #ff0000; margin: 5px 0; }

        /* PLAYER DE AUDIO VISIBLE */
        .audio-card { background: #222; border: 2px solid #ffcc00; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        audio { width: 100%; height: 40px; margin-top: 10px; }
        
        .card { background: #1a1a1a; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; }
        h3 { font-size: 0.85rem; margin-top: 0; color: #ffcc00; text-transform: uppercase; margin-bottom: 12px; }
        
        .grid-pub { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        button { padding: 14px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.1s; }
        
        .btn-main { width: 48%; height: 60px; font-size: 16px; }
        .on { background: #1e7e34; color: white; border-bottom: 4px solid #155d27; }
        .off { background: #bd2130; color: white; border-bottom: 4px solid #8c1924; }
        
        .btn-pub { background: #333; color: #fff; width: 100%; border: 1px solid #444; }
        .btn-quitar-pub { background: #444; color: white; width: 100%; margin-top: 15px; padding: 18px; font-size: 16px; border: 2px dashed #666; }

        .status-msg { font-size: 12px; margin-top: 10px; font-weight: bold; }
        .active-mic { color: #00ff00; }
        .muted-mic { color: #ff4444; }
    </style>
</head>
<body>

    <h1>CENTRO DE CONTROL MANAURE</h1>

    <div class="audiencia-card">
        <div style="font-size: 11px; color: #ff4d4d; font-weight: bold;">OYENTES CONECTADOS</div>
        <div id="audiencia-total">0</div>
    </div>

    <div class="audio-card">
        <h3>Señal de la Emisora (Retorno)</h3>
        <audio id="radio-audio" controls src="https://stream.zeno.fm/a0x4vvcp9whvv"></audio>
    </div>

    <div class="card">
        <h3>Control de Transmisión</h3>
        <div style="display: flex; justify-content: space-between;">
            <button class="on btn-main" onclick="setRadio('ON')">🎤 HABLAR<br>(Mute Video)</button>
            <button class="off btn-main" onclick="setRadio('OFF')">🔇 CALLAR<br>(Audio Video)</button>
        </div>
        <div id="status-text" class="status-msg muted-mic">ESTADO: AUDIO DE VIDEO ACTIVO</div>
    </div>

    <div class="card">
        <h3>Publicidad Directa</h3>
        <div class="grid-pub">
            <button class="btn-pub" onclick="setPub('publicidad1.png')">PUB 1</button>
            <button class="btn-pub" onclick="setPub('publicidad2.png')">PUB 2</button>
            <button class="btn-pub" onclick="setPub('publicidad3.png')">PUB 3</button>
            <button class="btn-pub" onclick="setPub('publicidad4.png')">PUB 4</button>
            <button class="btn-pub" onclick="setPub('publicidad5.png')">PUB 5</button>
            <button class="btn-pub" onclick="setPub('publicidad6.png')">PUB 6</button>
            <button class="btn-pub" onclick="setPub('publicidad7.png')">PUB 7</button>
            <button class="btn-pub" onclick="setPub('publicidad8.png')">PUB 8</button>
            <button class="btn-pub" onclick="setPub('publicidad9.png')">PUB 9</button>
            <button class="btn-pub" onclick="setPub('publicidad10.png')">PUB 10</button>
        </div>
        <button class="off btn-quitar-pub" onclick="setPub('OFF')">QUITAR PUBLICIDAD</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk", 
            databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com", 
            projectId: "radiomanaure" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- LÓGICA DE MANDO ---
        window.setRadio = (est) => {
            set(ref(db, 'radio_activa'), { estado: est });
            const status = document.getElementById('status-text');
            if(est === 'ON') {
                status.innerText = "ESTADO: TRANSMITIENDO VOZ (VIDEO MUTEADO)";
                status.className = "status-msg active-mic";
            } else {
                status.innerText = "ESTADO: AUDIO DE VIDEO ACTIVO";
                status.className = "status-msg muted-mic";
            }
        };

        window.setPub = (img) => set(ref(db, 'publicidad_activa'), { imagen: img });

        // --- AUDIENCIA REAL-TIME ---
        onValue(ref(db, 'audiencia'), (snap) => {
            const num = snap.exists() ? Object.keys(snap.val()).length : 0;
            document.getElementById('audiencia-total').innerText = num;
        });

        // Sincronizar el estado visual del mando con Firebase por si se cambia desde otro lado
        onValue(ref(db, 'radio_activa'), (snap) => {
            const est = snap.val()?.estado;
            const status = document.getElementById('status-text');
            if(est === 'ON') {
                status.innerText = "ESTADO: TRANSMITIENDO VOZ (VIDEO MUTEADO)";
                status.className = "status-msg active-mic";
            } else {
                status.innerText = "ESTADO: AUDIO DE VIDEO ACTIVO";
                status.className = "status-msg muted-mic";
            }
        });
    </script>
</body>
</html>
