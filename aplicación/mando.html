<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mando Publicidad - La Voz de Manaure</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding: 10px; margin: 0; }
        .container { border: 2px solid #ff0000; border-radius: 15px; padding: 15px; background: #1a1a1a; }
        h2 { color: #ff0000; font-size: 14px; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
        button { 
            padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; 
            text-transform: uppercase; font-size: 11px; transition: 0.2s;
        }
        .btn-pub { background: #2ecc71; color: white; border-bottom: 3px solid #27ae60; }
        .btn-pub:active { transform: translateY(2px); border-bottom: none; }
        .btn-off { background: #e74c3c; color: white; margin-top: 10px; border-bottom: 3px solid #c0392b; }
        .btn-off:active { transform: translateY(2px); border-bottom: none; }
        #status { font-size: 10px; color: #666; margin-top: 12px; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <h2>CONTROL DE PUBLICIDAD</h2>
        <div class="grid">
            <button class="btn-pub" onclick="enviarPub('publicidad1.png')">PLUS MARKET (P1)</button>
            <button class="btn-pub" onclick="enviarPub('publicidad2.png')">MONTAÑES (P2)</button>
            <button class="btn-pub" onclick="enviarPub('publicidad3.png')">EL PROFE (P3)</button>
            <button class="btn-pub" onclick="enviarPub('publicidad4.png')">ALE (P4)</button>
            
            <button class="btn-off" onclick="enviarPub('OFF')">QUITAR PUBLICIDAD</button>
        </div>
        <div id="status">Conectado a Firebase</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk",
            databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com",
            projectId: "radiomanaure"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.enviarPub = function(archivo) {
            set(ref(db, 'publicidad_activa'), {
                imagen: archivo,
                enlace: 'https://wa.me/584121234567' // Tu WhatsApp para todos los banners
            });
        }
    </script>
</body>
</html>
