<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manaure TV Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --rojo: #ff0000; }
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        #master-player { width: 100%; aspect-ratio: 16 / 9; background: #000; position: relative; flex-shrink: 0; }
        video, #yt-frame { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; border: none; }

        /* CHAT FLOTANTE TRANSPARENTE */
        #chat-overlay { 
            position: absolute; bottom: 45px; left: 5%; width: 90%; height: 45px; 
            z-index: 100; display: none; overflow: hidden; 
            background: transparent !important; pointer-events: none;
        }
        #chat-overlay iframe { 
            width: 100%; height: 500px; margin-top: -455px; 
            background: transparent !important; border: none;
            filter: drop-shadow(2px 2px 2px #000); /* Para que las letras resalten */
        }

        .btn-fs { position: absolute; bottom: 10px; right: 10px; background: var(--rojo); color: white; border: none; padding: 8px 12px; border-radius: 5px; font-size: 10px; font-weight: bold; z-index: 101; cursor: pointer; }

        #interaction { flex: 1; display: flex; flex-direction: column; background: #0a0a0a; border-top: 2px solid var(--rojo); }
        #bar { padding: 10px; }
        select { width: 100%; background: #1a1a1a; color: #fff; border: 1px solid var(--rojo); padding: 12px; border-radius: 8px; font-size: 16px; }
        #chat-main { width: 100%; flex: 1; border: none; }
    </style>
</head>
<body>

    <div id="master-player">
        <video id="video" playsinline controls autoplay muted></video>
        <iframe id="yt-frame" style="display:none" allow="autoplay; fullscreen" allowfullscreen></iframe>
        
        <div id="chat-overlay"><iframe id="chat-cine-frame" src="chat-manaure.html"></iframe></div>
        <button class="btn-fs" onclick="toggleFS()">MODO CINE</button>
    </div>

    <div id="interaction">
        <div id="bar">
            <select id="lista"><option>Cargando Canales...</option></select>
        </div>
        <iframe id="chat-main" src="chat-manaure.html"></iframe>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const video = document.getElementById('video');
        const yt = document.getElementById('yt-frame');
        const hls = new Hls({
            enableWorker: true,
            lowLatencyMode: true,
            maxBufferLength: 10
        });

        // Detector de YouTube mejorado
        function getYTID(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=|live\/)([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        window.play = (url) => {
            // Limpiar ambos reproductores
            video.pause();
            video.style.display = "none";
            yt.style.display = "none";
            yt.src = "";
            hls.detachMedia();

            const id = getYTID(url);

            if (id) {
                yt.style.display = "block";
                // Añadimos el origin para evitar bloqueos de seguridad
                const origin = window.location.origin;
                yt.src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0&modestbranding=1&origin=${origin}`;
            } else {
                video.style.display = "block";
                if (url.includes('.m3u8')) {
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
                } else {
                    video.src = url;
                    video.play().catch(() => { video.muted = true; video.play(); });
                }
            }
        };

        window.toggleFS = () => {
            const p = document.getElementById('master-player');
            if (!document.fullscreenElement) p.requestFullscreen().catch(() => {});
            else document.exitFullscreen();
        };

        // Cargar lista M3U
        fetch("https://raw.githubusercontent.com/lavozdemanaureapp/lavozdemanaure/main/canales.m3u")
            .then(res => res.text())
            .then(data => {
                const select = document.getElementById('lista');
                select.innerHTML = "";
                const lines = data.split('\n');
                lines.forEach((line, i) => {
                    if (line.includes('#EXTINF')) {
                        const name = line.split(',')[1].trim();
                        const url = lines[i+1]?.trim();
                        if (url && url.startsWith('http')) {
                            select.add(new Option(name.toUpperCase(), url));
                        }
                    }
                });
                if (select.length > 0) play(select.value);
            });

        document.getElementById('lista').onchange = (e) => play(e.target.value);

        // Firebase: Visibilidad Chat Flotante
        onValue(ref(db, 'chat_visible'), snap => {
            const estado = snap.val()?.estado;
            document.getElementById('chat-overlay').style.display = (estado === 'ON') ? 'block' : 'none';
        });
    </script>
</body>
</html>
