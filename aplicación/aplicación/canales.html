<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manaure TV Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --rojo: #ff0000; --negro: #0c0c0c; }
        body { margin: 0; background: var(--negro); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* BOTÓN MENÚ */
        .menu-toggle { position: absolute; top: 15px; left: 15px; z-index: 10002; background: var(--rojo); color: white; border: none; width: 45px; height: 45px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }

        /* SIDEBAR */
        #sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: #000; border-right: 3px solid var(--rojo); z-index: 10001; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; flex-direction: column; padding-top: 80px; }
        #sidebar.active { left: 0; }
        .nav-link { color: white; text-decoration: none; padding: 20px; border-bottom: 1px solid #222; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .nav-link.active { color: var(--rojo); background: #111; }

        /* REPRODUCTOR - AJUSTE DINÁMICO */
        #player-canvas { width: 100%; aspect-ratio: 16 / 9; background: #000; position: relative; border-bottom: 2px solid var(--rojo); flex-shrink: 0; }
        video { width: 100%; height: 100%; object-fit: contain; }

        /* INTERACCIÓN Y CHAT */
        #interaction-area { flex: 1; display: flex; flex-direction: column; background: #050505; overflow: hidden; }
        #channel-bar { padding: 10px; background: #111; border-bottom: 1px solid #222; }
        select { width: 100%; background: #000; color: white; border: 2px solid var(--rojo); padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; outline: none; }
        iframe { width: 100%; flex: 1; border: none; background: #000; }

        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 10000; }

        /* --- MODO HORIZONTAL (LANDSCAPE) --- */
        @media (orientation: landscape) {
            #player-canvas { height: 70vh; aspect-ratio: auto; } /* Más altura para el video en horizontal */
            .menu-toggle { top: 10px; left: 10px; width: 35px; height: 35px; font-size: 16px; }
            #channel-bar { padding: 5px; }
            select { padding: 8px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <button class="menu-toggle" id="btn-menu" onclick="toggleMenu()">
        <i class="fas fa-bars"></i>
    </button>

    <div id="overlay" onclick="toggleMenu()"></div>

    <div id="sidebar">
        <a href="index.html" class="nav-link"><i class="fas fa-radio"></i> RADIO EN VIVO</a>
        <a href="canales.html" class="nav-link active"><i class="fas fa-tv"></i> TV EN VIVO</a>
        <a href="programas.html" class="nav-link"><i class="fas fa-calendar-alt"></i> PROGRAMACIONES</a>
    </div>

    <div id="player-canvas">
        <video id="video" playsinline autoplay controls></video>
    </div>

    <div id="interaction-area">
        <div id="channel-bar">
            <select id="channel-select"><option>Cargando canales...</option></select>
        </div>
        <iframe src="chat-manaure.html"></iframe>
    </div>

    <script>
        const video = document.getElementById('video');
        const hls = new Hls();

        function toggleMenu() {
            const sb = document.getElementById('sidebar');
            const ov = document.getElementById('overlay');
            const icon = document.querySelector('#btn-menu i');
            sb.classList.toggle('active');
            if (sb.classList.contains('active')) {
                ov.style.display = 'block';
                icon.classList.replace('fa-bars', 'fa-times');
            } else {
                ov.style.display = 'none';
                icon.classList.replace('fa-times', 'fa-bars');
            }
        }

        window.play = (url) => {
            if (Hls.isSupported()) {
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(e=>console.log("Play error")));
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
            }
        };

        async function loadM3U() {
            try {
                const r = await fetch('canales.m3u?v=' + Math.random());
                const t = await r.text();
                const lines = t.split('\n');
                const select = document.getElementById('channel-select');
                select.innerHTML = '';
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].startsWith('#EXTINF')) {
                        let name = lines[i].split(',')[1] || "Canal";
                        let url = lines[i+1]?.trim();
                        if(url) select.add(new Option(name.toUpperCase(), url));
                    }
                }
                if (select.length > 0) play(select.options[0].value);
            } catch (e) { console.error("M3U Error"); }
        }

        document.getElementById('channel-select').onchange = (e) => play(e.target.value);
        loadM3U();
    </script>
</body>
</html>
