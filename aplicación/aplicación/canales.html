<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manaure TV Profesional</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --rojo: #ff0000; --negro: #0c0c0c; --gris: #1a1a1a; }
        body { margin: 0; background: var(--negro); color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* SIDEBAR (MENÚ LATERAL) */
        #sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: #000; border-right: 3px solid var(--rojo); z-index: 10001; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; align-items: center; padding-top: 20px; box-shadow: 10px 0 20px rgba(0,0,0,0.5); }
        #sidebar.active { left: 0; }
        .btn-regresar { width: 90%; background: var(--rojo); color: #fff; border: none; padding: 15px; margin-bottom: 25px; border-radius: 8px; cursor: pointer; font-weight: 900; text-transform: uppercase; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .menu-toggle { position: absolute; top: 15px; left: 15px; z-index: 10002; background: rgba(0,0,0,0.8); color: white; border: 1.5px solid var(--rojo); padding: 10px 12px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .menu-toggle:active { transform: scale(0.9); }

        /* ÁREA DEL REPRODUCTOR */
        #player-canvas { width: 100%; aspect-ratio: 16 / 9; background: #000; position: relative; border-bottom: 3px solid var(--rojo); flex-shrink: 0; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        video { width: 100%; height: 100%; display: block; object-fit: contain; }
        .btn-vid { position: absolute; bottom: 12px; right: 12px; background: var(--rojo); color: white; border: none; padding: 10px 15px; border-radius: 6px; font-size: 11px; font-weight: bold; z-index: 1000; cursor: pointer; text-transform: uppercase; box-shadow: 0 2px 10px rgba(255,0,0,0.3); }

        /* ÁREA DE INTERACCIÓN (LISTA Y CHAT) */
        #interaction-area { flex: 1; display: flex; flex-direction: column; background: #050505; overflow: hidden; }
        #channel-bar { padding: 15px; background: var(--gris); border-bottom: 1px solid #333; text-align: center; }
        select { width: 100%; background: #000; color: white; border: 2px solid var(--rojo); padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; outline: none; appearance: none; cursor: pointer; text-align: center; }
        
        /* CHAT */
        iframe#chat-frame { width: 100%; flex: 1; border: none; background: #000; }
        
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; z-index: 10000; backdrop-filter: blur(3px); }
        
        /* LINKS DEL SIDEBAR */
        .nav-link { color: #ccc; text-decoration: none; padding: 18px; width: 100%; text-align: center; border-bottom: 1px solid #1a1a1a; font-weight: bold; transition: 0.3s; }
        .nav-link:hover { background: #111; color: var(--rojo); }
        .nav-link.active { color: var(--rojo); background: #0a0a0a; border-left: 4px solid var(--rojo); }
    </style>
</head>
<body>

    <div class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
    <div id="overlay" onclick="toggleMenu()"></div>

    <div id="sidebar">
        <button class="btn-regresar" onclick="toggleMenu()"><i class="fas fa-arrow-left"></i> CERRAR MENÚ</button>
        <img src="logo_v2.png" style="width: 110px; margin-bottom: 15px;" onerror="this.style.display='none'">
        <a href="index.html" class="nav-link">RADIO EN VIVO</a>
        <a href="canales.html" class="nav-link active">TV EN VIVO</a>
        <a href="programas.html" class="nav-link">PROGRAMAS</a>
    </div>

    <div id="player-canvas">
        <video id="video" playsinline autoplay controls poster="poster_v2.jpg"></video>
        <button class="btn-vid" onclick="toggleFS()"><i class="fas fa-expand"></i> PANTALLA COMPLETA</button>
    </div>

    <div id="interaction-area">
        <div id="channel-bar">
            <select id="channel-select"><option>Cargando lista de canales...</option></select>
        </div>
        <iframe id="chat-frame" src="chat-manaure.html"></iframe>
    </div>

    <script>
        const video = document.getElementById('video');
        const hls = new Hls();

        // Control del Menú Lateral
        window.toggleMenu = () => {
            const sb = document.getElementById('sidebar');
            const ov = document.getElementById('overlay');
            const isActive = sb.classList.contains('active');
            sb.classList.toggle('active');
            ov.style.display = isActive ? 'none' : 'block';
        };

        // Control de Pantalla Completa
        window.toggleFS = () => {
            const container = document.getElementById('player-canvas');
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) container.requestFullscreen();
                else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        };

        // Motor de Reproducción HLS
        window.playChannel = (url) => {
            if (Hls.isSupported()) {
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.log("Autoplay bloqueado"));
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
            }
        };

        // Lector de Archivo M3U
        async function loadM3U() {
            try {
                const response = await fetch('canales.m3u?v=' + Math.random());
                const data = await response.text();
                const lines = data.split('\n');
                const select = document.getElementById('channel-select');
                select.innerHTML = ''; 

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();
                    if (line.startsWith('#EXTINF')) {
                        // Extraemos el nombre del canal
                        let name = line.split(',')[1] || "Canal Desconocido";
                        // La URL debe estar en la siguiente línea
                        let url = lines[i + 1] ? lines[i + 1].trim() : "";
                        
                        if (url && url.startsWith('http')) {
                            let option = new Option(name.toUpperCase(), url);
                            select.add(option);
                        }
                    }
                }

                if (select.length > 0) {
                    playChannel(select.options[0].value);
                } else {
                    select.innerHTML = '<option>No hay canales disponibles</option>';
                }

            } catch (error) {
                console.error("Error cargando M3U:", error);
                document.getElementById('channel-select').innerHTML = '<option>Error al cargar canales.m3u</option>';
            }
        }

        // Evento de cambio en el selector
        document.getElementById('channel-select').onchange = (e) => {
            playChannel(e.target.value);
        };

        // Inicio automático
        loadM3U();
    </script>
</body>
</html>
