<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manaure TV Profesional</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --rojo: #ff0000; --negro: #0c0c0c; }
        body { margin: 0; background: var(--negro); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* REPRODUCTOR */
        #player-canvas { width: 100%; aspect-ratio: 16 / 9; background: #000; position: relative; border-bottom: 2px solid var(--rojo); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; display: none; }
        
        /* PANEL TELEGRAM (Cuando el embed falla) */
        #tg-bridge { display: none; text-align: center; padding: 20px; }
        .btn-telegram { background: #0088cc; color: white; border: none; padding: 15px 25px; border-radius: 50px; font-weight: bold; text-decoration: none; display: inline-flex; align-items: center; gap: 10px; font-size: 16px; box-shadow: 0 4px 15px rgba(0,136,204,0.4); }

        /* INTERFAZ */
        #interaction-area { flex: 1; display: flex; flex-direction: column; background: #050505; }
        #channel-bar { padding: 15px; background: #111; border-bottom: 1px solid #333; text-align: center; }
        select { width: 100%; background: #1a1a1a; color: white; border: 2px solid var(--rojo); padding: 15px; border-radius: 10px; font-size: 18px; font-weight: bold; }
        iframe#chat-frame { width: 100%; flex: 1; border: none; }
    </style>
</head>
<body>

    <div id="player-canvas">
        <video id="video" playsinline autoplay controls></video>
        
        <div id="tg-bridge">
            <i class="fab fa-telegram" style="font-size: 50px; color: #0088cc; margin-bottom: 15px; display: block;"></i>
            <p style="margin-bottom: 20px; font-weight: bold;">SEÑAL EN VIVO POR TELEGRAM</p>
            <a id="tg-link" href="#" target="_blank" class="btn-telegram">
                <i class="fas fa-play"></i> VER TRANSMISIÓN
            </a>
            <p style="font-size: 11px; color: #666; margin-top: 15px;">Telegram bloqueó la vista externa. Haz clic arriba para abrir el directo.</p>
        </div>
    </div>

    <div id="interaction-area">
        <div id="channel-bar">
            <select id="channel-select"><option>Cargando canales...</option></select>
        </div>
        <iframe id="chat-frame" src="chat-manaure.html"></iframe>
    </div>

    <script>
        const videoHLS = document.getElementById('video');
        const tgBridge = document.getElementById('tg-bridge');
        const tgLink = document.getElementById('tg-link');
        const hls = new Hls();

        window.play = (url) => {
            // Resetear todo
            videoHLS.style.display = "none";
            videoHLS.pause();
            tgBridge.style.display = "none";

            if (url.includes('t.me/')) {
                // Si Telegram nos bloquea el cuadrito, mostramos el puente directo
                tgBridge.style.display = "block";
                // Limpiamos el link para que sea directo al live
                const canal = url.split('t.me/')[1].split('?')[0].split('/')[0];
                tgLink.href = `https://t.me/${canal}?livestream`;
            } else {
                videoHLS.style.display = "block";
                if (Hls.isSupported()) {
                    hls.loadSource(url);
                    hls.attachMedia(videoHLS);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => videoHLS.play().catch(()=>{}));
                } else if (videoHLS.canPlayType('application/vnd.apple.mpegurl')) {
                    videoHLS.src = url;
                }
            }
        };

        async function loadM3U() {
            try {
                const r = await fetch('canales.m3u?v=' + Math.random());
                const t = await r.text();
                const lines = t.split('\n');
                const select = document.getElementById('channel-select');
                select.innerHTML = '';
                
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].startsWith('#EXTINF')) {
                        let name = lines[i].split(',')[1] || "CANAL";
                        let url = lines[i + 1]?.trim() || "";
                        if (url) select.add(new Option(name.toUpperCase(), url));
                    }
                }
                if (select.length > 0) play(select.options[0].value);
            } catch (e) { console.log("Error de lista"); }
        }

        document.getElementById('channel-select').onchange = (e) => play(e.target.value);
        loadM3U();
    </script>
</body>
</html>
