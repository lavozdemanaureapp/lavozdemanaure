<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MANAURE TV LIVE</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        #reproductor { width: 100%; aspect-ratio: 16/9; background: #111; position: relative; border-bottom: 2px solid #ffcc00; }
        video, iframe { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; border: none; z-index: 5; }
        
        #controles { padding: 15px; background: #1a1a1a; flex-shrink: 0; }
        select { width: 100%; padding: 15px; background: #333; color: #ffcc00; border: 1px solid #ffcc00; border-radius: 8px; font-size: 18px; font-weight: bold; outline: none; }
        
        #chat-partido { flex: 1; width: 100%; border: none; background: #000; }
        .error-msg { position: absolute; top: 40%; width: 100%; text-align: center; color: red; font-size: 12px; z-index: 1; }
    </style>
</head>
<body>

<div id="reproductor">
    <div class="error-msg" id="status">Cargando sistema...</div>
    <video id="vid" playsinline controls autoplay muted style="display:none"></video>
    <iframe id="yt" allow="autoplay; fullscreen" allowfullscreen style="display:none"></iframe>
</div>

<div id="controles">
    <select id="lista" onchange="conectar(this.value)">
        <option>Esperando lista...</option>
    </select>
</div>

<iframe id="chat-partido" src="chat-partido.html"></iframe>

<script>
    const vid = document.getElementById('vid');
    const yt = document.getElementById('yt');
    const status = document.getElementById('status');
    const hls = new Hls({
        enableWorker: true,
        xhrSetup: function(xhr) { xhr.withCredentials = false; } // Evita bloqueos de seguridad
    });

    function conectar(url) {
        if(!url) return;
        status.innerText = "Conectando señal...";
        
        // Reset
        vid.pause();
        vid.style.display = "none";
        yt.style.display = "none";
        yt.src = "";
        hls.detachMedia();

        // Es YouTube?
        if (url.includes('youtu')) {
            let id = "";
            if (url.includes('v=')) id = url.split('v=')[1].split('&')[0];
            else if (url.includes('live/')) id = url.split('live/')[1].split('?')[0];
            else id = url.split('/').pop();

            yt.style.display = "block";
            yt.src = "https://www.youtube.com/embed/" + id + "?autoplay=1&modestbranding=1";
            status.innerText = "";
        } 
        // Es M3U8?
        else {
            vid.style.display = "block";
            if (Hls.isSupported()) {
                hls.loadSource(url);
                hls.attachMedia(vid);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    vid.play().catch(e => {
                        status.innerText = "Toca Play para iniciar audio";
                        vid.muted = true; vid.play();
                    });
                    status.innerText = "";
                });
            } else {
                vid.src = url;
                vid.play();
                status.innerText = "";
            }
        }
    }

    // CARGAR LISTA CON GESTOR DE ERRORES
    async function cargarLista() {
        const githubURL = "https://raw.githubusercontent.com/lavozdemanaureapp/lavozdemanaure/main/canales.m3u";
        try {
            const resp = await fetch(githubURL);
            if(!resp.ok) throw new Error("Error en GitHub");
            const texto = await resp.text();
            
            const select = document.getElementById('lista');
            select.innerHTML = "";
            
            const lineas = texto.split('\n');
            lineas.forEach((linea, i) => {
                if (linea.includes('#EXTINF')) {
                    const nombre = linea.split(',')[1].trim();
                    const link = lineas[i+1].trim();
                    if(link.startsWith('http')) {
                        let opt = new Option(nombre.toUpperCase(), link);
                        select.add(opt);
                    }
                }
            });
            
            if (select.length > 0) conectar(select.value);
            else status.innerText = "Lista vacía";

        } catch (e) {
            status.innerText = "ERROR: No se pudo leer la lista de canales";
            console.error(e);
        }
    }

    cargarLista();
</script>

</body>
</html>
