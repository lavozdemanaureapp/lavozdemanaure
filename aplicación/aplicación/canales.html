<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manaure TV Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --rojo: #ff0000; }
        * { box-sizing: border-box; }
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        #master-player { width: 100%; aspect-ratio: 16 / 9; background: #000; position: relative; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        
        /* Contenedores de Video */
        video, #yt-frame { width: 100% !important; height: 100% !important; border: none; }
        #yt-frame { display: none; }

        /* PUBLICIDAD */
        #pub-overlay { position: absolute; top: 10px; right: 10px; width: 160px; z-index: 100; display: none; }
        #pub-overlay img { width: 100%; border: 2px solid var(--rojo); border-radius: 5px; }

        /* CHAT MODO CINE (Solo último mensaje, bien legible) */
        #chat-overlay { 
            position: absolute; 
            bottom: 60px; 
            left: 5%; 
            width: 90%; 
            height: 50px; /* Altura para un solo mensaje */
            z-index: 100; 
            display: none; 
            overflow: hidden; 
            background: rgba(0,0,0,0.6) !important; /* Fondo oscuro traslúcido para leer bien */
            border-radius: 10px;
            border-left: 5px solid var(--rojo);
            pointer-events: none; 
        }
        #chat-overlay iframe { width: 100%; height: 200%; margin-top: -145px; border: none; } /* Ajustado para ver el final */

        .btn-fullscreen { position: absolute; bottom: 10px; right: 10px; background: var(--rojo); color: white; border: none; padding: 10px 18px; border-radius: 20px; font-size: 11px; font-weight: bold; z-index: 101; cursor: pointer; }

        #interaction-area { flex: 1; display: flex; flex-direction: column; background: #0a0a0a; border-top: 2px solid var(--rojo); }
        #channel-bar { padding: 10px; }
        select { width: 100%; background: #1a1a1a; color: #fff; border: 1px solid var(--rojo); padding: 12px; border-radius: 8px; font-size: 15px; }
        #chat-frame { width: 100%; flex: 1; border: none; }
    </style>
</head>
<body>

    <div id="master-player">
        <iframe id="yt-frame" allow="autoplay; fullscreen" allowfullscreen></iframe>
        <video id="video" playsinline autoplay controls></video>
        <audio id="radio-audio" src="https://stream.zeno.fm/a0x4vvcp9whvv"></audio>
        
        <div id="pub-overlay"><img id="pub-img" src=""></div>
        <div id="chat-overlay"><iframe id="chat-cine-iframe" src="chat-manaure.html"></iframe></div>
        <button id="fs-button" class="btn-fullscreen" onclick="toggleFS()">MODO CINE</button>
    </div>

    <div id="interaction-area">
        <div id="channel-bar">
            <select id="channel-select"><option>Cargando Canales...</option></select>
        </div>
        <iframe id="chat-frame" src="chat-manaure.html"></iframe>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk", databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com", projectId: "radiomanaure" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const video = document.getElementById('video');
        const ytFrame = document.getElementById('yt-frame');
        const radio = document.getElementById('radio-audio');
        const fsButton = document.getElementById('fs-button');

        const hls = new Hls({ enableWorker: true, lowLatencyMode: true });

        function getYoutubeID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=|live\/)([^#&?]*).*/;
            const match = url.match(regExp);
            if (match && match[2].length === 11) return match[2];
            const liveMatch = url.split('/live/')[1]?.split('?')[0];
            return (liveMatch && liveMatch.length === 11) ? liveMatch : null;
        }

        window.play = (url) => {
            // Limpieza
            video.pause();
            video.style.display = "none";
            ytFrame.style.display = "none";
            ytFrame.src = "";
            hls.detachMedia();

            const ytId = getYoutubeID(url);

            if (ytId) {
                // MODO IFRAME DIRECTO (Indestructible)
                ytFrame.style.display = "block";
                ytFrame.src = `https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0&modestbranding=1`;
            } else {
                video.style.display = "block";
                if (url.includes('.m3u8')) {
                    if (Hls.isSupported()) {
                        hls.loadSource(url); hls.attachMedia(video);
                        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
                    }
                } else {
                    video.src = url;
                    video.play().catch(() => { video.muted = true; video.play(); });
                }
            }
        };

        window.toggleFS = () => {
            const el = document.getElementById('master-player');
            if (!document.fullscreenElement) {
                if (el.requestFullscreen) el.requestFullscreen();
                else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            } else { document.exitFullscreen(); }
        };

        document.addEventListener('fullscreenchange', () => {
            const chatCine = document.getElementById('chat-cine-iframe');
            if (document.fullscreenElement) {
                fsButton.innerText = "SALIR";
                chatCine.src = "chat-manaure.html?modo=cine";
            } else {
                fsButton.innerText = "MODO CINE";
                chatCine.src = "chat-manaure.html";
            }
        });

        async function loadM3U() {
            const url = "https://raw.githubusercontent.com/lavozdemanaureapp/lavozdemanaure/main/canales.m3u";
            try {
                const r = await fetch(url);
                const t = await r.text();
                const lines = t.split('\n');
                const select = document.getElementById('channel-select');
                select.innerHTML = '';
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes('#EXTINF')) {
                        const name = lines[i].split(',')[1].trim();
                        const link = lines[i+1]?.trim();
                        if (link?.startsWith('http')) select.add(new Option(name.toUpperCase(), link));
                    }
                }
                if (select.length > 0) play(select.options[0].value);
            } catch (e) { console.error(e); }
        }

        onValue(ref(db, 'publicidad_activa'), s => {
            const v = s.val();
            document.getElementById('pub-overlay').style.display = (v?.imagen && v.imagen !== 'OFF') ? 'block' : 'none';
            if(v?.imagen && v.imagen !== 'OFF') document.getElementById('pub-img').src = v.imagen;
        });
        onValue(ref(db, 'chat_visible'), s => {
            document.getElementById('chat-overlay').style.display = (s.val()?.estado === 'ON') ? 'block' : 'none';
        });
        onValue(ref(db, 'radio_activa'), s => {
            if(s.val()?.estado === 'ON') { radio.play(); video.muted = true; }
            else { radio.pause(); video.muted = false; }
        });

        document.getElementById('channel-select').onchange = (e) => play(e.target.value);
        loadM3U();
    </script>
</body>
</html>
