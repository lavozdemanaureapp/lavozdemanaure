<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Manaure TV</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, query, limitToLast, serverTimestamp, onDisconnect, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk", 
            databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com", 
            projectId: "radiomanaure" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const esModoCine = urlParams.get('modo') === 'cine';

        // --- CONTADOR (Solo en modo normal) ---
        if (!esModoCine && !window.location.href.includes('mando.html')) {
            const sessionId = localStorage.getItem('manaure_session') || Math.random().toString(36).substring(7);
            localStorage.setItem('manaure_session', sessionId);
            const presenciaRef = ref(db, 'audiencia/' + sessionId);
            set(presenciaRef, true);
            onDisconnect(presenciaRef).remove();
        }

        // --- LÓGICA DE MENSAJES (ÚLTIMOS 3 PARA CINE) ---
        const limite = esModoCine ? 3 : 50;
        const mensajesRef = query(ref(db, 'mensajes'), limitToLast(limite));
        
        onValue(mensajesRef, (snapshot) => {
            const contenedor = document.getElementById('mensajes');
            contenedor.innerHTML = ''; 
            snapshot.forEach((hijo) => {
                const dato = hijo.val();
                const div = document.createElement('div');
                div.className = esModoCine ? 'mensaje-item cine' : 'mensaje-item';
                div.innerHTML = `<span>${dato.usuario}:</span> ${dato.texto}`;
                contenedor.appendChild(div);
            });
            window.scrollTo(0, document.body.scrollHeight);
        });

        window.enviarMsg = () => {
            const user = document.getElementById('user').value || "OYENTE";
            const txt = document.getElementById('texto').value;
            if(txt.trim() !== "") {
                push(ref(db, 'mensajes'), { usuario: user.toUpperCase(), texto: txt, fecha: serverTimestamp() });
                document.getElementById('texto').value = "";
            }
        };
    </script>
    <style>
        html, body { background: transparent !important; margin: 0; padding: 0; overflow: hidden; }
        body { padding: 5px; color: white; font-family: sans-serif; }
        #mensajes { display: flex; flex-direction: column; gap: 4px; }

        /* MODO NORMAL (CHAT DE ABAJO) */
        .mensaje-item { 
            background: rgba(26, 26, 26, 0.95); 
            padding: 10px; 
            border-radius: 8px; 
            font-size: 14px; 
            border-left: 4px solid #ff0000;
            margin-bottom: 2px;
        }

        /* --- MODO CINE (SOBRE EL VIDEO - CASI INVISIBLE) --- */
        .mensaje-item.cine { 
            background: rgba(0, 0, 0, 0.1) !important; /* FONDO AL 10% (MUY CLARO) */
            border: none !important;
            padding: 2px 8px !important; 
            border-left: 3px solid #ff0000 !important; 
            font-size: 13px !important; 
            margin: 0 !important;
            line-height: 1.2 !important;
            /* CONTORNO FUERTE EN LAS LETRAS PARA QUE SE LEAN */
            text-shadow: 
                -1px -1px 2px #000,  
                 1px -1px 2px #000,
                -1px  1px 2px #000,
                 1px  1px 2px #000 !important;
        }

        .mensaje-item span { color: #ff0000; font-weight: bold; margin-right: 5px; text-transform: uppercase; }

        #input-area { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: #111; padding: 10px; display: flex; gap: 5px; 
            border-top: 1px solid #333; box-sizing: border-box; 
        }
        input { background: #222; border: 1px solid #444; color: white; padding: 10px; border-radius: 5px; }
        #user { width: 30%; } #texto { flex: 1; }
        button { background: #ff0000; color: white; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="mensajes"></div>
    <script>
        // Ocultar input en modo cine
        if (new URLSearchParams(window.location.search).get('modo') === 'cine') {
            document.write('<style>#input-area { display: none !important; }</style>');
        }
    </script>
    <div id="input-area">
        <input type="text" id="user" placeholder="Nombre">
        <input type="text" id="texto" placeholder="Mensaje..." onkeypress="if(event.key==='Enter') enviarMsg()">
        <button onclick="enviarMsg()">OK</button>
    </div>
</body>
</html>
