<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chat Manaure TV</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, query, limitToLast, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk", 
            databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com", 
            projectId: "radiomanaure" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- LÓGICA DE RECEPCIÓN (Últimos 5 mensajes) ---
        const mensajesRef = query(ref(db, 'mensajes'), limitToLast(5));
        
        onValue(mensajesRef, (snapshot) => {
            const contenedor = document.getElementById('mensajes');
            contenedor.innerHTML = ''; 
            snapshot.forEach((hijo) => {
                const dato = hijo.val();
                const div = document.createElement('div');
                div.className = 'mensaje-item';
                div.innerHTML = `<span>${dato.usuario}:</span> ${dato.texto}`;
                contenedor.appendChild(div);
            });
            // Siempre desplazar al último mensaje
            window.scrollTo(0, document.body.scrollHeight);
        });

        // --- LÓGICA DE ENVÍO ---
        window.enviarMsg = () => {
            const user = document.getElementById('user').value || "Oyente";
            const txt = document.getElementById('texto').value;
            if(txt.trim() !== "") {
                push(ref(db, 'mensajes'), {
                    usuario: user.toUpperCase(),
                    texto: txt,
                    fecha: serverTimestamp()
                });
                document.getElementById('texto').value = "";
            }
        };
    </script>
    <style>
        body { 
            margin: 0; 
            padding: 5px; 
            background: transparent; /* Para que se vea bien sobre el video */
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }
        
        /* Contenedor de mensajes */
        #mensajes { 
            display: flex; 
            flex-direction: column; 
            gap: 4px;
            margin-bottom: 50px; /* Espacio para que el input no tape mensajes */
        }

        .mensaje-item { 
            background: rgba(0, 0, 0, 0.6); 
            padding: 6px 10px; 
            border-radius: 6px; 
            font-size: 14px; 
            line-height: 1.3;
            animation: fadeIn 0.3s ease;
            border-left: 3px solid #ff0000;
        }

        .mensaje-item span { color: #ff0000; font-weight: bold; margin-right: 5px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* AREA DE ENTRADA (Se oculta en el modo cine por el recorte del iframe) */
        #input-area { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            background: #111; 
            padding: 8px; 
            display: flex; 
            gap: 5px;
            border-top: 1px solid #333;
        }

        input { 
            background: #222; 
            border: 1px solid #444; 
            color: white; 
            padding: 8px; 
            border-radius: 4px; 
            font-size: 14px;
        }
        #user { width: 30%; }
        #texto { flex: 1; }
        button { background: #ff0000; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="mensajes"></div>

    <div id="input-area">
        <input type="text" id="user" placeholder="Nombre">
        <input type="text" id="texto" placeholder="Mensaje..." onkeypress="if(event.key==='Enter') enviarMsg()">
        <button onclick="enviarMsg()">OK</button>
    </div>

</body>
</html>
