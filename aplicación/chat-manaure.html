<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Manaure TV</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, query, limitToLast, serverTimestamp, onDisconnect, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk", 
            databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com", 
            projectId: "radiomanaure" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const esModoCine = urlParams.get('modo') === 'cine';

        // --- CONTADOR ---
        if (!esModoCine && !window.location.href.includes('mando.html')) {
            const sessionId = localStorage.getItem('manaure_session') || Math.random().toString(36).substring(7);
            localStorage.setItem('manaure_session', sessionId);
            const presenciaRef = ref(db, 'audiencia/' + sessionId);
            set(presenciaRef, true);
            onDisconnect(presenciaRef).remove();
        }

        // --- MENSAJES (3 PARA CINE, 50 PARA NORMAL) ---
        const limite = esModoCine ? 3 : 50;
        const mensajesRef = query(ref(db, 'mensajes'), limitToLast(limite));
        
        onValue(mensajesRef, (snapshot) => {
            const contenedor = document.getElementById('mensajes');
            contenedor.innerHTML = ''; 
            snapshot.forEach((hijo) => {
                const dato = hijo.val();
                const div = document.createElement('div');
                div.className = esModoCine ? 'mensaje-item cine' : 'mensaje-item normal';
                div.innerHTML = `<span>${dato.usuario}:</span> ${dato.texto}`;
                contenedor.appendChild(div);
            });
            // FORZAR EL SCROLL AL FINAL CON UN PEQUEÑO RETRASO PARA QUE CARGUE BIEN
            setTimeout(() => {
                window.scrollTo(0, document.body.scrollHeight);
            }, 100);
        });

        window.enviarMsg = () => {
            const user = document.getElementById('user').value || "OYENTE";
            const txt = document.getElementById('texto').value;
            if(txt.trim() !== "") {
                push(ref(db, 'mensajes'), { usuario: user.toUpperCase(), texto: txt, fecha: serverTimestamp() });
                document.getElementById('texto').value = "";
            }
        };
    </script>
    <style>
        /* MATAMOS EL FONDO NEGRO DE TODA LA WEB */
        html, body { 
            background: transparent !important; /* TRANSPARENCIA TOTAL */
            margin: 0; 
            padding: 0; 
            height: 100%;
            color: white;
            font-family: sans-serif;
        }

        body { 
            overflow-y: auto; 
            display: flex;
            flex-direction: column;
        }

        /* Si es modo cine, prohibido el scroll para que no salgan barras feas */
        body.modo-cine { overflow: hidden !important; }

        #mensajes { 
            display: flex; 
            flex-direction: column; 
            gap: 5px; 
            padding: 10px;
            padding-bottom: 80px; /* Espacio para que el último mensaje no se tape con el input */
        }

        .modo-cine #mensajes { padding-bottom: 5px; }

        /* --- MENSAJES EN PANTALLA NORMAL --- */
        .mensaje-item.normal { 
            background: rgba(30, 30, 30, 0.8); /* Gris muy suave, no negro puro */
            padding: 10px; 
            border-radius: 8px; 
            border-left: 5px solid #ff0000;
            font-size: 14px;
        }

        /* --- MENSAJES EN MODO CINE (CRISTALINOS) --- */
        .mensaje-item.cine { 
            background: rgba(0, 0, 0, 0.1) !important; /* FONDO CASI INEXISTENTE */
            padding: 4px 10px !important; 
            border-left: 4px solid #ff0000 !important; 
            font-size: 13px !important;
            line-height: 1.2;
            text-shadow: 2px 2px 4px #000; /* Letras con sombra para que se vean */
        }

        .mensaje-item span { color: #ff0000; font-weight: bold; margin-right: 5px; text-transform: uppercase; }

        /* AREA DE ENTRADA */
        #input-area { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: rgba(15, 15, 15, 0.95); /* El input sí tiene fondo para ver qué escribes */
            padding: 12px; display: flex; gap: 8px; 
            border-top: 1px solid #333; box-sizing: border-box; 
        }
        input { background: #222; border: 1px solid #444; color: white; padding: 10px; border-radius: 5px; flex: 1; }
        #user { width: 80px; flex: none; }
        button { background: #ff0000; color: white; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body id="cuerpo">
    <div id="mensajes"></div>

    <script>
        const esCine = new URLSearchParams(window.location.search).get('modo') === 'cine';
        if (esCine) {
            document.getElementById('cuerpo').classList.add('modo-cine');
            document.write('<style>#input-area { display: none !important; }</style>');
        }
    </script>

    <div id="input-area">
        <input type="text" id="user" placeholder="Nombre">
        <input type="text" id="texto" placeholder="Mensaje..." onkeypress="if(event.key==='Enter') enviarMsg()">
        <button onclick="enviarMsg()">OK</button>
    </div>
</body>
</html>
