<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Manaure TV</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, query, limitToLast, serverTimestamp, onDisconnect, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk", 
            databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com", 
            projectId: "radiomanaure" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const esModoCine = urlParams.get('modo') === 'cine';

        if (!esModoCine && !window.location.href.includes('mando.html')) {
            const sessionId = localStorage.getItem('manaure_session') || Math.random().toString(36).substring(7);
            localStorage.setItem('manaure_session', sessionId);
            const presenciaRef = ref(db, 'audiencia/' + sessionId);
            set(presenciaRef, true);
            onDisconnect(presenciaRef).remove();
        }

        // --- FORZAMOS LOS ÚLTIMOS 5 ---
        const limite = esModoCine ? 5 : 50;
        const mensajesRef = query(ref(db, 'mensajes'), limitToLast(limite));
        
        onValue(mensajesRef, (snapshot) => {
            const contenedor = document.getElementById('mensajes');
            contenedor.innerHTML = ''; 
            snapshot.forEach((hijo) => {
                const dato = hijo.val();
                const div = document.createElement('div');
                div.className = esModoCine ? 'mensaje-item cine' : 'mensaje-item';
                div.innerHTML = `<span>${dato.usuario}:</span> ${dato.texto}`;
                contenedor.appendChild(div);
            });
            // Esto asegura que siempre veamos los de abajo (los más nuevos)
            window.scrollTo(0, document.body.scrollHeight);
        });

        window.enviarMsg = () => {
            const user = document.getElementById('user').value || "OYENTE";
            const txt = document.getElementById('texto').value;
            if(txt.trim() !== "") {
                push(ref(db, 'mensajes'), { usuario: user.toUpperCase(), texto: txt, fecha: serverTimestamp() });
                document.getElementById('texto').value = "";
            }
        };
    </script>
    <style>
        body { margin: 0; padding: 2px; background: transparent !important; color: white; font-family: sans-serif; overflow: hidden; }
        #mensajes { display: flex; flex-direction: column; gap: 2px; }

        /* MODO NORMAL (EL DE ABAJO) */
        .mensaje-item { 
            background: #1a1a1a; 
            padding: 8px; 
            border-radius: 6px; 
            font-size: 14px; 
            border-left: 4px solid #ff0000;
            margin-bottom: 2px;
        }

        /* --- MODO CINE (SOBRE EL VIDEO) --- */
        .mensaje-item.cine { 
            background: rgba(0, 0, 0, 0.15) !important; /* FONDO MUY CLARITO, CASI INVISIBLE */
            border: none !important;
            padding: 2px 6px !important; 
            border-left: 3px solid #ff0000 !important; 
            font-size: 12px; /* Un pelín más pequeño para que quepan los 5 sin cortarse */
            margin: 0 !important;
            line-height: 1.1 !important;
            text-shadow: 1px 1px 2px #000; /* Sombra para que se lea sobre el video */
        }

        .mensaje-item span { color: #ff0000; font-weight: bold; margin-right: 4px; text-transform: uppercase; }

        #input-area { position: fixed; bottom: 0; left: 0; width: 100%; background: #111; padding: 10px; display: flex; gap: 5px; border-top: 1px solid #333; box-sizing: border-box; }
        input { background: #222; border: 1px solid #444; color: white; padding: 10px; border-radius: 5px; font-size: 14px; }
        #user { width: 30%; } #texto { flex: 1; }
        button { background: #ff0000; color: white; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="mensajes"></div>
    <div id="input-area">
        <input type="text" id="user" placeholder="Nombre">
        <input type="text" id="texto" placeholder="Mensaje..." onkeypress="if(event.key==='Enter') enviarMsg()">
        <button onclick="enviarMsg()">OK</button>
    </div>
</body>
</html>
