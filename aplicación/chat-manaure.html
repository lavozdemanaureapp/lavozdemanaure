<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chat Pro</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, query, limitToLast, serverTimestamp, onDisconnect, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk", 
            databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com", 
            projectId: "radiomanaure" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- DETECTAR MODO (CINE O NORMAL) ---
        const urlParams = new URLSearchParams(window.location.search);
        const esModoCine = urlParams.get('modo') === 'cine';

        // --- LÓGICA DE AUDIENCIA (OCULTA) ---
        const presenciaRef = ref(db, 'audiencia/' + Math.random().toString(36).substr(2, 9));
        const totalRef = ref(db, 'estadisticas/online');

        // Al entrar, sumar uno
        set(presenciaRef, true);
        onDisconnect(presenciaRef).remove(); // Al salir, quitar este registro

        // Escuchar el total para el botón oculto
        onValue(ref(db, 'audiencia'), (snap) => {
            const online = snap.size || 0;
            document.getElementById('count-num').innerText = online;
        });

        // --- LÓGICA DE MENSAJES ---
        // Si es modo cine limita a 5, si no, muestra los últimos 50
        const limite = esModoCine ? 5 : 50;
        const mensajesRef = query(ref(db, 'mensajes'), limitToLast(limite));
        
        onValue(mensajesRef, (snapshot) => {
            const contenedor = document.getElementById('mensajes');
            contenedor.innerHTML = ''; 
            snapshot.forEach((hijo) => {
                const dato = hijo.val();
                contenedor.innerHTML += `<div class="mensaje-item"><span>${dato.usuario}:</span> ${dato.texto}</div>`;
            });
            window.scrollTo(0, document.body.scrollHeight);
        });

        window.enviarMsg = () => {
            const user = document.getElementById('user').value || "Oyente";
            const txt = document.getElementById('texto').value;
            if(txt.trim() !== "") {
                push(ref(db, 'mensajes'), { usuario: user.toUpperCase(), texto: txt, fecha: serverTimestamp() });
                document.getElementById('texto').value = "";
            }
        };

        // Función para ver estadísticas (Botón oculto)
        window.verStats = () => {
            const s = document.getElementById('stats-box');
            s.style.display = s.style.display === 'none' ? 'block' : 'none';
        };
    </script>
    <style>
        body { margin: 0; padding: 5px; background: transparent; color: white; font-family: sans-serif; overflow-x: hidden; }
        #mensajes { display: flex; flex-direction: column; gap: 4px; padding-bottom: 60px; }
        .mensaje-item { background: rgba(0,0,0,0.6); padding: 6px 10px; border-radius: 6px; font-size: 14px; border-left: 3px solid #ff0000; }
        .mensaje-item span { color: #ff0000; font-weight: bold; }
        
        #input-area { position: fixed; bottom: 0; left: 0; width: 100%; background: #111; padding: 8px; display: flex; gap: 5px; border-top: 1px solid #333; }
        input { background: #222; border: 1px solid #444; color: white; padding: 8px; border-radius: 4px; font-size: 14px; }
        #user { width: 30%; } #texto { flex: 1; }
        button { background: #ff0000; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; }

        /* BOTÓN OCULTO DE ESTADÍSTICAS */
        #btn-hidden { opacity: 0.05; position: fixed; bottom: 5px; right: 5px; font-size: 10px; cursor: pointer; color: white; }
        #stats-box { 
            display: none; position: fixed; bottom: 45px; right: 10px; 
            background: #ff0000; color: white; padding: 10px; border-radius: 8px; 
            font-weight: bold; z-index: 1000; box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* Solo mostrar botón oculto en celulares */
        @media (min-width: 768px) { #btn-hidden { display: none; } }
    </style>
</head>
<body>
    <div id="mensajes"></div>
    <div id="input-area">
        <input type="text" id="user" placeholder="Nombre">
        <input type="text" id="texto" placeholder="Mensaje..." onkeypress="if(event.key==='Enter') enviarMsg()">
        <button onclick="enviarMsg()">OK</button>
    </div>

    <div id="btn-hidden" onclick="verStats()">.ESTADISTICAS</div>
    <div id="stats-box">CONECTADOS: <span id="count-num">0</span></div>
</body>
</html>
