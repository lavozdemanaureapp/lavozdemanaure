<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Manaure TV</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, query, limitToLast, serverTimestamp, onDisconnect, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk", 
            databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com", 
            projectId: "radiomanaure" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- 1. CONTADOR DE AUDIENCIA (CORREGIDO PARA NO CONTAR DOBLE) ---
        const sessionId = Math.random().toString(36).substring(7);
        const presenciaRef = ref(db, 'audiencia/' + sessionId);
        
        // Solo cuenta si NO es el mando para mayor precisión
        if (!window.location.href.includes('mando.html')) {
            set(presenciaRef, true);
            onDisconnect(presenciaRef).remove();
        }

        // --- 2. DETECTAR MODO (CINE O NORMAL) ---
        const urlParams = new URLSearchParams(window.location.search);
        const esModoCine = urlParams.get('modo') === 'cine';

        // --- 3. LÓGICA DE MENSAJES (ÚLTIMOS 5 EN MODO CINE) ---
        const limite = esModoCine ? 5 : 50;
        const mensajesRef = query(ref(db, 'mensajes'), limitToLast(limite));
        
        onValue(mensajesRef, (snapshot) => {
            const contenedor = document.getElementById('mensajes');
            contenedor.innerHTML = ''; 
            snapshot.forEach((hijo) => {
                const dato = hijo.val();
                const div = document.createElement('div');
                div.className = 'mensaje-item';
                
                // Si es modo cine, aplicamos la transparencia extra
                if (esModoCine) {
                    div.style.background = "rgba(0, 0, 0, 0.45)"; 
                    div.style.fontSize = "13px";
                    div.style.margin = "2px 0";
                }
                
                div.innerHTML = `<span>${dato.usuario}:</span> ${dato.texto}`;
                contenedor.appendChild(div);
            });
            // Auto-scroll al final
            window.scrollTo(0, document.body.scrollHeight);
        });

        window.enviarMsg = () => {
            const user = document.getElementById('user').value || "Oyente";
            const txt = document.getElementById('texto').value;
            if(txt.trim() !== "") {
                push(ref(db, 'mensajes'), {
                    usuario: user.toUpperCase(),
                    texto: txt,
                    fecha: serverTimestamp()
                });
                document.getElementById('texto').value = "";
            }
        };
    </script>
    <style>
        body { 
            margin: 0; 
            padding: 5px; 
            background: transparent; 
            color: white; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }
        
        #mensajes { 
            display: flex; 
            flex-direction: column; 
            gap: 4px;
            padding-bottom: 60px; /* Espacio para el input */
        }

        .mensaje-item { 
            background: rgba(0, 0, 0, 0.7); 
            padding: 6px 10px; 
            border-radius: 8px; 
            font-size: 14px; 
            line-height: 1.3;
            border-left: 4px solid #ff0000;
            color: #fff;
            text-shadow: 1px 1px 2px #000; /* Para leer sobre el video */
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .mensaje-item span { color: #ff0000; font-weight: bold; margin-right: 5px; text-transform: uppercase; font-size: 0.85em; }

        /* AREA DE ENTRADA (Se oculta visualmente si el iframe es pequeño) */
        #input-area { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            background: #111; 
            padding: 10px; 
            display: flex; 
            gap: 5px;
            border-top: 1px solid #333;
            box-sizing: border-box;
        }

        input { 
            background: #222; 
            border: 1px solid #444; 
            color: white; 
            padding: 10px; 
            border-radius: 5px; 
            font-size: 14px;
        }
        #user { width: 30%; }
        #texto { flex: 1; }
        button { background: #ff0000; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="mensajes"></div>

    <div id="input-area">
        <input type="text" id="user" placeholder="Tu Nombre">
        <input type="text" id="texto" placeholder="Escribe aquí..." onkeypress="if(event.key==='Enter') enviarMsg()">
        <button onclick="enviarMsg()">OK</button>
    </div>

</body>
</html>
