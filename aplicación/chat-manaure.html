<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; color: white; font-family: sans-serif; margin: 0; padding: 5px; overflow: hidden; }
        #msg-container { height: calc(100vh - 45px); overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
        .msg { background: rgba(255,255,255,0.1); padding: 8px; border-radius: 6px; border-left: 3px solid red; font-size: 13px; }
        .input-area { display: flex; gap: 5px; margin-top: 5px; }
        input { flex: 1; background: #222; border: 1px solid #444; color: white; padding: 8px; border-radius: 4px; }
        button { background: red; color: white; border: none; padding: 0 15px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="msg-container"></div>
    <div class="input-area">
        <input type="text" id="chat-in" placeholder="Tu mensaje...">
        <button id="btn-enviar">➔</button>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, serverTimestamp, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        const firebaseConfig = { apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk", databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com", projectId: "radiomanaure" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const chatRef = query(ref(db, 'mensajes'), limitToLast(15));
        onChildAdded(chatRef, (snap) => {
            const div = document.createElement('div');
            div.className = 'msg';
            div.innerHTML = `<b>Oyente:</b> ${snap.val().texto}`;
            document.getElementById('msg-container').appendChild(div);
            document.getElementById('msg-container').scrollTop = 99999;
        });
        window.enviar = () => {
            const inp = document.getElementById('chat-in');
            if(inp.value.trim()) push(ref(db, 'mensajes'), { texto: inp.value, fecha: serverTimestamp() });
            inp.value = "";
        };
        document.getElementById('btn-enviar').onclick = window.enviar;
    </script>
</body>
</html>
