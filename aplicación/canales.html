<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TV Manaure - Sistema Híbrido Horizontal</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --rojo: #ff0000; --negro: #0c0c0c; }
        body { margin: 0; background: var(--negro); color: #fff; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        /* SIDEBAR */
        #sidebar { position: fixed; left: -260px; top: 0; width: 250px; height: 100%; background: #000; border-right: 2px solid var(--rojo); z-index: 10001; transition: 0.4s; display: flex; flex-direction: column; align-items: center; padding-top: 20px; }
        #sidebar.active { left: 0; }
        .menu-toggle { position: absolute; top: 12px; left: 12px; z-index: 10002; background: rgba(0,0,0,0.8); color: white; border: 1px solid var(--rojo); padding: 10px; border-radius: 5px; cursor: pointer; }
        .nav-item { width: 85%; padding: 12px; margin: 5px 0; border-radius: 8px; background: #1a1a1a; display: flex; align-items: center; gap: 12px; cursor: pointer; text-decoration: none; color: white; font-size: 14px; }
        
        #main-content { width: 100%; display: flex; flex-direction: column; position: relative; }
        
        /* CONTENEDOR DE VIDEO (EL QUE SE AMPLÍA) */
        #player-canvas { 
            width: 100%; 
            aspect-ratio: 16 / 9; 
            background: #000; 
            position: relative; 
            border-bottom: 2px solid var(--rojo); 
            overflow: hidden; 
            flex-shrink: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        
        /* Ajuste Fullscreen */
        #player-canvas:fullscreen { width: 100vw; height: 100vh; border: none; }
        #player-canvas:-webkit-full-screen { width: 100vw; height: 100vh; }

        video { width: 100%; height: 100%; object-fit: contain; display: block; }
        iframe#video-kick { width: 100%; height: 100%; border: none; display: none; }

        /* PUBLICIDAD */
        #ad-layer { position: absolute; top: 15px; right: 15px; width: 120px; z-index: 1000; display: none; pointer-events: none; }
        #banner-img { width: 100%; border-radius: 8px; border: 1px solid white; }

        .btn-vid { position: absolute; bottom: 10px; right: 10px; background: rgba(255,0,0,0.7); color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; z-index: 10005; font-size: 10px; font-weight: bold; }
        
        #interaction-area { flex: 1; display: flex; flex-direction: column; background: #050505; }
        #channel-bar { background: #111; padding: 10px; border-bottom: 1px solid #222; }
        select { background: #000; color: white; border: 1px solid #333; padding: 10px; border-radius: 5px; width: 100%; font-weight: bold; }
        iframe#chat-frame { width: 100%; flex: 1; border: none; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 10000; }
    </style>
</head>
<body>

    <div class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
    <div id="overlay" onclick="toggleMenu()"></div>

    <div id="sidebar">
        <img src="logo_v2.png" style="width: 70px; margin-bottom: 10px;">
        <h4 style="color: var(--rojo); margin: 0; font-size: 15px;">MANAURE 92.3</h4>
        <div style="margin-top: 20px; width: 100%; display: flex; flex-direction: column; align-items: center;">
            <a href="index.html" class="nav-item"><i class="fas fa-broadcast-tower"></i> Radio</a>
            <a href="programas.html" class="nav-item"><i class="fas fa-microphone-lines"></i> Archivo</a>
            <a href="canales.html" class="nav-item" style="border-left: 4px solid var(--rojo); background: #222;"><i class="fas fa-tv"></i> TV Gratis</a>
        </div>
    </div>

    <div id="main-content">
        <div id="player-canvas">
            <div id="ad-layer"><img id="banner-img" src=""></div>
            <video id="video" playsinline autoplay controls></video>
            <iframe id="video-kick" allowfullscreen="true"></iframe>
            <button id="btnFS" class="btn-vid" onclick="toggleFS()"><i class="fas fa-expand"></i> AMPLIAR PANTALLA</button>
        </div>
        <div id="interaction-area">
            <div id="channel-bar"><select id="channel-select"><option>Cargando lista...</option></select></div>
            <iframe id="chat-frame" src="chat-manaure.html"></iframe>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk", 
            databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com", 
            projectId: "radiomanaure" 
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const videoHLS = document.getElementById('video');
        const videoKICK = document.getElementById('video-kick');
        const canvas = document.getElementById('player-canvas');
        const hls = new Hls({ maxBufferLength: 45, startLevel: 0, enableWorker: true });

        // --- FUNCION FULLSCREEN HORIZONTAL ---
        window.toggleFS = () => {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (canvas.requestFullscreen) canvas.requestFullscreen();
                else if (canvas.webkitRequestFullscreen) canvas.webkitRequestFullscreen();
                
                // Bloqueo de rotación
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(() => {});
                }
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        };

        window.toggleMenu = () => {
            document.getElementById('sidebar').classList.toggle('active');
            const ov = document.getElementById('overlay');
            ov.style.display = (ov.style.display === 'block') ? 'none' : 'block';
        };

        window.play = (url) => {
            if (url.startsWith('kick://')) {
                const user = url.replace('kick://', '');
                videoHLS.style.display = 'none';
                videoHLS.pause();
                videoKICK.src = `https://player.kick.com/${user}`;
                videoKICK.style.display = 'block';
            } else {
                videoKICK.style.display = 'none';
                videoKICK.src = "";
                videoHLS.style.display = 'block';
                if (Hls.isSupported()) {
                    hls.loadSource(url); hls.attachMedia(videoHLS);
                } else if (videoHLS.canPlayType('application/vnd.apple.mpegurl')) {
                    videoHLS.src = url;
                }
            }
        };

        async function loadM3U() {
            const r = await fetch('canales.m3u?v=' + new Date().getTime());
            const t = await r.text();
            const lines = t.split('\n');
            const select = document.getElementById('channel-select');
            select.innerHTML = '';
            let name = "";
            
            lines.forEach(l => {
                const line = l.trim();
                if(line.startsWith('#EXTINF')) {
                    name = line.split(',')[1];
                } else if(line.length > 5 && (line.startsWith('http') || line.startsWith('kick://'))) {
                    let o = document.createElement('option'); 
                    o.value = line; 
                    o.innerText = name ? name.toUpperCase() : "CANAL";
                    select.appendChild(o);
                }
            });
            if(select.options.length > 0) play(select.options[0].value);
        }

        document.getElementById('channel-select').onchange = (e) => play(e.target.value);
        loadM3U();

        onValue(ref(db, 'publicidad_activa'), (snap) => {
            const d = snap.val();
            const capa = document.getElementById('ad-layer');
            if(d && d.imagen !== "OFF") {
                document.getElementById('banner-img').src = d.imagen;
                capa.style.display = 'block';
            } else { capa.style.display = 'none'; }
        });
    </script>
</body>
</html>
