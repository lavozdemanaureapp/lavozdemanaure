<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TV Digital - La Voz de Manaure</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --red-m: #ff0000; --bg: #0c0c0c; --card: #1a1a1a; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* MENU LATERAL CORREGIDO */
        #sidebar { 
            position: fixed; left: -260px; top: 0; width: 250px; height: 100%; 
            background: #000; border-right: 2px solid var(--red-m); 
            z-index: 10001; transition: 0.4s; display: flex; flex-direction: column; align-items: center; padding-top: 20px;
        }
        #sidebar.active { left: 0; }
        .menu-toggle { position: absolute; top: 12px; left: 12px; z-index: 10002; background: rgba(0,0,0,0.8); color: white; border: 1px solid var(--red-m); padding: 10px; border-radius: 5px; cursor: pointer; }
        .nav-item { width: 85%; padding: 12px; margin: 5px 0; border-radius: 8px; background: var(--card); display: flex; align-items: center; gap: 12px; cursor: pointer; text-decoration: none; color: white; font-size: 14px; }
        .nav-active { border-left: 4px solid var(--red-m); background: #222; }

        /* CONTENEDOR PRINCIPAL */
        #main-content { flex: 1; display: flex; flex-direction: column; width: 100%; position: relative; }

        /* LÓGICA DE PANTALLA HORIZONTAL (TU CÓDIGO) */
        #main-screen { 
            width: 100%; 
            aspect-ratio: 16/9; 
            background: #000; 
            position: relative; 
            border-bottom: 2px solid var(--red-m); 
            overflow: hidden;
            flex-shrink: 0;
        }
        video { width: 100%; height: 100%; object-fit: cover; } /* Cover para llenar horizontal */

        /* ELEMENTOS FLOTANTES */
        #camera-layer {
            position: absolute; top: 10px; right: 10px; width: 80px; height: 80px;
            border-radius: 50%; border: 2px solid var(--red-m); overflow: hidden;
            z-index: 100; display: none;
        }
        .btn-ampliar {
            position: absolute; bottom: 10px; right: 10px;
            background: rgba(0,0,0,0.7); color: white; border: 1px solid var(--red-m);
            padding: 5px 10px; font-size: 10px; border-radius: 4px; z-index: 101; cursor: pointer;
        }

        /* AREA INFERIOR: CHAT Y LISTA */
        .content-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #050505; }
        
        #channel-bar { background: #111; padding: 8px 15px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #222; }
        select { background: #000; color: white; border: 1px solid #333; padding: 6px; border-radius: 4px; flex: 1; }

        #chat-container { flex: 1; width: 100%; }
        iframe#chat-frame { width: 100%; height: 100%; border: none; }

        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 10000; }
    </style>
</head>
<body>

    <div class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
    <div id="overlay" onclick="toggleMenu()"></div>

    <div id="sidebar">
        <img src="logo_v2.png" style="width: 70px; margin-bottom: 10px;">
        <span style="font-weight: bold; font-size: 14px; color: var(--red-m);">MANAURE 92.3</span>
        <div style="margin-top: 20px; width: 100%; display: flex; flex-direction: column; align-items: center;">
            <a href="index.html" class="nav-item"><i class="fas fa-radio"></i> Radio en Vivo</a>
            <a href="programas.html" class="nav-item"><i class="fas fa-microphone-lines"></i> Archivo</a>
            <a href="micambio.html" class="nav-item"><i class="fas fa-sack-dollar"></i> Mi Cambio</a>
            <a href="canales.html" class="nav-item nav-active"><i class="fas fa-tv"></i> TV Gratis</a>
        </div>
    </div>

    <div id="main-content">
        <div id="main-screen">
            <video id="video-player" playsinline autoplay></video>
            
            <div id="camera-layer">
                <iframe id="ifr-cam" src="" allow="camera;microphone;autoplay" style="width:100%; height:100%; border:none; transform: scale(1.5);"></iframe>
            </div>

            <button class="btn-ampliar" onclick="toggleFS()">
                <i class="fas fa-expand"></i> <span id="btn-txt">AMPLIAR</span>
            </button>
        </div>

        <div class="content-area">
            <div id="channel-bar">
                <span style="font-size: 11px; color: var(--red-m); font-weight: bold;">CANALES:</span>
                <select id="channel-select"><option>Cargando...</option></select>
            </div>
            <div id="chat-container">
                <iframe id="chat-frame" src="chat-manaure.html"></iframe>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk",
            databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com",
            projectId: "radiomanaure"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const video = document.getElementById('video-player');
        const hls = new Hls();

        window.toggleMenu = () => {
            document.getElementById('sidebar').classList.toggle('active');
            const ov = document.getElementById('overlay');
            ov.style.display = (ov.style.display === 'block') ? 'none' : 'block';
        };

        window.toggleFS = () => {
            const screen = document.getElementById('main-screen');
            const txt = document.getElementById('btn-txt');
            if (!document.fullscreenElement) {
                if (screen.requestFullscreen) screen.requestFullscreen();
                else if (screen.webkitRequestFullscreen) screen.webkitRequestFullscreen();
                txt.innerText = "VOLVER";
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                txt.innerText = "AMPLIAR";
            }
        };

        async function loadM3U() {
            const r = await fetch('canales.m3u');
            const t = await r.text();
            const lines = t.split('\n');
            const select = document.getElementById('channel-select');
            select.innerHTML = '';
            let name = "";
            lines.forEach(l => {
                if(l.startsWith('#EXTINF')) name = l.split(',')[1];
                else if(l.startsWith('http')) {
                    let o = document.createElement('option'); o.value = l.trim(); o.innerText = name;
                    select.appendChild(o);
                }
            });
            if(select.options.length > 0) play(select.options[0].value);
        }

        function play(url) {
            if (Hls.isSupported()) { hls.loadSource(url); hls.attachMedia(video); }
            else { video.src = url; }
        }

        document.getElementById('channel-select').onchange = (e) => play(e.target.value);
        loadM3U();

        onValue(ref(db, 'cabina_activa'), (snap) => {
            const d = snap.val();
            const layer = document.getElementById('camera-layer');
            const ifr = document.getElementById('ifr-cam');
            if(d && d.estado === "ON") {
                ifr.src = d.url + "&mute=1&autoplay=1";
                layer.style.display = 'block';
            } else { layer.style.display = 'none'; ifr.src = ""; }
        });
    </script>
</body>
</html>
