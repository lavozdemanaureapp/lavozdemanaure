<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANAURE - Canales en Vivo</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        #player-container { position: relative; width: 100vw; height: 100vh; background: #000; }
        video { width: 100%; height: 100%; object-fit: contain; }
        
        /* EL CÍRCULO DE LA CABINA */
        #camera-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #ff0000;
            overflow: hidden;
            display: none; /* Se activa desde el mando */
            z-index: 9999;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
            background: #000;
        }

        /* BANNER DE PUBLICIDAD */
        #banner-pub {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 250px;
            display: none;
            z-index: 9998;
            transition: 0.5s;
        }
        #banner-pub img { width: 100%; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div id="player-container">
        <video id="video" controls autoplay></video>

        <div id="camera-layer">
            <iframe id="iframe-camera" src="" allow="camera;microphone" style="width:100%; height:100%; border:none; transform: scale(1.4);"></iframe>
        </div>

        <div id="banner-pub">
            <img id="img-pub" src="" alt="Publicidad">
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk",
            databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com",
            projectId: "radiomanaure"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 1. LÓGICA DEL VIDEO (HLS)
        const video = document.getElementById('video');
        const videoSrc = 'https://lavozdemanaureapp.github.io/lavozdemanaure/aplicación/canales.m3u'; // Ajusta si el m3u tiene otra ruta

        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
        }

        // 2. LÓGICA DE LA CÁMARA EN VIVO (CABINA)
        const cabinaRef = ref(db, 'cabina_activa');
        onValue(cabinaRef, (snapshot) => {
            const data = snapshot.val();
            const layer = document.getElementById('camera-layer');
            const iframe = document.getElementById('iframe-camera');
            
            if (data && data.estado === "ON") {
                if (iframe.src !== data.url) iframe.src = data.url;
                layer.style.display = 'block';
            } else {
                layer.style.display = 'none';
                iframe.src = ""; 
            }
        });

        // 3. LÓGICA DE LA PUBLICIDAD
        const pubRef = ref(db, 'publicidad_activa');
        onValue(pubRef, (snapshot) => {
            const data = snapshot.val();
            const banner = document.getElementById('banner-pub');
            const img = document.getElementById('img-pub');

            if (data && data.imagen !== "OFF") {
                img.src = data.imagen; 
                banner.style.display = 'block';
            } else {
                banner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
