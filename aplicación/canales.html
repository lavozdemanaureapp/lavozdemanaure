<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TV Digital - La Voz de Manaure</title>
    
    <link rel="manifest" href="manifest.json?v=30">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        :root { --red-m: #ff0000; --bg: #000; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 0; }

        /* CONTENEDOR MAESTRO */
        #player-canvas {
            position: relative;
            width: 100%;
            background: #000;
            aspect-ratio: 16/9;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Si el contenedor entra en fullscreen, forzamos el tamaño */
        #player-canvas:fullscreen { width: 100vw; height: 100vh; }
        #player-canvas:-webkit-full-screen { width: 100vw; height: 100vh; }

        video, #yt-player { width: 100%; height: 100%; object-fit: contain; }

        /* BANNER CON PRIORIDAD ABSOLUTA */
        #ad-layer {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 400px;
            z-index: 9999999999 !important; /* Capa sobre-humana */
            display: none;
            pointer-events: none;
        }
        #ad-layer img { width: 100%; border-radius: 10px; border: 2px solid var(--red-m); box-shadow: 0 0 20px rgba(255,0,0,0.5); }

        /* BOTÓN DE AMPLIAR PROPIO */
        .controls-overlay {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 100;
        }
        .fs-btn {
            background: rgba(0,0,0,0.6);
            color: white;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
        }

        /* RESTO DE LA WEB */
        .content { padding: 15px; }
        .playlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; max-height: 200px; overflow-y: auto; background: #111; padding: 10px; border-radius: 10px; }
        .channel { background: #222; padding: 10px; border-radius: 5px; text-align: center; font-size: 12px; border: 1px solid #333; }
        .channel.active { border-color: var(--red-m); background: #300; }
    </style>
</head>
<body>

    <div id="player-canvas">
        <video id="video-player" playsinline></video>
        <div id="yt-player" style="display: none;"></div>
        
        <div id="ad-layer">
            <img src="" id="img-pub">
        </div>

        <div class="controls-overlay">
            <button class="fs-btn" onclick="openFullscreen()"><i class="fas fa-expand"></i> PANTALLA COMPLETA</button>
        </div>
    </div>

    <div class="content">
        <p style="font-size: 10px; color: #888; text-align: center;">Usa el botón de arriba para ampliar con publicidad</p>
        <div class="playlist" id="list"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk",
            databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com",
            projectId: "radiomanaure"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ESCUCHAR PUBLICIDAD DE OBS
        onValue(ref(db, 'publicidad_activa'), (snap) => {
            const data = snap.val();
            const layer = document.getElementById('ad-layer');
            const img = document.getElementById('img-pub');
            if(data && data.imagen !== "OFF") {
                img.src = data.imagen + "?v=" + Date.now();
                layer.style.display = 'block';
            } else {
                layer.style.display = 'none';
            }
        });
    </script>

    <script>
        const canvas = document.getElementById('player-canvas');
        const video = document.getElementById('video-player');

        // FUNCIÓN MÁGICA: AMPLÍA TODO EL CUADRO, NO SOLO EL VIDEO
        function openFullscreen() {
            if (canvas.requestFullscreen) { canvas.requestFullscreen(); }
            else if (canvas.webkitRequestFullscreen) { canvas.webkitRequestFullscreen(); }
            else if (canvas.mozRequestFullScreen) { canvas.mozRequestFullScreen(); }
            else if (canvas.msRequestFullscreen) { canvas.msRequestFullscreen(); }
        }

        // CARGA DE CANALES M3U
        async function init() {
            const res = await fetch("https://raw.githubusercontent.com/lavozdemanaureapp/lavozdemanaure/refs/heads/main/canales.m3u");
            const text = await res.text();
            const lines = text.split('\n');
            const list = document.getElementById('list');

            lines.forEach((line, i) => {
                if(line.startsWith('#EXTINF')) {
                    const name = line.split(',')[1];
                    const url = lines[i+1].trim();
                    const d = document.createElement('div');
                    d.className = 'channel';
                    d.innerText = name;
                    d.onclick = () => play(url, d);
                    list.appendChild(d);
                }
            });
        }

        let hls;
        function play(url, el) {
            document.querySelectorAll('.channel').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            if(hls) hls.destroy();
            
            if(Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else {
                video.src = url;
                video.play();
            }
        }

        function onYouTubeIframeAPIReady() { init(); }
    </script>
</body>
</html>
