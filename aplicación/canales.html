<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manaure TV Profesional</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --rojo: #ff0000; --negro: #0c0c0c; }
        body { margin: 0; background: var(--negro); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* CONTENEDOR DEL REPRODUCTOR */
        #player-canvas { width: 100%; aspect-ratio: 16 / 9; background: #000; position: relative; border-bottom: 2px solid var(--rojo); flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        #telegram-container { width: 100%; height: 100%; overflow: hidden; display: none; }
        video { width: 100%; height: 100%; display: none; }

        /* INTERFAZ ABAJO */
        #interaction-area { flex: 1; display: flex; flex-direction: column; background: #050505; }
        #channel-bar { padding: 15px; background: #111; border-bottom: 1px solid #333; text-align: center; }
        select { width: 100%; background: #1a1a1a; color: white; border: 2px solid var(--rojo); padding: 15px; border-radius: 10px; font-size: 18px; font-weight: bold; outline: none; }
        
        iframe#chat-frame { width: 100%; flex: 1; border: none; }
    </style>
</head>
<body>

    <div id="player-canvas">
        <video id="video" playsinline autoplay controls></video>
        <div id="telegram-container"></div>
    </div>

    <div id="interaction-area">
        <div id="channel-bar">
            <select id="channel-select"><option>Cargando lista...</option></select>
        </div>
        <iframe id="chat-frame" src="chat-manaure.html"></iframe>
    </div>

    <script>
        const videoHLS = document.getElementById('video');
        const tgContainer = document.getElementById('telegram-container');

        window.play = (url) => {
            // Limpiar todo antes de cambiar de canal
            tgContainer.innerHTML = "";
            tgContainer.style.display = "none";
            videoHLS.style.display = 'none';
            videoHLS.pause();

            if (url.includes('t.me/')) {
                // MÉTODO WIDGET: El que Telegram no bloquea
                tgContainer.style.display = "block";
                
                // Extraemos la ruta (ej: golazo92/51)
                const postPath = url.split('t.me/')[1];
                
                const script = document.createElement('script');
                script.async = true;
                script.src = "https://telegram.org/js/telegram-widget.js?22";
                script.setAttribute('data-telegram-post', postPath);
                script.setAttribute('data-width', '100%');
                script.setAttribute('data-dark', '1');
                
                tgContainer.appendChild(script);
            } 
            else {
                // Lógica para canales de video normales (.m3u8)
                videoHLS.style.display = 'block';
                if (Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(videoHLS);
                }
            }
        };

        async function loadM3U() {
            try {
                const r = await fetch('canales.m3u?v=' + Math.random());
                const t = await r.text();
                const lines = t.split('\n');
                const select = document.getElementById('channel-select');
                select.innerHTML = '';
                
                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();
                    if (line.startsWith('#EXTINF')) {
                        let name = line.split(',')[1] || "CANAL";
                        let url = lines[i + 1]?.trim() || "";
                        if (url) select.add(new Option(name.toUpperCase(), url));
                    }
                }
                if (select.length > 0) play(select.options[0].value);
            } catch (e) { console.log("Error al cargar lista M3U"); }
        }

        document.getElementById('channel-select').onchange = (e) => play(e.target.value);
        loadM3U();
    </script>
</body>
</html>
