<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MANAURE TV - FINAL</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --oro: #ffcc00; --rojo: #ff0000; }
        body { margin: 0; background: #000; color: #333; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* SECCIÓN VIDEO */
        #video-container { width: 100%; aspect-ratio: 16 / 9; background: #111; position: relative; flex-shrink: 0; }
        video, iframe { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; border: none; z-index: 5; }
        #pub-overlay { position: absolute; top: 10px; right: 10px; width: 110px; z-index: 100; display: none; }
        #pub-overlay img { width: 100%; border: 2px solid var(--oro); border-radius: 8px; }
        #exit-fs { position: absolute; top: 10px; left: 10px; z-index: 101; background: var(--rojo); color: white; border: none; padding: 10px; border-radius: 5px; display: none; font-weight: bold; }

        /* CONTROLES */
        #controls { padding: 10px; background: #1a1a1a; flex-shrink: 0; border-bottom: 2px solid var(--oro); }
        select { width: 100%; padding: 12px; background: #2a2a2a; color: var(--oro); border: 1px solid #444; border-radius: 8px; font-weight: bold; margin-bottom: 8px; }
        .btn-fs { width: 100%; padding: 12px; background: var(--oro); color: #000; border: none; border-radius: 8px; font-weight: bold; text-transform: uppercase; }

        /* SECCIÓN CHAT (FONDO BLANCO) */
        #chat-section { flex: 1; display: flex; flex-direction: column; background: #ffffff; overflow: hidden; }
        #mensajes { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { font-size: 14px; line-height: 1.4; border-bottom: 1px solid #f0f0f0; padding-bottom: 5px; }
        .user { font-weight: bold; color: #cc0000; margin-right: 5px; }
        .text { color: #111; word-break: break-word; }

        /* INPUT CHAT */
        #input-area { padding: 10px; background: #f8f8f8; border-top: 1px solid #ddd; display: flex; gap: 8px; }
        .inp-nombre { width: 30%; background: #fff; border: 1px solid #ccc; padding: 8px; border-radius: 5px; }
        .inp-msg { flex: 1; background: #fff; border: 1px solid #ccc; padding: 8px; border-radius: 5px; }
        .btn-send { background: var(--oro); border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="video-container">
        <button id="exit-fs" onclick="toggleFS()">❌ SALIR</button>
        <video id="vid" playsinline controls autoplay muted></video>
        <iframe id="yt" style="display:none" allow="autoplay; fullscreen" allowfullscreen></iframe>
        <audio id="radio-audio" src="https://stream.zeno.fm/a0x4vvcp9whvv"></audio>
        <div id="pub-overlay"><img id="pub-img" src=""></div>
    </div>

    <div id="controls">
        <select id="lista" onchange="cambiarCanal(this.value)"><option>CARGANDO...</option></select>
        <button class="btn-fs" onclick="toggleFS()">Ampliar Pantalla 📺</button>
    </div>

    <div id="chat-section">
        <div id="mensajes"></div>
        <div id="input-area">
            <input type="text" id="user-input" class="inp-nombre" placeholder="Tu nombre...">
            <input type="text" id="msg-input" class="inp-msg" placeholder="Di algo sobre el partido...">
            <button id="send-btn" class="btn-send">➤</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, set, onDisconnect, query, limitToLast, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk", 
        databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com", 
        projectId: "radiomanaure" 
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const vid = document.getElementById('vid');
    const yt = document.getElementById('yt');
    const radio = document.getElementById('radio-audio');
    const hls = new Hls({ enableWorker: true, lowLatencyMode: true });

    // --- LÓGICA DE MANDO ---
    onValue(ref(db, 'radio_activa'), snap => {
        if (snap.val()?.estado === 'ON') { 
            radio.play().catch(()=>{}); 
            vid.muted = true;
            if(yt.style.display === "block" && !yt.src.includes('mute=1')) yt.src += "&mute=1";
        } else { 
            radio.pause(); 
            vid.muted = false; 
            if(yt.style.display === "block") yt.src = yt.src.replace("&mute=1", "");
        }
    });

    onValue(ref(db, 'publicidad_activa'), snap => {
        const d = snap.val();
        const div = document.getElementById('pub-overlay');
        if (d?.imagen && d.imagen !== 'OFF') {
            document.getElementById('pub-img').src = d.imagen;
            div.style.display = 'block';
        } else { div.style.display = 'none'; }
    });

    // --- LÓGICA DEL CHAT ---
    const chatRef = ref(db, 'chat_partido');
    const box = document.getElementById('mensajes');
    const userInp = document.getElementById('user-input');
    const msgInp = document.getElementById('msg-input');
    const btnSend = document.getElementById('send-btn');

    const enviar = () => {
        const user = userInp.value.trim() || "Anónimo";
        const text = msgInp.value.trim();
        if(text) {
            push(chatRef, { user, text, time: Date.now() });
            msgInp.value = "";
        }
    };

    btnSend.onclick = enviar;
    msgInp.onkeypress = (e) => { if(e.key === 'Enter') enviar(); };

    const q = query(chatRef, limitToLast(50));
    onChildAdded(q, (snap) => {
        const data = snap.val();
        const div = document.createElement('div');
        div.className = 'msg';
        div.innerHTML = `<span class="user">${data.user}:</span><span class="text">${data.text}</span>`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    });

    // --- GESTIÓN DE VIDEO ---
    window.cambiarCanal = (url) => {
        vid.pause(); vid.style.display = "none"; yt.style.display = "none"; yt.src = ""; hls.detachMedia();
        if (url.includes('youtu')) {
            let id = url.split('v=')[1] || url.split('/').pop();
            yt.style.display = "block";
            yt.src = `https://www.youtube.com/embed/${id.split('&')[0]}?autoplay=1&rel=0&modestbranding=1`;
        } else {
            vid.style.display = "block";
            if (Hls.isSupported()) {
                hls.loadSource(url); hls.attachMedia(vid);
                hls.on(Hls.Events.MANIFEST_PARSED, () => vid.play().catch(()=>{}));
            } else { vid.src = url; vid.play().catch(()=>{}); }
        }
    };

    fetch("https://raw.githubusercontent.com/lavozdemanaureapp/lavozdemanaure/main/canales.m3u")
        .then(r => r.text()).then(data => {
            const select = document.getElementById('lista');
            select.innerHTML = "";
            data.split('\n').forEach((line, i, arr) => {
                if (line.includes('#EXTINF')) {
                    select.add(new Option(line.split(',')[1].trim().toUpperCase(), arr[i+1].trim()));
                }
            });
            if(select.length > 0) cambiarCanal(select.value);
        });

    window.toggleFS = () => {
        const container = document.getElementById('video-container');
        const btnExit = document.getElementById('exit-fs');
        if (!document.fullscreenElement) {
            container.requestFullscreen().catch(() => {});
            btnExit.style.display = "block";
            if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(() => {});
        } else {
            document.exitFullscreen();
            btnExit.style.display = "none";
        }
    };
</script>
</body>
</html>
