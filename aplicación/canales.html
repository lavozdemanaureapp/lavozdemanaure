<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manaure TV PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --rojo: #ff0000; --negro: #000; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--negro); color: #fff; font-family: sans-serif; height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; }

        /* BOTÓN VOLVER FLOTANTE (IZQUIERDA) */
        .menu-toggle { 
            position: fixed; bottom: 20px; left: 20px; z-index: 100000; 
            background: var(--rojo); color: white; border: none; 
            width: 55px; height: 55px; border-radius: 50%; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; font-size: 22px;
            box-shadow: 0 5px 20px rgba(255,0,0,0.6);
        }

        /* SIDEBAR */
        #sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: #000; border-right: 3px solid var(--rojo); z-index: 100001; transition: 0.3s ease; display: flex; flex-direction: column; padding-top: 60px; }
        #sidebar.active { left: 0; }
        .nav-link { color: white; text-decoration: none; padding: 20px; border-bottom: 1px solid #222; font-weight: bold; }

        /* LISTA SUPERIOR */
        #interaction-area { background: #111; padding: 10px; border-bottom: 2px solid var(--rojo); z-index: 10; }
        select { width: 100%; background: #000; color: white; border: 2px solid var(--rojo); padding: 12px; border-radius: 8px; font-weight: bold; font-size: 17px; outline: none; }

        /* REPRODUCTOR (EXTENSIÓN TOTAL) */
        #player-canvas { flex: 1; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: contain; }

        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 99999; }

        /* --- MODO HORIZONTAL (LISTA IZQUIERDA / VIDEO DERECHA) --- */
        @media (orientation: landscape) {
            body { flex-direction: row; }
            #interaction-area { 
                width: 25vw; height: 100vh; border-bottom: none; 
                border-right: 2px solid var(--rojo); display: flex; align-items: center; 
            }
            #player-canvas { width: 75vw; height: 100vh; }
            video { object-fit: cover; } /* En horizontal el video intenta llenar más espacio */
        }
    </style>
</head>
<body>

    <button class="menu-toggle" id="main-btn" onclick="toggleMenu()">
        <i class="fas fa-bars"></i>
    </button>

    <div id="overlay" onclick="toggleMenu()"></div>

    <div id="sidebar">
        <a href="index.html" class="nav-link">RADIO EN VIVO</a>
        <a href="canales.html" class="nav-link" style="color:var(--rojo)">TV EN VIVO</a>
        <a href="programas.html" class="nav-link">PROGRAMACIONES</a>
    </div>

    <div id="interaction-area">
        <select id="channel-select"><option>Cargando canales...</option></select>
    </div>

    <div id="player-canvas">
        <video id="video" playsinline autoplay controls></video>
    </div>

    <script>
        const video = document.getElementById('video');
        const hls = new Hls();
        const M3U_URL = 'https://raw.githubusercontent.com/lavozdemanaureapp/lavozdemanaure/main/canales.m3u';

        function toggleMenu() {
            const sb = document.getElementById('sidebar');
            const ov = document.getElementById('overlay');
            const btnIcon = document.querySelector('#main-btn i');
            sb.classList.toggle('active');
            if (sb.classList.contains('active')) {
                ov.style.display = 'block';
                btnIcon.classList.replace('fa-bars', 'fa-arrow-left');
            } else {
                ov.style.display = 'none';
                btnIcon.classList.replace('fa-arrow-left', 'fa-bars');
            }
        }

        window.play = (url) => {
            if (url.includes('t.me')) {
                video.pause();
                // FORZAR MODO LIVESTREAM: Esto intenta abrir el reproductor de Telegram directamente
                let directLink = url;
                if (!url.includes('?livestream')) {
                    directLink = url.split('?')[0] + '?livestream';
                }
                
                // Intento de apertura por protocolo de APP (tg://)
                let tgProtocol = directLink.replace('https://t.me/', 'tg://resolve?domain=');
                window.location.replace(tgProtocol);
                
                // Respaldo por si no tiene la app instalada
                setTimeout(() => { window.location.href = directLink; }, 400);
            } else {
                if (Hls.isSupported()) {
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=>{}));
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                }
            }
        };

        async function loadM3U() {
            try {
                const r = await fetch(M3U_URL + '?v=' + Math.random());
                const t = await r.text();
                const lines = t.split('\n');
                const select = document.getElementById('channel-select');
                select.innerHTML = ''; 
                
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].startsWith('#EXTINF')) {
                        let name = lines[i].split(',')[1] || "CANAL";
                        let url = lines[i+1]?.trim();
                        if(url && url.startsWith('http')) {
                            select.add(new Option(name.toUpperCase(), url));
                        }
                    }
                }
                if (select.length > 0 && !select.options[0].value.includes('t.me')) {
                    play(select.options[0].value);
                }
            } catch (e) { 
                document.getElementById('channel-select').innerHTML = '<option>Error de Conexión</option>';
            }
        }

        document.getElementById('channel-select').onchange = (e) => play(e.target.value);
        loadM3U();
    </script>
</body>
</html>
