<!DOCTYPE html>
<html lang="es">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manaure TV Profesional</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --rojo: #ff0000; --negro: #0c0c0c; }
        body { margin: 0; background: var(--negro); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #player-canvas { width: 100%; aspect-ratio: 16 / 9; background: #000; position: relative; border-bottom: 2px solid var(--rojo); }
        #telegram-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: #000; }
        video { width: 100%; height: 100%; display: none; }
        #interaction-area { flex: 1; padding: 15px; background: #050505; }
        select { width: 100%; background: #1a1a1a; color: white; border: 2px solid var(--rojo); padding: 15px; border-radius: 10px; font-size: 18px; }
    </style>
</head>
<body>

    <div id="player-canvas">
        <video id="video" playsinline autoplay controls></video>
        <div id="telegram-container"></div>
    </div>

    <div id="interaction-area">
        <select id="channel-select"><option>Cargando canales...</option></select>
        <div style="margin-top:20px; text-align:center; color:#666; font-size:12px;">
            Si el video no carga, asegúrate de haber iniciado el Stream en Telegram Desktop.
        </div>
    </div>

    <script>
        const videoHLS = document.getElementById('video');
        const tgContainer = document.getElementById('telegram-container');

        window.play = (url) => {
            // Limpiar todo antes de cargar
            tgContainer.innerHTML = "";
            videoHLS.style.display = 'none';
            videoHLS.pause();

            if (url.includes('t.me/')) {
                tgContainer.style.display = 'flex';
                // Extraer el canal/ID (ej: golazo92/51)
                const postPath = url.split('t.me/')[1]; 
                
                const script = document.createElement('script');
                script.async = true;
                script.src = "https://telegram.org/js/telegram-widget.js?22";
                script.setAttribute('data-telegram-post', postPath);
                script.setAttribute('data-width', '100%');
                script.setAttribute('data-dark', '1'); // Modo oscuro
                tgContainer.appendChild(script);
            } else {
                tgContainer.style.display = 'none';
                videoHLS.style.display = 'block';
                if (Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(videoHLS);
                }
            }
        };

        async function loadM3U() {
            const r = await fetch('canales.m3u?v=' + Math.random());
            const t = await r.text();
            const lines = t.split('\n');
            const select = document.getElementById('channel-select');
            select.innerHTML = '';
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].startsWith('#EXTINF')) {
                    const name = lines[i].split(',')[1];
                    const url = lines[i+1].trim();
                    select.add(new Option(name, url));
                }
            }
            if (select.length > 0) play(select.options[0].value);
        }

        document.getElementById('channel-select').onchange = (e) => play(e.target.value);
        loadM3U();
    </script>
</body>
</html>
