<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manaure TV Profesional</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        :root { --rojo: #ff0000; --negro: #000; }
        * { box-sizing: border-box; }
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        #master-player { 
            width: 100%; 
            aspect-ratio: 16 / 9; 
            background: #000; 
            position: relative; 
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video, #yt-player { width: 100% !important; height: 100% !important; object-fit: contain; }
        
        /* 1. PUBLICIDAD AGRANDADA */
        #pub-overlay { 
            position: absolute; 
            top: 15px; 
            right: 15px; 
            width: 190px; /* Tamaño solicitado */
            z-index: 2147483647; 
            display: none; 
            pointer-events: none; 
        }
        #pub-overlay img { width: 100%; border: 3px solid var(--rojo); border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        
        /* 2. CHAT FLOTANTE (SOLO LECTURA) */
       #chat-overlay { 
    position: absolute; 
    bottom: 75px; /* Un pelín más arriba para que no choque con los controles */
    left: 15px; 
    width: 300px; /* Un poquito más ancho para mensajes largos */
    height: 180px; /* Aumentado para que quepan los 5 mensajes cómodamente */
    z-index: 2147483647; 
    display: none; 
    overflow: hidden; 
    background: transparent !important; /* FORZAMOS TRANSPARENCIA */
    border: none !important;
    pointer-events: none;
}

#chat-overlay iframe {
    width: 100%;
    height: 100%;
    background: transparent !important; /* EL IFRAME TAMBIÉN DEBE SER TRANSPARENTE */
    border: none;
}
        /* Este iframe tiene un margen negativo abajo para ocultar la caja de texto del chat */
        #chat-overlay iframe {
            width: 100%;
            height: 160%; /* Más alto para que la caja de texto quede fuera del área visible */
            border: none;
            margin-top: -5px;
        }

        /* 3. BOTÓN DINÁMICO MODO CINE / SALIR */
        .btn-fullscreen { 
            position: absolute; 
            bottom: 15px; 
            right: 15px; 
            background: var(--rojo); 
            color: white; 
            border: none; 
            padding: 12px 22px; 
            border-radius: 30px; 
            font-size: 13px; 
            font-weight: bold; 
            z-index: 2147483647; 
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,0,0,0.5);
            text-transform: uppercase;
        }

        #interaction-area { flex: 1; display: flex; flex-direction: column; background: #0a0a0a; border-top: 3px solid var(--rojo); }
        #channel-bar { padding: 15px; }
        select { width: 100%; background: #1a1a1a; color: white; border: 1px solid #444; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; color: var(--rojo); }
        iframe#chat-frame { width: 100%; flex: 1; border: none; }
    </style>
</head>
<body>

    <div id="master-player">
        <video id="video" playsinline autoplay controls></video>
        <div id="yt-player"></div>
        <audio id="radio-audio" src="https://stream.zeno.fm/a0x4vvcp9whvv"></audio>
        
        <div id="pub-overlay"><img id="pub-img" src=""></div>
        
        <div id="chat-overlay">
            <iframe src="chat-manaure.html"></iframe>
        </div>
        
        <button id="fs-button" class="btn-fullscreen" onclick="toggleFS()">MODO CINE</button>
    </div>

    <div id="interaction-area">
        <div id="channel-bar">
            <select id="channel-select"><option>Cargando Canales...</option></select>
        </div>
        <iframe id="chat-frame" src="chat-manaure.html"></iframe>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk", databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com", projectId: "radiomanaure" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const video = document.getElementById('video');
        const radio = document.getElementById('radio-audio');
        const fsButton = document.getElementById('fs-button');
        let ytPlayer;

        window.onYouTubeIframeAPIReady = () => {
            ytPlayer = new YT.Player('yt-player', { playerVars: { 'autoplay': 1, 'controls': 1, 'rel': 0 } });
        };

        const hls = new Hls({ enableWorker: true, lowLatencyMode: true });

        window.play = (url) => {
            video.style.display = "none"; video.pause();
            document.getElementById('yt-player').style.display = "none";
            if(ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();

            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                document.getElementById('yt-player').style.display = "block";
                let id = url.includes('v=') ? url.split('v=')[1].split('&')[0] : url.split('/').pop();
                ytPlayer.loadVideoById(id);
            } else {
                video.style.display = "block";
                if (Hls.isSupported()) {
                    hls.loadSource(url); hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
                }
            }
        };

        // --- LÓGICA DE PANTALLA COMPLETA Y BOTÓN DINÁMICO ---
        window.toggleFS = () => {
            const el = document.getElementById('master-player');
            if (!document.fullscreenElement) {
                if (el.requestFullscreen) el.requestFullscreen();
                else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
                if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(()=>{});
            } else {
                document.exitFullscreen();
            }
        };

        // Escuchar cambios de pantalla completa para cambiar el texto del botón
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                fsButton.innerText = "SALIR";
                fsButton.style.background = "#333"; // Color más discreto al estar dentro
            } else {
                fsButton.innerText = "MODO CINE";
                fsButton.style.background = "var(--rojo)";
            }
        });

        async function loadM3U() {
            const url = "https://raw.githubusercontent.com/lavozdemanaureapp/lavozdemanaure/main/canales.m3u";
            try {
                const r = await fetch(url);
                const t = await r.text();
                const lines = t.split('\n');
                const select = document.getElementById('channel-select');
                select.innerHTML = '';
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes('#EXTINF')) {
                        const name = lines[i].split(',')[1].trim();
                        const link = lines[i+1]?.trim();
                        if (link?.startsWith('http')) select.add(new Option(name.toUpperCase(), link));
                    }
                }
                if (select.length > 0) play(select.options[0].value);
            } catch (e) { console.error(e); }
        }

        onValue(ref(db, 'publicidad_activa'), s => {
            const v = s.val();
            document.getElementById('pub-overlay').style.display = (v?.imagen !== 'OFF') ? 'block' : 'none';
            if(v?.imagen !== 'OFF') document.getElementById('pub-img').src = v.imagen;
        });

        onValue(ref(db, 'chat_visible'), s => {
            document.getElementById('chat-overlay').style.display = (s.val()?.estado === 'ON') ? 'block' : 'none';
        });

        onValue(ref(db, 'radio_activa'), s => {
            if(s.val()?.estado === 'ON') { radio.play(); video.muted = true; }
            else { radio.pause(); video.muted = false; }
        });

        document.getElementById('channel-select').onchange = (e) => play(e.target.value);
        loadM3U();
    </script>
</body>
</html>
