<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manaure TV - Full Screen</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --rojo: #ff0000; --negro: #000000; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--negro); color: #fff; font-family: sans-serif; height: 100vh; width: 100vw; overflow: hidden; }

        /* BOTÓN VOLVER / MENÚ */
        .menu-toggle { 
            position: fixed; top: 15px; left: 15px; z-index: 100000; 
            background: var(--rojo); color: white; border: none; 
            padding: 12px 20px; border-radius: 8px; cursor: pointer; 
            display: flex; align-items: center; gap: 8px; font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.9);
        }

        /* SIDEBAR */
        #sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: #000; border-right: 3px solid var(--rojo); z-index: 100001; transition: 0.3s; display: flex; flex-direction: column; padding-top: 80px; }
        #sidebar.active { left: 0; }
        .nav-link { color: white; text-decoration: none; padding: 20px; border-bottom: 1px solid #222; font-weight: bold; display: flex; align-items: center; gap: 10px; }

        /* CONTENEDOR MAESTRO */
        #app-wrapper { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

        /* REPRODUCTOR NATIVO (EXTENDIDO) */
        #player-canvas { flex: 1; background: #000; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: contain; background: #000; }

        /* ÁREA DE LISTA (FLOTANTE O INFERIOR) */
        #interaction-area { background: #0a0a0a; padding: 15px; border-top: 2px solid var(--rojo); }
        select { width: 100%; background: #000; color: white; border: 2px solid var(--rojo); padding: 15px; border-radius: 10px; font-weight: bold; font-size: 18px; text-align: center; outline: none; }

        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 99999; }

        /* ------------------------------------------------------- */
        /* DISEÑO PARA PANTALLA HORIZONTAL (LANDSCAPE)            */
        /* ------------------------------------------------------- */
        @media (orientation: landscape) {
            #app-wrapper { flex-direction: row; }
            #player-canvas { flex: 3; } /* El video toma la mayor parte */
            #interaction-area { width: 300px; height: 100vh; border-top: none; border-left: 2px solid var(--rojo); display: flex; align-items: center; }
        }
    </style>
</head>
<body>

    <button class="menu-toggle" id="main-btn" onclick="toggleMenu()">
        <i class="fas fa-bars"></i> <span id="btn-text">MENÚ</span>
    </button>

    <div id="overlay" onclick="toggleMenu()"></div>

    <div id="sidebar">
        <a href="index.html" class="nav-link"><i class="fas fa-radio"></i> RADIO EN VIVO</a>
        <a href="canales.html" class="nav-link" style="color:var(--rojo)"><i class="fas fa-tv"></i> TV EN VIVO</a>
        <a href="programas.html" class="nav-link"><i class="fas fa-calendar-alt"></i> PROGRAMACIONES</a>
    </div>

    <div id="app-wrapper">
        <div id="player-canvas">
            <video id="video" playsinline autoplay controls></video>
        </div>

        <div id="interaction-area">
            <select id="channel-select"><option>Cargando canales desde GitHub...</option></select>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const hls = new Hls();
        const M3U_URL = 'https://raw.githubusercontent.com/lavozdemanaureapp/lavozdemanaure/main/canales.m3u';

        function toggleMenu() {
            const sb = document.getElementById('sidebar');
            const ov = document.getElementById('overlay');
            const btnText = document.getElementById('btn-text');
            const btnIcon = document.querySelector('#main-btn i');
            
            sb.classList.toggle('active');
            
            if (sb.classList.contains('active')) {
                ov.style.display = 'block';
                btnText.innerText = "VOLVER"; 
                btnIcon.classList.replace('fa-bars', 'fa-arrow-left');
            } else {
                ov.style.display = 'none';
                btnText.innerText = "MENÚ";
                btnIcon.classList.replace('fa-arrow-left', 'fa-bars');
            }
        }

        window.play = (url) => {
            if (Hls.isSupported()) {
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=>{}));
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
            }
        };

        async function loadM3U() {
            try {
                // Se agrega un parámetro aleatorio para evitar el caché de GitHub
                const r = await fetch(M3U_URL + '?v=' + Math.random());
                const t = await r.text();
                const lines = t.split('\n');
                const select = document.getElementById('channel-select');
                select.innerHTML = '';
                
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].startsWith('#EXTINF')) {
                        let name = lines[i].split(',')[1] || "CANAL";
                        let url = lines[i+1]?.trim();
                        if(url && url.startsWith('http')) {
                            select.add(new Option(name.toUpperCase(), url));
                        }
                    }
                }
                if (select.length > 0) play(select.options[0].value);
                else select.innerHTML = '<option>No se encontraron canales</option>';
            } catch (e) { 
                console.error("Error M3U:", e);
                document.getElementById('channel-select').innerHTML = '<option>Error al conectar con GitHub</option>';
            }
        }

        document.getElementById('channel-select').onchange = (e) => play(e.target.value);
        loadM3U();
    </script>
</body>
</html>
