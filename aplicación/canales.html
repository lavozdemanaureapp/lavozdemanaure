<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MANAURE TV - CONSOLIDADO</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --oro: #ffcc00; --rojo: #ff0000; }
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* VIDEO (16:9) */
        #video-container { width: 100%; aspect-ratio: 16 / 9; background: #111; position: relative; flex-shrink: 0; }
        video, iframe { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; border: none; z-index: 5; }
        
        /* PUBLICIDAD EN ESQUINA (No tapa el juego) */
        #pub-overlay { 
            position: absolute; top: 10px; right: 10px; width: 110px; 
            z-index: 100; display: none; pointer-events: none; 
            animation: fadeIn 0.5s ease;
        }
        #pub-overlay img { width: 100%; border: 2px solid var(--oro); border-radius: 8px; box-shadow: 0 0 15px #000; }

        /* BOTÓN SALIDA MODO CINE */
        #exit-fs { 
            position: absolute; top: 10px; left: 10px; z-index: 101; 
            background: var(--rojo); color: white; border: none; 
            padding: 10px 15px; border-radius: 5px; font-weight: bold; 
            display: none; cursor: pointer;
        }

        /* CONTROLES */
        #controls { padding: 10px; background: #1a1a1a; border-bottom: 2px solid var(--oro); flex-shrink: 0; }
        select { width: 100%; padding: 12px; background: #2a2a2a; color: var(--oro); border: 1px solid #444; border-radius: 8px; font-size: 16px; font-weight: bold; margin-bottom: 8px; outline: none; }
        .btn-fs { width: 100%; padding: 12px; background: var(--oro); color: #000; border: none; border-radius: 8px; font-weight: bold; text-transform: uppercase; font-size: 13px; }

        /* CHAT (FONDO BLANCO DEBAJO) */
        #chat-frame { flex: 1; width: 100%; border: none; background: #fff; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="video-container">
        <button id="exit-fs" onclick="toggleFS()">❌ SALIR</button>
        <video id="vid" playsinline controls autoplay muted></video>
        <iframe id="yt" style="display:none" allow="autoplay; fullscreen" allowfullscreen></iframe>
        
        <audio id="radio-audio" src="https://stream.zeno.fm/a0x4vvcp9whvv"></audio>
        
        <div id="pub-overlay"><img id="pub-img" src=""></div>
    </div>

    <div id="controls">
        <select id="lista" onchange="cambiarCanal(this.value)"><option>CARGANDO CANALES...</option></select>
        <button class="btn-fs" onclick="toggleFS()">Ampliar Pantalla 📺</button>
    </div>

    <iframe id="chat-frame" src="chat-partido.html"></iframe>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, set, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk", 
        databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com", 
        projectId: "radiomanaure" 
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const vid = document.getElementById('vid');
    const yt = document.getElementById('yt');
    const radio = document.getElementById('radio-audio');
    const hls = new Hls({ enableWorker: true, lowLatencyMode: true, backBufferLength: 0 });

    // --- MANDO FIREBASE (Muteo y Publicidad) ---
    onValue(ref(db, 'radio_activa'), snap => {
        if (snap.val()?.estado === 'ON') { 
            radio.play().catch(()=>{}); 
            vid.muted = true; // Mutea video m3u8
            if(yt.style.display === "block" && !yt.src.includes('mute=1')) yt.src += "&mute=1";
        } else { 
            radio.pause(); 
            vid.muted = false; 
            if(yt.style.display === "block") yt.src = yt.src.replace("&mute=1", "");
        }
    });

    onValue(ref(db, 'publicidad_activa'), snap => {
        const d = snap.val();
        const div = document.getElementById('pub-overlay');
        if (d?.imagen && d.imagen !== 'OFF') {
            document.getElementById('pub-img').src = d.imagen;
            div.style.display = 'block';
        } else { div.style.display = 'none'; }
    });

    // Contador de Audiencia
    const miConex = push(ref(db, 'audiencia'));
    onDisconnect(miConex).remove();
    set(miConex, true);

    // --- GESTIÓN DE SEÑAL ---
    window.cambiarCanal = (url) => {
        vid.pause(); vid.style.display = "none"; yt.style.display = "none"; yt.src = ""; hls.detachMedia();
        if (url.includes('youtu')) {
            let id = url.split('v=')[1] || url.split('/').pop();
            yt.style.display = "block";
            yt.src = `https://www.youtube.com/embed/${id.split('&')[0]}?autoplay=1&rel=0&modestbranding=1`;
        } else {
            vid.style.display = "block";
            if (Hls.isSupported()) {
                hls.loadSource(url); hls.attachMedia(vid);
                hls.on(Hls.Events.MANIFEST_PARSED, () => vid.play().catch(()=>{}));
            } else { vid.src = url; vid.play().catch(()=>{}); }
        }
    };

    fetch("https://raw.githubusercontent.com/lavozdemanaureapp/lavozdemanaure/main/canales.m3u")
        .then(r => r.text()).then(data => {
            const select = document.getElementById('lista');
            select.innerHTML = "";
            data.split('\n').forEach((line, i, arr) => {
                if (line.includes('#EXTINF')) {
                    select.add(new Option(line.split(',')[1].trim().toUpperCase(), arr[i+1].trim()));
                }
            });
            if(select.length > 0) cambiarCanal(select.value);
        });

    // --- PANTALLA COMPLETA ---
    window.toggleFS = () => {
        const container = document.getElementById('video-container');
        const btnExit = document.getElementById('exit-fs');
        if (!document.fullscreenElement) {
            container.requestFullscreen().catch(() => {});
            btnExit.style.display = "block";
            if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(() => {});
        } else {
            document.exitFullscreen();
            btnExit.style.display = "none";
            if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
        }
    };
    
    // Auto-limpieza de botón si el usuario usa el gesto del celular
    document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement) document.getElementById('exit-fs').style.display = "none";
    });
</script>
</body>
</html>
