<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manaure TV - En Vivo</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --rojo: #ff0000; --negro: #0c0c0c; }
        body { margin: 0; background: var(--negro); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* CONTENEDOR 16:9 HORIZONTAL */
        #player-canvas { width: 100%; aspect-ratio: 16 / 9; background: #000; position: relative; border-bottom: 2px solid var(--rojo); flex-shrink: 0; }
        #video, #yt-player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; display: none; }
        
        /* CAPAS SOBRE EL VIDEO (OVERLAYS) */
        #pub-overlay { position: absolute; top: 8px; right: 8px; width: 100px; z-index: 100; display: none; pointer-events: none; }
        #pub-overlay img { width: 100%; border: 1px solid var(--rojo); border-radius: 5px; }
        
        #chat-overlay { position: absolute; bottom: 40px; left: 8px; width: 220px; height: 140px; z-index: 99; display: none; background: rgba(0,0,0,0.3); border-radius: 8px; overflow: hidden; pointer-events: none; }
        #chat-overlay iframe { width: 100%; height: 100%; border: none; }

        .btn-vid { position: absolute; bottom: 8px; right: 8px; background: var(--rojo); color: white; border: none; padding: 6px 10px; border-radius: 4px; font-size: 10px; font-weight: bold; z-index: 1001; cursor: pointer; }

        /* INTERACCIÓN (CHAT PÚBLICO ABAJO) */
        #interaction-area { flex: 1; display: flex; flex-direction: column; background: #050505; }
        #channel-bar { padding: 10px; background: #111; }
        select { width: 100%; background: #1a1a1a; color: white; border: 1px solid var(--rojo); padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; }
        iframe#chat-frame { width: 100%; flex: 1; border: none; background: #000; }
    </style>
</head>
<body>

    <div id="player-canvas">
        <video id="video" playsinline autoplay controls></video>
        <div id="yt-player"></div>
        <audio id="radio-audio" src="https://stream.zeno.fm/a0x4vvcp9whvv"></audio>
        
        <div id="pub-overlay"><img id="pub-img" src=""></div>
        <div id="chat-overlay"><iframe src="chat-manaure.html"></iframe></div>
        
        <button class="btn-vid" onclick="toggleFS()"><i class="fas fa-expand"></i> PANTALLA COMPLETA</button>
    </div>

    <div id="interaction-area">
        <div id="channel-bar">
            <select id="channel-select"><option>Sintonizando...</option></select>
        </div>
        <iframe id="chat-frame" src="chat-manaure.html"></iframe>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk",
            databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com",
            projectId: "radiomanaure"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const videoHLS = document.getElementById('video');
        const radioAudio = document.getElementById('radio-audio');
        let ytPlayer;

        window.onYouTubeIframeAPIReady = () => {
            ytPlayer = new YT.Player('yt-player', { playerVars: { 'autoplay': 1, 'controls': 1 } });
        };

        const hls = new Hls({
            enableWorker: true, lowLatencyMode: true,
            maxBufferLength: 15, startLevel: 0,
            abrEwmaFastLive: 1.0
        });

        window.play = (url) => {
            videoHLS.style.display = "none"; videoHLS.pause();
            document.getElementById('yt-player').style.display = "none";
            if(ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();

            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                document.getElementById('yt-player').style.display = "block";
                const id = url.split('v=')[1]?.split('&')[0] || url.split('/').pop();
                ytPlayer.loadVideoById(id);
            } else {
                videoHLS.style.display = "block";
                if (Hls.isSupported()) {
                    hls.loadSource(url); hls.attachMedia(videoHLS);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        let idx480 = 0;
                        hls.levels.forEach((l, i) => { if(l.height <= 480) idx480 = i; });
                        hls.autoLevelCapping = idx480;
                        videoHLS.play();
                    });
                }
            }
        };

        onValue(ref(db, 'publicidad_activa'), snap => {
            const v = snap.val();
            document.getElementById('pub-overlay').style.display = (v && v.imagen !== 'OFF') ? 'block' : 'none';
            if(v?.imagen !== 'OFF') document.getElementById('pub-img').src = v.imagen;
        });

        onValue(ref(db, 'chat_visible'), snap => {
            document.getElementById('chat-overlay').style.display = (snap.val()?.estado === 'ON') ? 'block' : 'none';
        });

        onValue(ref(db, 'radio_activa'), snap => {
            if(snap.val()?.estado === 'ON') { radioAudio.play(); videoHLS.muted = true; }
            else { radioAudio.pause(); videoHLS.muted = false; }
        });

        window.toggleFS = () => {
            const pc = document.getElementById('player-canvas');
            if (!document.fullscreenElement) pc.requestFullscreen(); else document.exitFullscreen();
        };

        async function loadM3U() {
            const r = await fetch('canales.m3u?v=' + Math.random());
            const t = await r.text();
            const lines = t.split('\n');
            const select = document.getElementById('channel-select');
            select.innerHTML = '';
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].startsWith('#EXTINF')) {
                    select.add(new Option(lines[i].split(',')[1].toUpperCase(), lines[i+1].trim()));
                }
            }
            if (select.length > 0) play(select.options[0].value);
        }
        document.getElementById('channel-select').onchange = (e) => play(e.target.value);
        loadM3U();
    </script>
</body>
</html>
