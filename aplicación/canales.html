<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manaure TV - En Vivo</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        :root { --rojo: #ff0000; --negro: #000; }
        body { margin: 0; background: var(--negro); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Contenedor que fuerza el ancho total */
        #player-canvas { width: 100%; aspect-ratio: 16 / 9; background: #000; position: relative; border-bottom: 2px solid var(--rojo); flex-shrink: 0; }
        video, #yt-player { width: 100%; height: 100%; display: none; background: #000; }
        
        /* Overlays (Capas de publicidad y chat) */
        #pub-overlay { position: absolute; top: 10px; right: 10px; width: 100px; z-index: 100; display: none; pointer-events: none; }
        #pub-overlay img { width: 100%; border: 1px solid var(--rojo); border-radius: 5px; }
        #chat-overlay { position: absolute; bottom: 40px; left: 10px; width: 230px; height: 150px; z-index: 99; display: none; background: rgba(0,0,0,0.4); border-radius: 8px; overflow: hidden; pointer-events: none; }
        
        .btn-fs { position: absolute; bottom: 10px; right: 10px; background: var(--rojo); color: white; border: none; padding: 8px 12px; border-radius: 5px; font-size: 11px; font-weight: bold; z-index: 1001; cursor: pointer; }

        /* Área del Chat Público e Inferior */
        #interaction-area { flex: 1; display: flex; flex-direction: column; background: #050505; }
        #channel-bar { padding: 12px; background: #111; }
        select { width: 100%; background: #1a1a1a; color: white; border: 1px solid var(--rojo); padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; outline: none; }
        iframe#chat-frame { width: 100%; flex: 1; border: none; background: #000; }
    </style>
</head>
<body>

    <div id="player-canvas">
        <video id="video" playsinline autoplay controls></video>
        <div id="yt-player"></div>
        <audio id="radio-audio" src="https://stream.zeno.fm/a0x4vvcp9whvv"></audio>
        
        <div id="pub-overlay"><img id="pub-img" src=""></div>
        <div id="chat-overlay"><iframe src="chat-manaure.html" style="width:100%;height:100%;border:none;"></iframe></div>
        
        <button class="btn-fs" onclick="toggleFS()">PANTALLA COMPLETA</button>
    </div>

    <div id="interaction-area">
        <div id="channel-bar">
            <select id="channel-select"><option>Cargando Canales...</option></select>
        </div>
        <iframe id="chat-frame" src="chat-manaure.html"></iframe>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk", databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com", projectId: "radiomanaure" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const video = document.getElementById('video');
        const radio = document.getElementById('radio-audio');
        let ytPlayer;

        // Iniciar API YouTube
        window.onYouTubeIframeAPIReady = () => {
            ytPlayer = new YT.Player('yt-player', { playerVars: { 'autoplay': 1, 'controls': 1, 'rel': 0 } });
        };

        const hls = new Hls({ enableWorker: true, lowLatencyMode: true, startLevel: 0 });

        window.play = (url) => {
            video.style.display = "none"; video.pause();
            document.getElementById('yt-player').style.display = "none";
            if(ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();

            // Detectar si es YouTube
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                document.getElementById('yt-player').style.display = "block";
                let id = url.includes('v=') ? url.split('v=')[1].split('&')[0] : url.split('/').pop();
                ytPlayer.loadVideoById(id);
            } else {
                video.style.display = "block";
                if (Hls.isSupported()) {
                    hls.loadSource(url); hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        let idx = 0; hls.levels.forEach((l, i) => { if(l.height <= 480) idx = i; });
                        hls.autoLevelCapping = idx; video.play();
                    });
                }
            }
        };

        // CARGA DE LISTA DESDE TU GITHUB (LINK RAW CORREGIDO)
        async function loadM3U() {
            const urlM3U = "https://raw.githubusercontent.com/lavozdemanaureapp/lavozdemanaure/main/canales.m3u";
            try {
                const response = await fetch(urlM3U);
                const data = await response.text();
                const lines = data.split('\n');
                const select = document.getElementById('channel-select');
                select.innerHTML = '';

                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].startsWith('#EXTINF')) {
                        const partes = lines[i].split(',');
                        const nombre = partes[partes.length - 1].trim();
                        const link = lines[i+1]?.trim();
                        if (link && link.startsWith('http')) {
                            const option = new Option(nombre.toUpperCase(), link);
                            select.add(option);
                        }
                    }
                }
                if (select.length > 0) play(select.options[0].value);
            } catch (err) { console.error("Error cargando M3U:", err); }
        }

        // Sincronización con el Mando
        onValue(ref(db, 'publicidad_activa'), s => {
            const v = s.val();
            document.getElementById('pub-overlay').style.display = (v?.imagen !== 'OFF') ? 'block' : 'none';
            if(v?.imagen !== 'OFF') document.getElementById('pub-img').src = v.imagen;
        });

        onValue(ref(db, 'chat_visible'), s => {
            document.getElementById('chat-overlay').style.display = (s.val()?.estado === 'ON') ? 'block' : 'none';
        });

        onValue(ref(db, 'radio_activa'), s => {
            if(s.val()?.estado === 'ON') { radio.play(); video.muted = true; }
            else { radio.pause(); video.muted = false; }
        });

        window.toggleFS = () => {
            const pc = document.getElementById('player-canvas');
            if (!document.fullscreenElement) pc.requestFullscreen(); else document.exitFullscreen();
        };

        document.getElementById('channel-select').onchange = (e) => play(e.target.value);
        loadM3U();
    </script>
</body>
</html>
