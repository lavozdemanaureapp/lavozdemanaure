<!DOCTYPE html>
<html lang="es">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manaure TV Profesional</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --rojo: #ff0000; --negro: #0c0c0c; }
        body { margin: 0; background: var(--negro); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: #000; border-right: 2px solid var(--rojo); z-index: 10001; transition: 0.3s; display: flex; flex-direction: column; align-items: center; padding-top: 20px; }
        #sidebar.active { left: 0; }
        .btn-regresar { width: 90%; background: var(--rojo); color: #fff; border: none; padding: 16px; margin-bottom: 25px; border-radius: 10px; cursor: pointer; font-weight: 900; text-transform: uppercase; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .menu-toggle { position: absolute; top: 12px; left: 12px; z-index: 10002; background: rgba(0,0,0,0.8); color: white; border: 1px solid var(--rojo); padding: 10px; border-radius: 5px; cursor: pointer; }
        #player-canvas { width: 100%; aspect-ratio: 16 / 9; background: #000; position: relative; border-bottom: 2px solid var(--rojo); flex-shrink: 0; }
        video, iframe, #telegram-container { width: 100%; height: 100%; border: none; display: block; background: #000; }
        .btn-vid { position: absolute; bottom: 10px; right: 10px; background: var(--rojo); color: white; border: none; padding: 10px 15px; border-radius: 5px; font-size: 11px; font-weight: bold; z-index: 1000; min-width: 100px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        #interaction-area { flex: 1; display: flex; flex-direction: column; overflow-y: auto; background: #050505; }
        #channel-bar { padding: 15px; background: #111; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; text-align: center; }
        select { width: 100%; background: #1a1a1a; color: white; border: 2px solid var(--rojo); padding: 15px; border-radius: 10px; font-size: 18px; font-weight: bold; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 10000; }
    </style>
</head>
<body>

    <div class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
    <div id="overlay" onclick="toggleMenu()"></div>

    <div id="sidebar">
        <button class="btn-regresar" onclick="toggleMenu()">VOLVER AL MENÚ</button>
        <img src="logo_v2.png" style="width: 80px; margin-bottom: 10px;">
        <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <a href="index.html" style="color: white; text-decoration: none; padding: 15px;">RADIO EN VIVO</a>
            <a href="canales.html" style="color: var(--rojo); text-decoration: none; padding: 15px; font-weight: bold;">TV EN VIVO</a>
        </div>
    </div>

    <div id="player-canvas">
        <video id="video" playsinline autoplay controls></video>
        <iframe id="video-iframe" style="display:none;" allow="autoplay; fullscreen"></iframe>
        <div id="telegram-container" style="display:none;"></div>
        <button class="btn-vid" onclick="toggleFS()">AMPLIAR</button>
    </div>

    <div id="interaction-area">
        <div id="channel-bar">
            <select id="channel-select"><option>Cargando canales...</option></select>
        </div>
        <iframe id="chat-frame" src="chat-manaure.html" style="width:100%; height:500px; border:none;"></iframe>
    </div>

    <script>
        const videoHLS = document.getElementById('video');
        const videoIFRAME = document.getElementById('video-iframe');
        const tgContainer = document.getElementById('telegram-container');
        const canvas = document.getElementById('player-canvas');
        const hls = new Hls();

        window.toggleMenu = () => {
            const sb = document.getElementById('sidebar');
            const ov = document.getElementById('overlay');
            sb.classList.toggle('active');
            ov.style.display = (ov.style.display === 'block') ? 'none' : 'block';
        };

        window.toggleFS = () => {
            if (!document.fullscreenElement) canvas.requestFullscreen().catch(() => {});
            else document.exitFullscreen();
        };

        window.play = (url) => {
            videoHLS.style.display = 'none'; videoHLS.pause();
            videoIFRAME.style.display = 'none'; videoIFRAME.src = "";
            tgContainer.style.display = 'none'; tgContainer.innerHTML = "";

            if (url.includes('t.me/')) {
                tgContainer.style.display = 'block';
                // LIMPIEZA DE URL: Solo nos quedamos con el nombre del canal (ej: golazo92)
                const canalConBasura = url.split('t.me/')[1];
                const canalLimpio = canalConBasura.split('/')[0].split('?')[0];
                
                // FORZAMOS EL MODO LIVE EMBED (Esto ignora los números de post)
                tgContainer.innerHTML = `<iframe src="https://t.me/${canalLimpio}?embed=1&live=1" 
                    allow="autoplay; fullscreen" 
                    style="width:100%; height:100%; border:none; background:#000;"></iframe>`;
            } 
            else if (url.includes('youtube.com')) {
                videoIFRAME.style.display = 'block';
                let id = url.split('v=')[1].split('&')[0];
                videoIFRAME.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1`;
            } 
            else {
                videoHLS.style.display = 'block';
                if (Hls.isSupported()) { 
                    hls.loadSource(url); hls.attachMedia(videoHLS);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => videoHLS.play().catch(()=>{}));
                }
            }
        };

        async function loadM3U() {
            const r = await fetch('canales.m3u?v=' + Math.random());
            const t = await r.text();
            const lines = t.split('\n');
            const select = document.getElementById('channel-select');
            select.innerHTML = '';
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].startsWith('#EXTINF')) {
                    let name = lines[i].split(',')[1];
                    let url = lines[i+1].trim();
                    select.add(new Option(name.toUpperCase(), url));
                }
            }
            if (select.length > 0) play(select.options[0].value);
        }

        document.getElementById('channel-select').onchange = (e) => play(e.target.value);
        loadM3U();
    </script>
</body>
</html>
