<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MANAURE TV - REPARADO</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --oro: #ffcc00; --rojo: #ff0000; --oscuro: #1a1a1a; }
        
        /* Forzamos que el cuerpo no se mueva */
        html, body { 
            margin: 0; 
            padding: 0; 
            background: #000; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        
        /* ÁREA DE VIDEO: Le damos prioridad absoluta */
        #video-container { 
            width: 100%; 
            aspect-ratio: 16 / 9; 
            background: #111; 
            position: relative; 
            flex-shrink: 0; /* Esto evita que el chat lo aplaste */
            z-index: 10;
        }
        
        video, iframe { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; border: none; }
        
        /* PUBLICIDAD */
        #pub-overlay { position: absolute; top: 10px; right: 10px; width: 110px; z-index: 100; display: none; transition: width 0.3s ease; }
        #pub-overlay img { width: 100%; border: 2px solid var(--oro); border-radius: 8px; box-shadow: 0 0 15px #000; }
        #exit-fs { position: absolute; top: 10px; left: 10px; z-index: 101; background: var(--rojo); color: white; border: none; padding: 10px; border-radius: 5px; display: none; font-weight: bold; }

        /* CONTROLES */
        #controls { padding: 8px; background: var(--oscuro); flex-shrink: 0; border-bottom: 2px solid var(--oro); }
        .selector-wrapper { display: flex; align-items: center; background: #2a2a2a; border-radius: 8px; overflow: hidden; border: 1px solid #444; margin-bottom: 6px; position: relative; }
        .label-canales { background: var(--oro); color: #000; padding: 10px; font-weight: bold; font-size: 12px; text-transform: uppercase; }
        select { flex: 1; padding: 10px; background: transparent; color: var(--oro); border: none; font-weight: bold; font-size: 15px; outline: none; appearance: none; cursor: pointer; z-index: 2; }
        .selector-wrapper::after { content: '▼'; position: absolute; right: 12px; color: var(--oro); font-size: 12px; pointer-events: none; }
        .btn-fs { width: 100%; padding: 10px; background: var(--oro); color: #000; border: none; border-radius: 8px; font-weight: bold; text-transform: uppercase; font-size: 13px; }

        /* CHAT: Ahora sí usa el espacio que sobra sin molestar */
        #chat-frame { 
            flex: 1; 
            width: 100%; 
            border: none; 
            background: #fff; 
        }
        
        .btn-menu { width: 100%; padding: 10px; background: #222; color: #fff; border: none; text-align: center; font-weight: bold; text-decoration: none; display: block; font-size: 12px; }
    </style>
</head>
<body>

    <div id="video-container">
        <button id="exit-fs" onclick="toggleFS()">❌ SALIR</button>
        <video id="vid" playsinline controls autoplay muted></video>
        <iframe id="yt" style="display:none" allow="autoplay; fullscreen" allowfullscreen></iframe>
        <audio id="radio-audio" src="https://stream.zeno.fm/a0x4vvcp9whvv"></audio>
        <div id="pub-overlay"><img id="pub-img" src=""></div>
    </div>

    <div id="controls">
        <div class="selector-wrapper">
            <div class="label-canales">CANALES</div>
            <select id="lista" onchange="cambiarCanal(this.value)"><option>CARGANDO...</option></select>
        </div>
        <button class="btn-fs" onclick="toggleFS()">Ampliar Pantalla 📺</button>
    </div>

    <iframe id="chat-frame" src="chat-partido.html"></iframe>

    <a href="index.html" class="btn-menu">🏠 VOLVER AL INICIO</a>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk", 
        databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com", 
        projectId: "radiomanaure" 
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- AUDIENCIA ---
    const sessionId = localStorage.getItem('manaure_session') || Math.random().toString(36).substring(7);
    localStorage.setItem('manaure_session', sessionId);
    const presenciaRef = ref(db, 'audiencia/' + sessionId);
    set(presenciaRef, true);
    onDisconnect(presenciaRef).remove();

    const vid = document.getElementById('vid');
    const yt = document.getElementById('yt');
    const radio = document.getElementById('radio-audio');
    const pubOverlay = document.getElementById('pub-overlay');
    const hls = new Hls({ enableWorker: true, lowLatencyMode: true });

    // --- MANDO VOZ ---
    onValue(ref(db, 'radio_activa'), snap => {
        if (snap.val()?.estado === 'ON') { 
            radio.play().catch(()=>{}); vid.muted = true;
            if(yt.style.display === "block" && !yt.src.includes('mute=1')) yt.src += "&mute=1";
        } else { radio.pause(); vid.muted = false; if(yt.style.display === "block") yt.src = yt.src.replace("&mute=1", ""); }
    });

    // --- PUBLICIDAD ---
    onValue(ref(db, 'publicidad_activa'), snap => {
        const d = snap.val();
        if (d?.imagen && d.imagen !== 'OFF') {
            document.getElementById('pub-img').src = d.imagen;
            pubOverlay.style.display = 'block';
        } else { pubOverlay.style.display = 'none'; }
    });

    // --- VIDEO ---
    window.cambiarCanal = (url) => {
        vid.pause(); vid.style.display = "none"; yt.style.display = "none"; yt.src = ""; hls.detachMedia();
        if (url.includes('youtu')) {
            let id = url.split('v=')[1] || url.split('/').pop();
            yt.style.display = "block";
            yt.src = `https://www.youtube.com/embed/${id.split('&')[0]}?autoplay=1&rel=0`;
        } else {
            vid.style.display = "block";
            if (Hls.isSupported()) {
                hls.loadSource(url); hls.attachMedia(vid);
                hls.on(Hls.Events.MANIFEST_PARSED, () => vid.play().catch(()=>{}));
            } else { vid.src = url; vid.play().catch(()=>{}); }
        }
    };

    fetch("https://raw.githubusercontent.com/lavozdemanaureapp/lavozdemanaure/main/canales.m3u")
        .then(r => r.text()).then(data => {
            const select = document.getElementById('lista');
            select.innerHTML = "";
            data.split('\n').forEach((line, i, arr) => {
                if (line.includes('#EXTINF')) {
                    select.add(new Option(line.split(',')[1].trim().toUpperCase(), arr[i+1].trim()));
                }
            });
            if(select.length > 0) cambiarCanal(select.value);
        });

    window.toggleFS = () => {
        const container = document.getElementById('video-container');
        if (!document.fullscreenElement) {
            container.requestFullscreen().catch(() => {});
            document.getElementById('exit-fs').style.display = "block";
            pubOverlay.style.width = "180px";
            if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(() => {});
        } else {
            document.exitFullscreen();
        }
    };
    
    document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement) {
            document.getElementById('exit-fs').style.display = "none";
            pubOverlay.style.width = "110px";
        }
    });
</script>
</body>
</html>
