<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MANAURE TV - POTENCIA</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        
        /* CONTENEDOR DE VIDEO 16:9 */
        #video-container { 
            width: 100%; 
            aspect-ratio: 16 / 9; 
            background: #111; 
            position: relative; 
        }
        video, iframe { 
            position: absolute; top: 0; left: 0; 
            width: 100% !important; height: 100% !important; 
            border: none; 
        }

        /* SELECTOR Y BOTÓN */
        #controls { padding: 20px; background: #0a0a0a; display: flex; flex-direction: column; gap: 15px; }
        select { 
            width: 100%; padding: 15px; background: #222; color: #ffcc00; 
            border: 2px solid #ffcc00; border-radius: 10px; font-size: 18px; font-weight: bold; 
        }
        button { 
            padding: 15px; background: #ffcc00; color: #000; border: none; 
            border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; 
        }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="vid" playsinline controls autoplay muted></video>
        <iframe id="yt" style="display:none" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>

    <div id="controls">
        <select id="lista" onchange="cambiarCanal(this.value)">
            <option>CARGANDO LISTA...</option>
        </select>
        <button onclick="toggleFS()">AMPLIAR PANTALLA (Giro Automático)</button>
    </div>

<script>
    const vid = document.getElementById('vid');
    const yt = document.getElementById('yt');
    const hls = new Hls({ 
        enableWorker: true, 
        lowLatencyMode: true,
        backBufferLength: 0 // No guarda basura para no ponerse lento
    });

    // Función agresiva para detectar YouTube
    function getYTID(url) {
        const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=|live\/)|youtu\.be\/)([^"&?\/\s]{11})/;
        const match = url.match(regex);
        return match ? match[1] : null;
    }

    function cambiarCanal(url) {
        if(!url) return;
        
        // Limpiar todo antes de cargar
        vid.pause();
        vid.style.display = "none";
        yt.style.display = "none";
        yt.src = "";
        hls.detachMedia();

        const id = getYTID(url);

        if (id) {
            yt.style.display = "block";
            yt.src = `https://www.youtube.com/embed/${id}?autoplay=1&modestbranding=1&rel=0`;
        } else {
            vid.style.display = "block";
            if (Hls.isSupported()) {
                hls.loadSource(url);
                hls.attachMedia(vid);
                hls.on(Hls.Events.MANIFEST_PARSED, () => vid.play());
            } else {
                vid.src = url;
                vid.play();
            }
        }
    }

    // CARGAR LA LISTA DESDE TU DIRECCIÓN
    const m3uURL = "https://raw.githubusercontent.com/lavozdemanaureapp/lavozdemanaure/main/canales.m3u";

    fetch(m3uURL)
        .then(res => res.text())
        .then(data => {
            const select = document.getElementById('lista');
            select.innerHTML = "";
            const lineas = data.split('\n');
            
            lineas.forEach((linea, i) => {
                if (linea.includes('#EXTINF')) {
                    const nombre = linea.split(',')[1].trim();
                    const link = lineas[i+1].trim();
                    if(link.startsWith('http')) {
                        let opt = new Option(nombre.toUpperCase(), link);
                        select.add(opt);
                    }
                }
            });
            if(select.length > 0) cambiarCanal(select.value);
        })
        .catch(err => {
            document.getElementById('lista').innerHTML = "<option>ERROR AL CARGAR LISTA</option>";
        });

    // Función de Pantalla Completa + Giro
    function toggleFS() {
        const container = document.getElementById('video-container');
        if (!document.fullscreenElement) {
            container.requestFullscreen().catch(e => {});
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock("landscape").catch(() => {});
            }
        } else {
            document.exitFullscreen();
        }
    }
</script>

</body>
</html>
