<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANAURE - Multi-Canal & Cabina</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        /* CONTENEDOR PRINCIPAL */
        #main-container { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
        
        /* REPRODUCTOR */
        #player-canvas { position: relative; flex-grow: 1; background: #000; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; max-height: 100vh; }

        /* EL CÍRCULO DE TU CARA (CABINA) */
        #camera-layer {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #ff0000;
            overflow: hidden;
            display: none;
            z-index: 9999;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }

        /* SELECTOR DE CANALES */
        #channel-menu {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10000;
            background: rgba(0,0,0,0.7);
            padding: 5px;
            border-radius: 5px;
        }
        select { background: #222; color: white; border: 1px solid #ff0000; padding: 5px; border-radius: 5px; }

        /* BANNER DE PUBLICIDAD */
        #banner-pub {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 200px;
            display: none;
            z-index: 9998;
        }
        #banner-pub img { width: 100%; border-radius: 10px; }

        /* SECCIÓN DEL CHAT (ABAJO) */
        #chat-container { height: 30vh; background: #111; border-top: 2px solid #ff0000; }
        iframe#chat-frame { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="main-container">
        <div id="player-canvas">
            <video id="video" controls autoplay></video>

            <div id="channel-menu">
                <select id="channel-select">
                    <option value="">Cargando canales...</option>
                </select>
            </div>

            <div id="camera-layer">
                <iframe id="iframe-camera" src="" allow="camera;microphone" style="width:100%; height:100%; border:none; transform: scale(1.4);"></iframe>
            </div>

            <div id="banner-pub">
                <img id="img-pub" src="" alt="Publicidad">
            </div>
        </div>

        <div id="chat-container">
            <iframe id="chat-frame" src="chat-manaure.html"></iframe>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk",
            databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com",
            projectId: "radiomanaure"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const video = document.getElementById('video');
        const hls = new Hls();

        // 1. CARGAR CANALES DESDE EL M3U
        async function cargarCanales() {
            const response = await fetch('canales.m3u');
            const text = await response.text();
            const lines = text.split('\n');
            const select = document.getElementById('channel-select');
            select.innerHTML = ''; // Limpiar

            let currentName = "";
            lines.forEach(line => {
                if (line.startsWith('#EXTINF')) {
                    currentName = line.split(',')[1];
                } else if (line.startsWith('http')) {
                    let opt = document.createElement('option');
                    opt.value = line.trim();
                    opt.innerText = currentName;
                    select.appendChild(opt);
                }
            });

            // Reproducir el primero por defecto
            if (select.options.length > 0) {
                cambiarCanal(select.options[0].value);
            }
        }

        function cambiarCanal(url) {
            if (Hls.isSupported()) {
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
            }
        }

        document.getElementById('channel-select').addEventListener('change', (e) => {
            cambiarCanal(e.target.value);
        });

        cargarCanales();

        // 2. LÓGICA DE LA CÁMARA (FIREBASE)
        onValue(ref(db, 'cabina_activa'), (snap) => {
            const data = snap.val();
            const layer = document.getElementById('camera-layer');
            const iframe = document.getElementById('iframe-camera');
            if (data && data.estado === "ON") {
                if(iframe.src !== data.url) iframe.src = data.url;
                layer.style.display = 'block';
            } else {
                layer.style.display = 'none';
                iframe.src = "";
            }
        });

        // 3. LÓGICA DE PUBLICIDAD (FIREBASE)
        onValue(ref(db, 'publicidad_activa'), (snap) => {
            const data = snap.val();
            const banner = document.getElementById('banner-pub');
            const img = document.getElementById('img-pub');
            if (data && data.imagen !== "OFF") {
                img.src = data.imagen;
                banner.style.display = 'block';
            } else {
                banner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
