<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manaure 92.3 FM - Radio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --rojo: #ff0000; --negro: #0c0c0c; --gris: #1a1a1a; }
        body { margin: 0; background: var(--negro); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* SIDEBAR UNIFICADO ROJO */
        #sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: #000; border-right: 2px solid var(--rojo); z-index: 10001; transition: 0.3s; display: flex; flex-direction: column; align-items: center; padding-top: 20px; }
        #sidebar.active { left: 0; }
        
        /* BOTÓN VOLVER AL MENÚ - ROJO */
        .btn-regresar { width: 90%; background: var(--rojo); color: #fff; border: none; padding: 16px; margin-bottom: 25px; border-radius: 10px; cursor: pointer; font-weight: 900; text-transform: uppercase; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 15px rgba(255,0,0,0.3); }

        .menu-toggle { position: absolute; top: 12px; left: 12px; z-index: 10002; background: rgba(0,0,0,0.8); color: white; border: 1px solid var(--rojo); padding: 10px; border-radius: 5px; cursor: pointer; }
        
        /* CONTENIDO PRINCIPAL */
        #main-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        
        .logo-station { width: 180px; margin-bottom: 20px; filter: drop-shadow(0 0 10px rgba(255,0,0,0.5)); }
        
        .nav-link { color: white; text-decoration: none; padding: 15px; font-size: 16px; width: 85%; text-align: center; border-radius: 8px; margin: 5px 0; transition: 0.3s; }
        .nav-link:hover { background: var(--gris); color: var(--rojo); }
        .nav-active { background: var(--gris); border-left: 4px solid var(--rojo); font-weight: bold; }

        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 10000; }
    </style>
</head>
<body>

    <div class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
    <div id="overlay" onclick="toggleMenu()"></div>

    <div id="sidebar">
        <button class="btn-regresar" onclick="toggleMenu()">
            <i class="fas fa-bars"></i> VOLVER AL MENÚ
        </button>
        <img src="logo_v2.png" style="width: 80px; margin-bottom: 10px;">
        <div style="margin-top: 20px; width: 100%; display: flex; flex-direction: column; align-items: center;">
            <a href="index.html" class="nav-link">RADIO EN VIVO</a>
            <a href="canales.html" class="nav-link">TV EN VIVO</a>
            <a href="programas.html" class="nav-link">PROGRAMAS</a>
        </div>
    </div>

    <div id="main-container">
        <img src="logo_v2.png" class="logo-station">
        <h2 style="margin: 0; color: var(--rojo);">LA VOZ DE MANAURE</h2>
        <p style="color: #aaa; font-size: 14px;">92.3 FM - Santa Ana del Táchira</p>
        
        <div id="player-placeholder" style="margin-top: 30px;">
             </div>
    </div>

    <script>
        window.toggleMenu = () => {
            const sb = document.getElementById('sidebar');
            const ov = document.getElementById('overlay');
            sb.classList.toggle('active');
            ov.style.display = (ov.style.display === 'block') ? 'none' : 'block';
        };
    </script>
</body>
</html>
