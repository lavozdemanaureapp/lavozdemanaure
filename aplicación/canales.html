<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manaure TV M</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { margin: 0; background: #000; height: 100vh; display: flex; flex-direction: column; font-family: sans-serif; overflow: hidden; }
        
        /* Lista superior */
        #selector-caja { background: #111; padding: 10px; border-bottom: 2px solid red; z-index: 10; }
        select { width: 100%; background: #000; color: #fff; border: 1px solid red; padding: 12px; font-size: 16px; border-radius: 5px; outline: none; }

        /* Video que ocupa todo el resto */
        #video-caja { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; }
        video { width: 100%; height: 100%; object-fit: contain; }

        /* MODO HORIZONTAL: Lista a la izquierda, Video a la derecha */
        @media (orientation: landscape) {
            body { flex-direction: row; }
            #selector-caja { width: 25%; height: 100vh; border-bottom: none; border-right: 2px solid red; display: flex; align-items: center; }
            #video-caja { width: 75%; height: 100vh; }
        }
    </style>
</head>
<body>

    <div id="selector-caja">
        <select id="lista-canales"><option>Cargando canales...</option></select>
    </div>

    <div id="video-caja">
        <video id="video" controls playsinline autoplay></video>
    </div>

    <script>
        const video = document.getElementById('video');
        const hls = new Hls();
        const URL_M3U = 'https://raw.githubusercontent.com/lavozdemanaureapp/lavozdemanaure/main/canales.m3u';

        window.play = (url) => {
            if (Hls.isSupported()) {
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
            }
        };

        async function cargar() {
            try {
                const res = await fetch(URL_M3U + '?v=' + Date.now());
                const texto = await res.text();
                const lineas = texto.split('\n');
                const select = document.getElementById('lista-canales');
                select.innerHTML = '';
                
                lineas.forEach((l, i) => {
                    if (l.startsWith('#EXTINF')) {
                        let nombre = l.split(',')[1] || "CANAL";
                        let url = lineas[i+1]?.trim();
                        if(url) select.add(new Option(nombre.toUpperCase(), url));
                    }
                });
                if (select.length > 0) play(select.options[0].value);
            } catch (e) { console.error("Error al cargar M3U"); }
        }

        document.getElementById('lista-canales').onchange = (e) => play(e.target.value);
        cargar();
    </script>
</body>
</html>
