<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manaure TV Profesional</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --rojo: #ff0000; --negro: #0c0c0c; }
        body { margin: 0; background: var(--negro); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        #player-canvas { width: 100%; aspect-ratio: 16 / 9; background: #000; position: relative; border-bottom: 2px solid var(--rojo); flex-shrink: 0; }
        video, iframe, #telegram-container { width: 100%; height: 100%; border: none; display: block; background: #000; }
        
        #interaction-area { flex: 1; display: flex; flex-direction: column; background: #050505; overflow: hidden; }
        #channel-bar { padding: 15px; background: #111; border-bottom: 1px solid #333; text-align: center; }
        select { width: 100%; background: #1a1a1a; color: white; border: 2px solid var(--rojo); padding: 15px; border-radius: 10px; font-size: 18px; font-weight: bold; outline: none; }
        
        iframe#chat-frame { width: 100%; flex: 1; border: none; }
    </style>
</head>
<body>

    <div id="player-canvas">
        <video id="video" playsinline autoplay controls></video>
        <iframe id="video-iframe" style="display:none;" allow="autoplay; fullscreen"></iframe>
        <div id="telegram-container" style="display:none;"></div>
    </div>

    <div id="interaction-area">
        <div id="channel-bar">
            <select id="channel-select"><option>Cargando canales...</option></select>
        </div>
        <iframe id="chat-frame" src="chat-manaure.html"></iframe>
    </div>

    <script>
        const videoHLS = document.getElementById('video');
        const videoIFRAME = document.getElementById('video-iframe');
        const tgContainer = document.getElementById('telegram-container');
        const hls = new Hls();

        window.play = (url) => {
            // Limpieza total
            videoHLS.style.display = 'none'; videoHLS.pause();
            videoIFRAME.style.display = 'none'; videoIFRAME.src = "";
            tgContainer.style.display = 'none'; tgContainer.innerHTML = "";

            if (url.includes('t.me/')) {
                tgContainer.style.display = 'block';
                // Extraemos el nombre del canal (golazo92)
                const canal = url.split('t.me/')[1].split('?')[0].split('/')[0];
                
                // Usamos el modo embed con live=1 para que capture el livestream actual
                tgContainer.innerHTML = `
                    <iframe src="https://t.me/${canal}?embed=1&live=1" 
                            style="width:100%; height:100%; border:none; background:#000;" 
                            allow="autoplay; fullscreen">
                    </iframe>`;
            } 
            else {
                videoHLS.style.display = 'block';
                if (Hls.isSupported()) { 
                    hls.loadSource(url); hls.attachMedia(videoHLS);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => videoHLS.play().catch(()=>{}));
                }
            }
        };

        async function loadM3U() {
            try {
                const r = await fetch('canales.m3u?v=' + Math.random());
                const t = await r.text();
                const lines = t.split('\n');
                const select = document.getElementById('channel-select');
                select.innerHTML = '';
                
                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();
                    if (line.startsWith('#EXTINF')) {
                        let name = line.split(',')[1] || "CANAL";
                        let url = lines[i + 1]?.trim() || "";
                        if (url) select.add(new Option(name.toUpperCase(), url));
                    }
                }
                if (select.length > 0) play(select.options[0].value);
            } catch (e) { console.log("Error M3U"); }
        }

        document.getElementById('channel-select').onchange = (e) => play(e.target.value);
        loadM3U();
    </script>
</body>
</html>
