<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manaure TV - Profesional</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --rojo: #ff0000; --negro: #0c0c0c; }
        body { margin: 0; background: var(--negro); color: #fff; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        /* SIDEBAR ACTUALIZADO CON BOTÓN VOLVER */
        #sidebar { position: fixed; left: -260px; top: 0; width: 250px; height: 100%; background: #000; border-right: 2px solid var(--rojo); z-index: 10001; transition: 0.4s; display: flex; flex-direction: column; align-items: center; padding-top: 10px; }
        #sidebar.active { left: 0; }
        
        .btn-volver { width: 90%; background: #222; color: #aaa; border: none; padding: 10px; margin-bottom: 20px; border-radius: 5px; cursor: pointer; text-align: left; font-size: 13px; }
        .btn-volver:hover { color: white; background: #333; }

        .menu-toggle { position: absolute; top: 12px; left: 12px; z-index: 10002; background: rgba(0,0,0,0.8); color: white; border: 1px solid var(--rojo); padding: 10px; border-radius: 5px; cursor: pointer; }
        .nav-item { width: 85%; padding: 12px; margin: 5px 0; border-radius: 8px; background: #1a1a1a; display: flex; align-items: center; gap: 12px; cursor: pointer; text-decoration: none; color: white; font-size: 14px; }
        
        #main-content { width: 100%; display: flex; flex-direction: column; position: relative; }
        
        /* CONTENEDOR DE VIDEO HORIZONTAL */
        #player-canvas { 
            width: 100%; 
            aspect-ratio: 16 / 9; 
            background: #000; 
            position: relative; 
            border-bottom: 2px solid var(--rojo); 
            overflow: hidden; 
            flex-shrink: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        
        #player-canvas:fullscreen { width: 100vw; height: 100vh; }
        #player-canvas:-webkit-full-screen { width: 100vw; height: 100vh; }

        video { width: 100%; height: 100%; object-fit: contain; display: block; }
        iframe#video-iframe { width: 100%; height: 100%; border: none; display: none; background: #000; }

        .btn-vid { position: absolute; bottom: 10px; right: 10px; background: rgba(255,0,0,0.8); color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; z-index: 10005; font-size: 10px; font-weight: bold; }
        
        /* AREA DE INTERACCION CON SCROLL CORRECTO */
        #interaction-area { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background: #050505;
            overflow-y: auto; /* Permite scroll si el contenido es mucho */
        }

        #channel-bar { 
            background: #111; 
            padding: 12px; 
            border-bottom: 1px solid #222;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        select { 
            background: #1a1a1a; 
            color: white; 
            border: 1px solid #444; 
            padding: 12px; 
            border-radius: 8px; 
            width: 100%; 
            font-weight: bold; 
            font-size: 16px;
        }

        iframe#chat-frame { width: 100%; flex: 1; border: none; min-height: 400px; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 10000; }
    </style>
</head>
<body>

    <div class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
    <div id="overlay" onclick="toggleMenu()"></div>

    <div id="sidebar">
        <button class="btn-volver" onclick="toggleMenu()"><i class="fas fa-arrow-left"></i> VOLVER AL CANAL</button>
        
        <img src="logo_v2.png" style="width: 70px; margin-bottom: 10px;">
        <h4 style="color: var(--rojo); margin: 0; font-size: 15px;">MANAURE 92.3</h4>
        <div style="margin-top: 20px; width: 100%; display: flex; flex-direction: column; align-items: center;">
            <a href="index.html" class="nav-item"><i class="fas fa-broadcast-tower"></i> Radio</a>
            <a href="programas.html" class="nav-item"><i class="fas fa-microphone-lines"></i> Archivo</a>
            <a href="canales.html" class="nav-item" style="border-left: 4px solid var(--rojo); background: #222;"><i class="fas fa-tv"></i> TV Gratis</a>
        </div>
    </div>

    <div id="main-content">
        <div id="player-canvas">
            <video id="video" playsinline autoplay controls></video>
            <iframe id="video-iframe" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
            <button id="btnFS" class="btn-vid" onclick="toggleFS()"><i class="fas fa-expand"></i> AMPLIAR PANTALLA</button>
        </div>
        <div id="interaction-area">
            <div id="channel-bar">
                <select id="channel-select">
                    <option>Cargando lista de canales...</option>
                </select>
            </div>
            <iframe id="chat-frame" src="chat-manaure.html"></iframe>
        </div>
    </div>

    <script>
        const videoHLS = document.getElementById('video');
        const videoIFRAME = document.getElementById('video-iframe');
        const canvas = document.getElementById('player-canvas');
        const hls = new Hls({ maxBufferLength: 60 });

        // --- FULLSCREEN CON BLOQUEO DE ROTACIÓN ---
        window.toggleFS = () => {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (canvas.requestFullscreen) canvas.requestFullscreen();
                else if (canvas.webkitRequestFullscreen) canvas.webkitRequestFullscreen();
                
                // Intentar bloquear en horizontal
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(() => {
                        console.log("Rotación manual requerida");
                    });
                }
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        };

        window.toggleMenu = () => {
            const sb = document.getElementById('sidebar');
            const ov = document.getElementById('overlay');
            sb.classList.toggle('active');
            ov.style.display = (ov.style.display === 'block') ? 'none' : 'block';
        };

        // --- MOTOR DE REPRODUCCIÓN ---
        window.play = (url) => {
            videoIFRAME.src = ""; // Limpiar iframe
            
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                let videoId = url.includes('v=') ? url.split('v=')[1].split('&')[0] : url.split('/').pop().split('?')[0];
                videoHLS.style.display = 'none';
                videoHLS.pause();
                // Usamos nocookie y mute para asegurar la carga
                videoIFRAME.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&mute=1&rel=0&modestbranding=1`;
                videoIFRAME.style.display = 'block';
            } else {
                videoIFRAME.style.display = 'none';
                videoHLS.style.display = 'block';
                if (Hls.isSupported()) {
                    hls.loadSource(url);
                    hls.attachMedia(videoHLS);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => videoHLS.play().catch(()=>{}));
                } else if (videoHLS.canPlayType('application/vnd.apple.mpegurl')) {
                    videoHLS.src = url;
                    videoHLS.play();
                }
            }
        };

        async function loadM3U() {
            try {
                const r = await fetch('canales.m3u?v=' + new Date().getTime());
                const t = await r.text();
                const lines = t.split('\n');
                const select = document.getElementById('channel-select');
                select.innerHTML = '';
                
                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();
                    if (line.startsWith('#EXTINF')) {
                        let name = line.split(',')[1];
                        let link = lines[i + 1] ? lines[i + 1].trim() : "";
                        if (link.startsWith('http')) {
                            let o = document.createElement('option');
                            o.value = link;
                            o.innerText = name.trim().toUpperCase();
                            select.appendChild(o);
                        }
                    }
                }
                if (select.options.length > 0) play(select.options[0].value);
            } catch (e) { 
                console.log("Error cargando M3U");
                document.getElementById('channel-select').innerHTML = "<option>Error al cargar canales</option>";
            }
        }

        document.getElementById('channel-select').onchange = (e) => play(e.target.value);
        loadM3U();
    </script>
</body>
</html>
