<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manaure TV Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        :root { --rojo: #ff0000; --negro: #000; }
        * { box-sizing: border-box; }
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* CONTENEDOR MAESTRO PARA PANTALLA COMPLETA */
        #master-player { 
            width: 100%; 
            aspect-ratio: 16 / 9; 
            background: #000; 
            position: relative; 
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video, #yt-player { width: 100% !important; height: 100% !important; object-fit: contain; }
        
        /* CAPAS SOBRE EL VIDEO (Z-INDEX MÁXIMO) */
        #pub-overlay { position: absolute; top: 15px; right: 15px; width: 120px; z-index: 2147483647; display: none; pointer-events: none; }
        #pub-overlay img { width: 100%; border: 2px solid var(--rojo); border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.7); }
        
        #chat-overlay { 
            position: absolute; 
            bottom: 60px; 
            left: 15px; 
            width: 280px; 
            height: 160px; 
            z-index: 2147483647; 
            display: none; 
            background: rgba(0,0,0,0.5); 
            border-radius: 12px; 
            border-left: 5px solid var(--rojo);
            pointer-events: none; 
            overflow: hidden;
        }

        /* BOTÓN FLOTANTE PROFESIONAL */
        .btn-fullscreen { 
            position: absolute; 
            bottom: 15px; 
            right: 15px; 
            background: var(--rojo); 
            color: white; 
            border: none; 
            padding: 10px 18px; 
            border-radius: 25px; 
            font-size: 12px; 
            font-weight: bold; 
            z-index: 2147483647; 
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255,0,0,0.4);
        }

        /* REGLAS DE PANTALLA COMPLETA */
        #master-player:fullscreen { width: 100vw; height: 100vh; }
        #master-player:-webkit-full-screen { width: 100vw; height: 100vh; }

        /* AREA INFERIOR (CONTROLES Y CHAT PÚBLICO) */
        #interaction-area { flex: 1; display: flex; flex-direction: column; background: #0a0a0a; border-top: 3px solid var(--rojo); }
        #channel-bar { padding: 15px; }
        select { width: 100%; background: #1a1a1a; color: white; border: 1px solid #444; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; color: var(--rojo); }
        iframe#chat-frame { width: 100%; flex: 1; border: none; }
    </style>
</head>
<body>

    <div id="master-player">
        <video id="video" playsinline autoplay controls></video>
        <div id="yt-player"></div>
        <audio id="radio-audio" src="https://stream.zeno.fm/a0x4vvcp9whvv"></audio>
        
        <div id="pub-overlay"><img id="pub-img" src=""></div>
        <div id="chat-overlay"><iframe src="chat-manaure.html" style="width:100%; height:100%; border:none;"></iframe></div>
        
        <button class="btn-fullscreen" onclick="toggleFS()">MODO CINE / TV 📺</button>
    </div>

    <div id="interaction-area">
        <div id="channel-bar">
            <select id="channel-select"><option>Cargando Canales...</option></select>
        </div>
        <iframe id="chat-frame" src="chat-manaure.html"></iframe>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk", databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com", projectId: "radiomanaure" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const video = document.getElementById('video');
        const radio = document.getElementById('radio-audio');
        let ytPlayer;

        window.onYouTubeIframeAPIReady = () => {
            ytPlayer = new YT.Player('yt-player', { playerVars: { 'autoplay': 1, 'controls': 1, 'rel': 0 } });
        };

        const hls = new Hls({ enableWorker: true, lowLatencyMode: true });

        window.play = (url) => {
            video.style.display = "none"; video.pause();
            document.getElementById('yt-player').style.display = "none";
            if(ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();

            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                document.getElementById('yt-player').style.display = "block";
                let id = url.includes('v=') ? url.split('v=')[1].split('&')[0] : url.split('/').pop();
                ytPlayer.loadVideoById(id);
            } else {
                video.style.display = "block";
                if (Hls.isSupported()) {
                    hls.loadSource(url); hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
                }
            }
        };

        // --- PANTALLA COMPLETA TOTAL (CON OVERLAYS) ---
        window.toggleFS = () => {
            const el = document.getElementById('master-player');
            if (!document.fullscreenElement) {
                if (el.requestFullscreen) el.requestFullscreen();
                else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
                // Forzar horizontal
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock("landscape").catch(() => {});
                }
            } else {
                document.exitFullscreen();
            }
        };

        async function loadM3U() {
            const url = "https://raw.githubusercontent.com/lavozdemanaureapp/lavozdemanaure/main/canales.m3u";
            try {
                const r = await fetch(url);
                const t = await r.text();
                const lines = t.split('\n');
                const select = document.getElementById('channel-select');
                select.innerHTML = '';
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes('#EXTINF')) {
                        const name = lines[i].split(',')[1].trim();
                        const link = lines[i+1]?.trim();
                        if (link?.startsWith('http')) select.add(new Option(name.toUpperCase(), link));
                    }
                }
                if (select.length > 0) play(select.options[0].value);
            } catch (e) { console.error(e); }
        }

        // --- MANDOS DESDE FIREBASE ---
        onValue(ref(db, 'publicidad_activa'), s => {
            const v = s.val();
            document.getElementById('pub-overlay').style.display = (v?.imagen !== 'OFF') ? 'block' : 'none';
            if(v?.imagen !== 'OFF') document.getElementById('pub-img').src = v.imagen;
        });

        onValue(ref(db, 'chat_visible'), s => {
            document.getElementById('chat-overlay').style.display = (s.val()?.estado === 'ON') ? 'block' : 'none';
        });

        onValue(ref(db, 'radio_activa'), s => {
            if(s.val()?.estado === 'ON') { radio.play(); video.muted = true; }
            else { radio.pause(); video.muted = false; }
        });

        document.getElementById('channel-select').onchange = (e) => play(e.target.value);
        loadM3U();
    </script>
</body>
</html>
