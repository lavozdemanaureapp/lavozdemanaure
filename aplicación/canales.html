<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MANAURE TV - MODO PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --oro: #ffcc00; --rojo: #ff0000; --oscuro: #1a1a1a; }
        body { margin: 0; background: #000; color: #333; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Contenedor Principal */
        #video-container { width: 100%; aspect-ratio: 16 / 9; background: #111; position: relative; flex-shrink: 0; }
        video, iframe, #espn-frame { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; border: none; z-index: 5; }
        #espn-frame { z-index: 10 !important; background: black; }

        /* Publicidad */
        #pub-overlay { position: absolute; top: 10px; right: 10px; width: 110px; z-index: 100; display: none; transition: all 0.3s ease; }
        #video-container:fullscreen #pub-overlay, #video-container:-webkit-full-screen #pub-overlay { width: 220px; opacity: 0.7; }
        #pub-overlay img { width: 100%; border: 3px solid var(--oro); border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.7); }

        /* Cámara Overlay (Normal) */
        #camara-overlay {
            position: absolute;
            top: 10px; 
            right: 10px;
            width: 160px; 
            aspect-ratio: 16 / 9;
            z-index: 200; 
            border: 2px solid var(--oro);
            border-radius: 8px;
            overflow: hidden;
            display: none; 
            background: black;
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
            pointer-events: none;
        }

        /* --- MODO CINE / PANTALLA COMPLETA --- */
        .modo-cine {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 99998 !important;
            background: black !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }

        .modo-cine video, .modo-cine iframe:not(#iframe-camara) {
            width: 100% !important;   
            height: auto !important;  
            max-height: 100vh !important;
        }

        /* AJUSTE: Cámara más grande en horizontal */
        .modo-cine #camara-overlay {
            display: block !important;
            position: fixed !important; 
            width: 35vw !important; /* Aumentado de 180px a 35% del ancho de pantalla */
            max-width: 320px !important;
            min-width: 240px !important;
            aspect-ratio: 16 / 9;
            bottom: 20px !important;   
            right: 20px !important;    
            top: auto !important;      
            z-index: 999999 !important;
            border: 3px solid var(--oro); /* Borde más grueso para resaltar */
            box-shadow: 0 0 25px rgba(0,0,0,0.8);
        }

        #exit-fs { position: absolute; top: 10px; left: 10px; z-index: 101; background: var(--rojo); color: white; border: none; padding: 10px; border-radius: 5px; display: none; font-weight: bold; }

        /* Controles y Chat */
        #controls { padding: 10px; background: var(--oscuro); flex-shrink: 0; border-bottom: 2px solid var(--oro); }
        .selector-wrapper { display: flex; align-items: center; background: #2a2a2a; border-radius: 8px; overflow: hidden; border: 1px solid #444; margin-bottom: 8px; position: relative; }
        .label-canales { background: var(--oro); color: #000; padding: 12px; font-weight: bold; font-size: 13px; text-transform: uppercase; }
        select { flex: 1; padding: 12px; background: transparent; color: var(--oro); border: none; font-weight: bold; font-size: 16px; outline: none; appearance: none; cursor: pointer; z-index: 2; }
        .selector-wrapper::after { content: '▼'; position: absolute; right: 12px; color: var(--oro); font-size: 12px; pointer-events: none; }
        .btn-fs { width: 100%; padding: 12px; background: var(--oro); color: #000; border: none; border-radius: 8px; font-weight: bold; text-transform: uppercase; }

        #chat-section { flex: 1; display: flex; flex-direction: column; background: #ffffff; overflow: hidden; }
        #mensajes { flex: 1; overflow-y: scroll; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #fff; -webkit-overflow-scrolling: touch; }
        .msg { font-size: 14px; border-bottom: 1px solid #eee; padding-bottom: 5px; color: #111; }
        .user { font-weight: bold; color: #cc0000; margin-right: 5px; }

        #input-area { padding: 10px; background: #f8f8f8; border-top: 1px solid #ddd; display: flex; gap: 8px; flex-shrink: 0; }
        .inp-nombre { width: 25%; background: #fff; border: 1px solid #ccc; padding: 8px; border-radius: 5px; }
        .inp-msg { flex: 1; background: #fff; border: 1px solid #ccc; padding: 8px; border-radius: 5px; }
        .btn-send { background: var(--oro); border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; }
        .btn-menu { width: 100%; padding: 12px; background: #222; color: #fff; border: none; text-align: center; font-weight: bold; text-decoration: none; display: block; font-size: 13px; }
    </style>
</head>
<body>

    <div id="video-container">
        <button id="exit-fs" onclick="toggleFS()">❌ SALIR</button>
        
        <video id="vid" playsinline controls autoplay muted></video>
        <iframe id="yt" style="display:none" allow="autoplay; fullscreen" allowfullscreen></iframe>
        <iframe id="espn-frame" style="display:none" sandbox="allow-scripts allow-same-origin allow-forms allow-presentation" allow="autoplay; fullscreen"></iframe>
        <audio id="radio-audio" src="https://stream.zeno.fm/a0x4vvcp9whvv"></audio>
        
        <div id="pub-overlay"><img id="pub-img" src=""></div>

        <div id="camara-overlay">
            <iframe id="iframe-camara" width="100%" height="100%" frameborder="0" allow="autoplay; encrypted-media"></iframe>
        </div>
    </div>
    
    <div id="controls">
        <div class="selector-wrapper">
            <div class="label-canales">CANALES</div>
            <select id="lista" onchange="cambiarCanal(this.value)">
                <option>CARGANDO...</option>
            </select>
        </div>
        <button class="btn-fs" onclick="toggleFS()">Ampliar Pantalla 📺</button>
    </div>

    <div id="chat-section">
        <div id="mensajes"></div>
        <div id="input-area">
            <input type="text" id="user-input" class="inp-nombre" placeholder="Nombre">
            <input type="text" id="msg-input" class="inp-msg" placeholder="Comenta...">
            <button id="send-btn" class="btn-send">➤</button>
        </div>
        <a href="index.html" class="btn-menu">🏠 VOLVER AL INICIO</a>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, query, limitToLast, onChildAdded, set, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk", 
        databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com", 
        projectId: "radiomanaure" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Presencia
    const sessionId = localStorage.getItem('manaure_session') || Math.random().toString(36).substring(7);
    localStorage.setItem('manaure_session', sessionId);
    const presenciaRef = ref(db, 'audiencia/' + sessionId);
    set(presenciaRef, true);
    onDisconnect(presenciaRef).remove();

    const vid = document.getElementById('vid');
    const yt = document.getElementById('yt');
    const eFrame = document.getElementById('espn-frame');
    const radio = document.getElementById('radio-audio');
    const pubOverlay = document.getElementById('pub-overlay');

    const hls = new Hls({
        enableWorker: true,
        xhrSetup: (xhr) => { xhr.withCredentials = false; }
    });

    window.cambiarCanal = (url) => {
        vid.pause(); vid.style.display = "none"; 
        hls.detachMedia();
        yt.style.display = "none"; yt.src = ""; 
        eFrame.style.display = "none"; eFrame.src = ""; eFrame.srcdoc = "";

        if (url.includes('.m3u8') || url.includes('index.m3u8')) {
            vid.style.display = "block";
            if (Hls.isSupported()) {
                hls.loadSource(url); hls.attachMedia(vid);
                hls.on(Hls.Events.MANIFEST_PARSED, () => vid.play().catch(()=>{}));
            } else { vid.src = url; vid.play().catch(()=>{}); }
        }
        else if (url.includes('wsdeportes.net') || url.includes('ws04.php')) {
            eFrame.style.display = "block"; eFrame.src = url; 
        } 
        else if (url.includes('ksdjugfsddeports')) {
            let canalId = url.split('/').pop(); 
            eFrame.style.display = "block";
            eFrame.srcdoc = `<body style="margin:0; background:black; display:flex; align-items:center; justify-content:center; height:100vh; overflow:hidden;">
                <script>width='100%', height='100%', id='${canalId}';<\/script>
                <script src='https://embed.ksdjugfsddeports.com/embed2.js'><\/script></body>`;
        }
        else if (url.includes('youtu')) {
            let id = url.split('v=')[1] || url.split('/').pop();
            yt.style.display = "block";
            yt.src = `https://www.youtube.com/embed/${id.split('&')[0]}?autoplay=1&rel=0`;
        } 
    };

    // Mando de Voz
    onValue(ref(db, 'radio_activa'), snap => {
        const estadoVoz = snap.val()?.estado;
        if (estadoVoz === 'ON') { 
            radio.play().catch(()=>{}); 
            vid.muted = true; vid.volume = 0;
            yt.contentWindow?.postMessage('{"event":"command","func":"mute","args":""}', '*');
        } else { 
            radio.pause(); vid.muted = false; vid.volume = 1;
            yt.contentWindow?.postMessage('{"event":"command","func":"unMute","args":""}', '*');
        }
    });

    // Publicidad
    onValue(ref(db, 'publicidad_activa'), snap => {
        const d = snap.val();
        const imgElement = document.getElementById('pub-img');
        if (d && d.imagen && d.imagen !== 'OFF') {
            imgElement.src = d.imagen;
            pubOverlay.style.display = 'block';
        } else { pubOverlay.style.display = 'none'; }
    });

    // Cámara en Vivo
    onValue(ref(db, 'camara_activa'), snap => {
        const d = snap.val();
        const overlay = document.getElementById('camara-overlay');
        const iframeCam = document.getElementById('iframe-camara');
        if (d && d.youtubeId && d.youtubeId !== 'OFF') {
            iframeCam.src = `https://www.youtube.com/embed/${d.youtubeId}?autoplay=1&controls=0&modestbranding=1`;
            overlay.style.display = 'block';
            vid.muted = true;
        } else {
            overlay.style.display = 'none';
            iframeCam.src = "";
            vid.muted = false;
        }
    });
    
    // Lista de Canales
    fetch("https://raw.githubusercontent.com/lavozdemanaureapp/lavozdemanaure/main/canales.m3u")
        .then(r => r.text()).then(data => {
            const select = document.getElementById('lista');
            select.innerHTML = "";
            data.split('\n').forEach((line, i, arr) => {
                if (line.includes('#EXTINF')) {
                    select.add(new Option(line.split(',')[1].trim().toUpperCase(), arr[i+1].trim()));
                }
            });
            if(select.length > 0) cambiarCanal(select.value);
        });

    // Chat
    const chatRef = ref(db, 'chat_partido');
    const box = document.getElementById('mensajes');
    const userInp = document.getElementById('user-input');
    const msgInp = document.getElementById('msg-input');
    const btnSend = document.getElementById('send-btn');

    btnSend.onclick = () => {
        const user = userInp.value.trim() || "Anónimo";
        const text = msgInp.value.trim();
        if(text) { push(chatRef, { user, text, time: Date.now() }); msgInp.value = ""; }
    };

    onChildAdded(query(chatRef, limitToLast(50)), (snap) => {
        const data = snap.val();
        const div = document.createElement('div');
        div.className = 'msg';
        div.innerHTML = `<span class="user">${data.user}:</span><span class="text">${data.text}</span>`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    });

    // Función ToggleFS Consolidada
    window.toggleFS = () => {
        const container = document.getElementById('video-container');
        const btnExit = document.getElementById('exit-fs');

        if (!container.classList.contains('modo-cine')) {
            container.classList.add('modo-cine');
            btnExit.style.display = "block";
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock("landscape").catch(() => {});
            }
        } else {
            container.classList.remove('modo-cine');
            btnExit.style.display = "none";
            if (screen.orientation && screen.orientation.unlock) {
                screen.orientation.unlock();
            }
        }
    };
</script>
</body>
</html>
