<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TV Manaure - Horizontal</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --rojo: #ff0000; --negro: #0c0c0c; }
        body { margin: 0; background: var(--negro); color: #fff; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }

        /* MENU LATERAL */
        #sidebar { 
            position: fixed; left: -260px; top: 0; width: 250px; height: 100%; 
            background: #000; border-right: 2px solid var(--rojo); 
            z-index: 10001; transition: 0.4s; display: flex; flex-direction: column; align-items: center; padding-top: 20px;
        }
        #sidebar.active { left: 0; }
        .menu-toggle { position: absolute; top: 12px; left: 12px; z-index: 10002; background: rgba(0,0,0,0.8); color: white; border: 1px solid var(--rojo); padding: 10px; border-radius: 5px; cursor: pointer; }
        .nav-item { width: 85%; padding: 12px; margin: 5px 0; border-radius: 8px; background: #1a1a1a; display: flex; align-items: center; gap: 12px; cursor: pointer; text-decoration: none; color: white; font-size: 14px; }

        #main-content { width: 100%; display: flex; flex-direction: column; position: relative; }

        /* CONTENEDOR DE VIDEO: FORZADO HORIZONTAL */
        #video-wrapper { 
            width: 100%; 
            height: auto;
            aspect-ratio: 16/9; /* Mantiene la forma de TV */
            background: #000; 
            position: relative; 
            border-bottom: 2px solid var(--rojo); 
            overflow: hidden;
            flex-shrink: 0;
        }

        /* VIDEO: ESTIRADO TOTAL (FILL) */
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: fill !important; /* Estira a los lados sí o sí */
            display: block;
        }

        /* PANTALLA COMPLETA: MATAR BARRAS NEGRAS */
        #video-wrapper:fullscreen video, 
        #video-wrapper:-webkit-full-screen video { 
            object-fit: fill !important; 
            width: 100vw !important;
            height: 100vh !important;
        }

        /* PUBLICIDAD A LA DERECHA */
        #capa-publicidad { 
            position: absolute; 
            top: 15px; 
            right: 15px; 
            width: 140px; 
            z-index: 110; 
            display: none; 
        }
        #banner-img { width: 100%; border-radius: 8px; border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 4px 10px rgba(0,0,0,0.9); }

        .btn-vid { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; border: 1px solid var(--rojo); padding: 8px 12px; border-radius: 5px; cursor: pointer; z-index: 101; font-size: 10px; font-weight: bold; }
        #camera-layer { position: absolute; top: 15px; right: 15px; width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--rojo); overflow: hidden; display: none; z-index: 100; }

        #interaction-area { flex: 1; display: flex; flex-direction: column; background: #050505; }
        #channel-bar { background: #111; padding: 10px; border-bottom: 1px solid #222; }
        select { background: #000; color: white; border: 1px solid #333; padding: 8px; border-radius: 5px; width: 100%; }
        iframe#chat-frame { width: 100%; height: 100%; border: none; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 10000; }
    </style>
</head>
<body>

    <div class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
    <div id="overlay" onclick="toggleMenu()"></div>

    <div id="sidebar">
        <img src="logo_v2.png" style="width: 70px; margin-bottom: 10px;">
        <h4 style="color: var(--rojo); margin: 0; font-size: 15px;">MANAURE 92.3</h4>
        <div style="margin-top: 20px; width: 100%; display: flex; flex-direction: column; align-items: center;">
            <a href="index.html" class="nav-item"><i class="fas fa-broadcast-tower"></i> Radio</a>
            <a href="canales.html" class="nav-item" style="border-left: 4px solid var(--rojo); background: #222;"><i class="fas fa-tv"></i> TV</a>
        </div>
    </div>

    <div id="main-content">
        <div id="video-wrapper">
            <div id="capa-publicidad"><img id="banner-img" src=""></div>
            <video id="video" playsinline autoplay></video>
            <div id="camera-layer"><iframe id="ifr-cam" style="width:100%; height:100%; border:none; transform: scale(1.5);"></iframe></div>
            <button class="btn-vid" onclick="toggleFS()">AMPLIAR PANTALLA</button>
        </div>
        <div id="interaction-area">
            <div id="channel-bar"><select id="channel-select"><option>Cargando...</option></select></div>
            <iframe id="chat-frame" src="chat-manaure.html"></iframe>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk", 
            databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com", 
            projectId: "radiomanaure" 
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const video = document.getElementById('video');
        const hls = new Hls();

        window.toggleMenu = () => {
            document.getElementById('sidebar').classList.toggle('active');
            const ov = document.getElementById('overlay');
            ov.style.display = (ov.style.display === 'block') ? 'none' : 'block';
        };

        window.toggleFS = () => {
            const wrapper = document.getElementById('video-wrapper');
            if (!document.fullscreenElement) {
                if (wrapper.requestFullscreen) wrapper.requestFullscreen();
                else if (wrapper.webkitRequestFullscreen) wrapper.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        };

        async function loadM3U() {
            const r = await fetch('canales.m3u');
            const t = await r.text();
            const lines = t.split('\n');
            const select = document.getElementById('channel-select');
            select.innerHTML = '';
            let name = "";
            lines.forEach(l => {
                if(l.startsWith('#EXTINF')) name = l.split(',')[1];
                else if(l.startsWith('http')) {
                    let o = document.createElement('option'); o.value = l.trim(); o.innerText = name;
                    select.appendChild(o);
                }
            });
            if(select.options.length > 0) play(select.options[0].value);
        }

        function play(url) {
            if (Hls.isSupported()) { hls.loadSource(url); hls.attachMedia(video); }
            else { video.src = url; }
        }

        document.getElementById('channel-select').onchange = (e) => play(e.target.value);
        loadM3U();

        onValue(ref(db, 'cabina_activa'), (snap) => {
            const d = snap.val();
            const layer = document.getElementById('camera-layer');
            if(d && d.estado === "ON") { layer.style.display = 'block'; }
            else { layer.style.display = 'none'; }
        });

        onValue(ref(db, 'publicidad_activa'), (snap) => {
            const d = snap.val();
            const capa = document.getElementById('capa-publicidad');
            const img = document.getElementById('banner-img');
            if(d && d.imagen !== "OFF") { 
                img.src = d.imagen; 
                capa.style.display = 'block'; 
                document.getElementById('camera-layer').style.display = 'none';
            } else { 
                capa.style.display = 'none'; 
            }
        });
    </script>
</body>
</html>
