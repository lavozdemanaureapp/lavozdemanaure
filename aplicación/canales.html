<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MANAURE TV - FULL STRETCH</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --oro: #ffcc00; --rojo: #ff0000; --oscuro: #1a1a1a; }
        
        html, body { 
            margin: 0; padding: 0; background: #000; height: 100vh; 
            display: flex; flex-direction: column; overflow: hidden; 
            font-family: sans-serif;
        }
        
        #video-container { 
            width: 100%; aspect-ratio: 16 / 9; background: #000; 
            position: relative; flex-shrink: 0; z-index: 10;
        }

        /* MAGIA PARA ELIMINAR BORDES NEGROS */
        video, #yt { 
            position: absolute; top: 0; left: 0; 
            width: 100% !important; height: 100% !important; 
            border: none; 
            object-fit: cover; /* Esto estira el video para llenar todo el espacio */
        }
        
        /* Ajuste específico para cuando está en Pantalla Completa */
        #video-container:fullscreen video {
            object-fit: fill; /* Fuerza el llenado total sin recortar tanto */
        }

        #exit-fs { 
            position: absolute; top: 15px; left: 15px; z-index: 999; 
            background: var(--rojo); color: white; padding: 10px; border-radius: 8px; 
            display: none; font-weight: bold; border: 2px solid white;
        }

        #pub-overlay { 
            position: absolute; top: 10px; right: 10px; width: 110px; 
            z-index: 100; display: none; transition: all 0.4s ease; 
        }
        #pub-overlay img { width: 100%; border-radius: 8px; border: 2px solid var(--oro); }

        /* Controles estilo Manaure */
        #controls { padding: 10px; background: var(--oscuro); flex-shrink: 0; border-bottom: 2px solid var(--oro); }
        .selector-wrapper { display: flex; align-items: center; background: #000; border-radius: 8px; overflow: hidden; border: 2px solid #444; margin-bottom: 8px; position: relative; }
        .label-canales { background: var(--oro); color: #000; padding: 10px 12px; font-weight: bold; font-size: 13px; text-transform: uppercase; }
        select { flex: 1; padding: 10px; background: #000; color: var(--oro); border: none; font-weight: bold; font-size: 15px; outline: none; appearance: none; }
        .selector-wrapper::after { content: '▼'; position: absolute; right: 12px; color: var(--oro); font-size: 12px; pointer-events: none; }

        .btn-fs { 
            width: 100%; padding: 14px; background: var(--oro); color: #000; 
            border: none; border-radius: 8px; font-weight: bold; 
            text-transform: uppercase; font-size: 15px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        #chat-frame { flex: 1; width: 100%; border: none; background: #fff; }
        .btn-menu { width: 100%; padding: 12px; background: #222; color: #fff; text-align: center; font-weight: bold; text-decoration: none; display: block; font-size: 12px; }
    </style>
</head>
<body>

    <div id="video-container">
        <button id="exit-fs" onclick="toggleFS()">❌ SALIR</button>
        <video id="vid" playsinline controls autoplay muted></video>
        <iframe id="yt" style="display:none" allow="autoplay; fullscreen" allowfullscreen></iframe>
        <audio id="radio-audio" src="https://stream.zeno.fm/a0x4vvcp9whvv"></audio>
        <div id="pub-overlay"><img id="pub-img" src=""></div>
    </div>

    <div id="controls">
        <div class="selector-wrapper">
            <div class="label-canales">CANALES</div>
            <select id="lista" onchange="cambiarCanal(this.value)"><option>CARGANDO...</option></select>
        </div>
        <button class="btn-fs" onclick="toggleFS()">📺 AMPLIAR PANTALLA TOTAL</button>
    </div>

    <iframe id="chat-frame" src="chat-partido.html"></iframe>
    <a href="index.html" class="btn-menu">🏠 VOLVER AL INICIO</a>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk", 
        databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com", 
        projectId: "radiomanaure" 
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const vid = document.getElementById('vid');
    const yt = document.getElementById('yt');
    const radio = document.getElementById('radio-audio');
    const hls = new Hls({ enableWorker: true, lowLatencyMode: true });

    // MANDO
    onValue(ref(db, 'radio_activa'), snap => {
        if (snap.val()?.estado === 'ON') { radio.play().catch(()=>{}); vid.muted = true; } 
        else { radio.pause(); vid.muted = false; }
    });

    onValue(ref(db, 'publicidad_activa'), snap => {
        const d = snap.val();
        if (d?.imagen && d.imagen !== 'OFF') {
            document.getElementById('pub-img').src = d.imagen;
            document.getElementById('pub-overlay').style.display = 'block';
        } else { document.getElementById('pub-overlay').style.display = 'none'; }
    });

    window.cambiarCanal = (url) => {
        vid.pause(); vid.style.display = "none"; yt.style.display = "none"; yt.src = ""; hls.detachMedia();
        if (url.includes('youtu')) {
            let id = url.includes('v=') ? url.split('v=')[1].split('&')[0] : url.split('/').pop().split('?')[0];
            yt.style.display = "block";
            yt.src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0&modestbranding=1`;
        } else {
            vid.style.display = "block";
            if (Hls.isSupported()) {
                hls.loadSource(url); hls.attachMedia(vid);
                hls.on(Hls.Events.MANIFEST_PARSED, () => vid.play().catch(()=>{}));
            } else { vid.src = url; vid.play().catch(()=>{}); }
        }
    };

    fetch("https://raw.githubusercontent.com/lavozdemanaureapp/lavozdemanaure/main/canales.m3u")
        .then(r => r.text()).then(data => {
            const select = document.getElementById('lista');
            select.innerHTML = "";
            data.split('\n').forEach((line, i, arr) => {
                if (line.includes('#EXTINF')) {
                    select.add(new Option(line.split(',')[1].trim().toUpperCase(), arr[i+1].trim()));
                }
            });
            if(select.length > 0) cambiarCanal(select.value);
        });

    // PANTALLA COMPLETA FORZADA
    window.toggleFS = () => {
        const container = document.getElementById('video-container');
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            // Intentar bloquear orientación en horizontal si es posible
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock("landscape").catch(() => {});
            }

            if (container.requestFullscreen) container.requestFullscreen();
            else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
            
            document.getElementById('exit-fs').style.display = "block";
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
    };
    
    document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement) {
            document.getElementById('exit-fs').style.display = "none";
            if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
        }
    });
</script>
</body>
</html>
