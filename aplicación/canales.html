<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANAURE - En Vivo</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        /* CONTENEDOR DE VIDEO (Lo que se amplía) */
        #player-canvas { position: relative; width: 100%; height: 60vh; background: #000; flex-shrink: 0; overflow: hidden; }
        video { width: 100%; height: 100%; background: #000; }

        /* CÁMARA CABINA (CIRCULO) */
        #camera-layer {
            position: absolute; top: 15px; left: 15px; width: 90px; height: 90px;
            border-radius: 50%; border: 3px solid #ff0000; overflow: hidden;
            display: none; z-index: 2147483647; box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }

        /* BOTONES DE CONTROL SUPERIOR */
        .top-controls { position: absolute; top: 10px; right: 10px; display: flex; gap: 8px; z-index: 2147483647; }
        .btn-ctrl { background: rgba(0,0,0,0.7); color: white; border: 1px solid #ff0000; padding: 10px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; }

        /* SELECTOR DE CANALES (LISTA) */
        #channel-menu { position: absolute; bottom: 10px; left: 10px; z-index: 2147483647; }
        select { background: rgba(0,0,0,0.85); color: white; border: 1px solid #ff0000; padding: 6px; border-radius: 5px; outline: none; }

        /* SECCIÓN DEL CHAT */
        #chat-container { flex-grow: 1; background: #111; border-top: 2px solid #ff0000; position: relative; }
        iframe#chat-frame { width: 100%; height: 100%; border: none; }

        /* PUBLICIDAD */
        #banner-pub { position: absolute; bottom: 15px; right: 15px; width: 160px; display: none; z-index: 2147483646; }
        #banner-pub img { width: 100%; border-radius: 8px; border: 1px solid #fff; }
    </style>
</head>
<body>

    <div id="player-canvas">
        <video id="video" playsinline></video>

        <div class="top-controls">
            <button class="btn-ctrl" id="fs-btn" onclick="toggleFullScreen()">
                <i class="fas fa-expand"></i> <span id="fs-text">AMPLIAR</span>
            </button>
            <button class="btn-ctrl" onclick="window.location.href='index.html'">
                <i class="fas fa-times"></i> SALIR
            </button>
        </div>

        <div id="channel-menu">
            <select id="channel-select">
                <option value="">Cargando lista...</option>
            </select>
        </div>

        <div id="camera-layer">
            <iframe id="iframe-camera" src="" allow="camera;microphone;autoplay" style="width:100%; height:100%; border:none; transform: scale(1.5);"></iframe>
        </div>

        <div id="banner-pub"><img id="img-pub" src=""></div>
    </div>

    <div id="chat-container">
        <iframe id="chat-frame" src="chat-manaure.html"></iframe>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk",
            databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com",
            projectId: "radiomanaure"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const video = document.getElementById('video');
        const canvas = document.getElementById('player-canvas');
        const fsText = document.getElementById('fs-text');
        const hls = new Hls();

        // 1. MANEJO DE PANTALLA COMPLETA
        window.toggleFullScreen = function() {
            if (!document.fullscreenElement) {
                if (canvas.requestFullscreen) canvas.requestFullscreen();
                else if (canvas.webkitRequestFullscreen) canvas.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        };

        // Detectar cambio para actualizar el botón
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                fsText.innerText = "VOLVER";
            } else {
                fsText.innerText = "AMPLIAR";
            }
        });

        // 2. CARGAR LISTA M3U
        async function cargarCanales() {
            try {
                const response = await fetch('canales.m3u');
                const text = await response.text();
                const lines = text.split('\n');
                const select = document.getElementById('channel-select');
                select.innerHTML = '';

                let currentName = "";
                lines.forEach(line => {
                    if (line.startsWith('#EXTINF')) {
                        currentName = line.split(',')[1] || "Canal Sin Nombre";
                    } else if (line.startsWith('http')) {
                        let opt = document.createElement('option');
                        opt.value = line.trim();
                        opt.innerText = currentName;
                        select.appendChild(opt);
                    }
                });
                if (select.options.length > 0) cambiarCanal(select.options[0].value);
            } catch (e) { console.error("Error cargando m3u"); }
        }

        function cambiarCanal(url) {
            if (Hls.isSupported()) {
                hls.loadSource(url);
                hls.attachMedia(video);
                video.play();
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.play();
            }
        }

        document.getElementById('channel-select').addEventListener('change', (e) => cambiarCanal(e.target.value));
        cargarCanales();

        // 3. ESCUCHAR CABINA (FIREBASE)
        onValue(ref(db, 'cabina_activa'), (snap) => {
            const data = snap.val();
            const layer = document.getElementById('camera-layer');
            const iframe = document.getElementById('iframe-camera');
            if (data && data.estado === "ON") {
                const finalUrl = data.url + "&mute=1&autoplay=1";
                if(iframe.src !== finalUrl) iframe.src = finalUrl;
                layer.style.display = 'block';
            } else {
                layer.style.display = 'none';
                iframe.src = "";
            }
        });

        // 4. ESCUCHAR PUBLICIDAD (FIREBASE)
        onValue(ref(db, 'publicidad_activa'), (snap) => {
            const data = snap.val();
            const banner = document.getElementById('banner-pub');
            const img = document.getElementById('img-pub');
            if (data && data.imagen !== "OFF") {
                img.src = data.imagen;
                banner.style.display = 'block';
            } else {
                banner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
