<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANAURE - En Vivo</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        /* ESTE ES EL QUE VAMOS A AMPLIAR */
        #player-canvas { position: relative; width: 100%; height: 65vh; background: #000; flex-shrink: 0; overflow: hidden; }
        video { width: 100%; height: 100%; background: #000; pointer-events: auto; }

        /* CÁMARA CABINA */
        #camera-layer {
            position: absolute; top: 15px; left: 15px; width: 90px; height: 90px;
            border-radius: 50%; border: 3px solid #ff0000; overflow: hidden;
            display: none; z-index: 2147483647; box-shadow: 0 0 15px rgba(0,0,0,0.8);
            pointer-events: none; /* Para que no interfiera con clics */
        }

        /* BOTONES SUPERIORES */
        .top-controls { position: absolute; top: 10px; right: 10px; display: flex; gap: 10px; z-index: 2147483647; }
        .btn-ctrl { background: rgba(0,0,0,0.7); color: white; border: 1px solid #ff0000; padding: 10px; border-radius: 5px; cursor: pointer; }

        /* CHAT */
        #chat-container { flex-grow: 1; background: #111; border-top: 2px solid #ff0000; }
        iframe#chat-frame { width: 100%; height: 100%; border: none; }

        /* PUBLICIDAD */
        #banner-pub { position: absolute; bottom: 15px; right: 15px; width: 160px; display: none; z-index: 2147483646; }
        #banner-pub img { width: 100%; border-radius: 8px; border: 1px solid #fff; }
    </style>
</head>
<body>

    <div id="player-canvas" id="fullscreen-area">
        <video id="video" playsinline></video>

        <div class="top-controls">
            <button class="btn-ctrl" onclick="toggleFullScreen()"><i class="fas fa-expand"></i> AMPLIAR</button>
            <button class="btn-ctrl" onclick="window.location.href='index.html'"><i class="fas fa-times"></i></button>
        </div>

        <div id="camera-layer">
            <iframe id="iframe-camera" src="" allow="camera;microphone;autoplay" style="width:100%; height:100%; border:none; transform: scale(1.5);"></iframe>
        </div>

        <div id="banner-pub"><img id="img-pub" src=""></div>
    </div>

    <div id="chat-container">
        <iframe id="chat-frame" src="chat-manaure.html"></iframe>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk",
            databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com",
            projectId: "radiomanaure"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const video = document.getElementById('video');
        const canvas = document.getElementById('player-canvas');

        // FUNCIÓN AMPLIAR CORREGIDA: Amplía TODO el contenedor, no solo el video
        window.toggleFullScreen = function() {
            if (!document.fullscreenElement) {
                if (canvas.requestFullscreen) canvas.requestFullscreen();
                else if (canvas.webkitRequestFullscreen) canvas.webkitRequestFullscreen();
                else if (canvas.msRequestFullscreen) canvas.msRequestFullscreen();
            } else {
                document.exitFullscreen();
            }
        };

        // CARGAR CANAL (simplificado para asegurar carga)
        const hls = new Hls();
        const videoSrc = 'canales.m3u'; 
        fetch(videoSrc).then(r => r.text()).then(t => {
            const lines = t.split('\n');
            const stream = lines.find(l => l.startsWith('http'));
            if (Hls.isSupported()) { hls.loadSource(stream); hls.attachMedia(video); video.play(); }
            else { video.src = stream; video.play(); }
        });

        // ESCUCHAR CABINA
        onValue(ref(db, 'cabina_activa'), (snap) => {
            const data = snap.val();
            const layer = document.getElementById('camera-layer');
            const iframe = document.getElementById('iframe-camera');
            if (data && data.estado === "ON") {
                // Le sumamos mute=1 para que el navegador no lo bloquee
                const finalUrl = data.url + "&mute=1";
                if(iframe.src !== finalUrl) iframe.src = finalUrl;
                layer.style.display = 'block';
            } else {
                layer.style.display = 'none';
                iframe.src = "";
            }
        });

        // ESCUCHAR PUBLICIDAD
        onValue(ref(db, 'publicidad_activa'), (snap) => {
            const data = snap.val();
            const banner = document.getElementById('banner-pub');
            const img = document.getElementById('img-pub');
            if (data && data.imagen !== "OFF") {
                img.src = data.imagen;
                banner.style.display = 'block';
            } else {
                banner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
