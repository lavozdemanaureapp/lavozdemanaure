<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manaure TV Ultra-Clean</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Lista arriba pero muy pequeña y discreta */
        #interaction-area { background: #111; padding: 5px; border-bottom: 1px solid #ff0000; }
        select { width: 100%; background: #000; color: #fff; border: 1px solid #ff0000; padding: 10px; font-size: 16px; border-radius: 5px; }

        /* Contenedor de video que ocupa TODO el resto de la pantalla */
        #player-canvas { flex: 1; position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        
        /* Video forzado a mostrar controles nativos */
        video { width: 100% !important; height: 100% !important; object-fit: contain; }

        /* Modo horizontal: lista a la izquierda muy delgada */
        @media (orientation: landscape) {
            body { flex-direction: row; }
            #interaction-area { width: 20%; height: 100vh; border-bottom: none; border-right: 1px solid #ff0000; display: flex; align-items: center; }
            #player-canvas { width: 80%; height: 100vh; }
        }
    </style>
</head>
<body>

    <div id="interaction-area">
        <select id="channel-select"><option>Cargando canales...</option></select>
    </div>

    <div id="player-canvas">
        <video id="video" controls playsinline autoplay></video>
    </div>

    <script>
        const video = document.getElementById('video');
        const hls = new Hls();
        const M3U_URL = 'https://raw.githubusercontent.com/lavozdemanaureapp/lavozdemanaure/main/canales.m3u';

        window.play = (url) => {
            if (Hls.isSupported()) {
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
            }
        };

        async function loadM3U() {
            try {
                const r = await fetch(M3U_URL + '?v=' + Math.random());
                const t = await r.text();
                const lines = t.split('\n');
                const select = document.getElementById('channel-select');
                select.innerHTML = '';
                lines.forEach((line, i) => {
                    if (line.startsWith('#EXTINF')) {
                        let name = line.split(',')[1] || "CANAL";
                        let url = lines[i+1]?.trim();
                        if(url) select.add(new Option(name.toUpperCase(), url));
                    }
                });
                if (select.length > 0) play(select.options[0].value);
            } catch (e) { console.error(e); }
        }

        document.getElementById('channel-select').onchange = (e) => play(e.target.value);
        loadM3U();
    </script>
</body>
</html>
