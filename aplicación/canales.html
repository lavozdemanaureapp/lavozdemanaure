<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manaure TV Pro Ultra</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --rojo: #ff0000; --negro: #000; --gris: #111; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--negro); color: #fff; font-family: sans-serif; height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; }

        header { background: var(--gris); padding: 10px; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid var(--rojo); z-index: 100; }
        .btn-menu { background: var(--rojo); color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 18px; }
        select { flex: 1; background: #000; color: white; border: 1px solid #333; padding: 10px; border-radius: 8px; font-size: 16px; font-weight: bold; outline: none; }

        #container { flex: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: contain; }

        .btn-fs { position: absolute; bottom: 85px; right: 25px; background: var(--rojo); color: white; border: none; width: 55px; height: 55px; border-radius: 50%; cursor: pointer; z-index: 10; font-size: 22px; box-shadow: 0 4px 15px rgba(255,0,0,0.5); display: flex; align-items: center; justify-content: center; }

        #sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: #000; border-right: 3px solid var(--rojo); z-index: 200; transition: 0.3s ease; display: flex; flex-direction: column; }
        #sidebar.active { left: 0; }
        .sidebar-logo { padding: 40px 20px; text-align: center; background: var(--gris); border-bottom: 1px solid #222; }
        .sidebar-logo h2 { color: var(--rojo); margin: 0; font-size: 28px; letter-spacing: 3px; text-transform: uppercase; }
        .nav-link { color: white; text-decoration: none; padding: 20px 25px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #111; font-weight: bold; }
        .nav-link i { color: var(--rojo); width: 25px; text-align: center; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 150; }

        @media (orientation: landscape) { header { padding: 5px 10px; } .btn-fs { bottom: 30px; } }
    </style>
</head>
<body>

    <header>
        <button class="btn-menu" onclick="toggleMenu()"><i class="fas fa-bars"></i></button>
        <select id="lista-canales"><option>Cargando lista...</option></select>
    </header>

    <div id="overlay" onclick="toggleMenu()"></div>

    <div id="sidebar">
        <div class="sidebar-logo"><h2>MANAURE</h2></div>
        <a href="index.html" class="nav-link"><i class="fas fa-radio"></i> RADIO EN VIVO</a>
        <a href="canales.html" class="nav-link" style="color: var(--rojo);"><i class="fas fa-tv"></i> TV EN VIVO</a>
        <a href="programas.html" class="nav-link"><i class="fas fa-calendar-alt"></i> PROGRAMACIONES</a>
    </div>

    <div id="container">
        <video id="video" controls playsinline autoplay></video>
        <button class="btn-fs" onclick="goFullScreen()"><i class="fas fa-expand-arrows-alt"></i></button>
    </div>

    <script>
        const video = document.getElementById('video');
        
        // CONFIGURACIÓN ANTI-CORTES (EL MOTOR DE LA APP)
        const hlsConfig = {
            enableWorker: true,
            maxBufferLength: 60,         // Guarda 60 segundos de video
            maxMaxBufferLength: 600,
            maxBufferSize: 90 * 1000 * 1000, // 90MB de pura memoria para el video
            maxBufferHole: 0.5,
            backBufferLength: 10,
            nudgeOffset: 0.1,
            nudgeMaxRetry: 10,
            liveSyncDurationCount: 3,
            fragLoadingMaxRetry: 10,     // Si falla la descarga de un trozo, reintenta 10 veces
            manifestLoadingMaxRetry: 10
        };

        const hls = new Hls(hlsConfig);
        const URL_M3U = 'https://raw.githubusercontent.com/lavozdemanaureapp/lavozdemanaure/main/canales.m3u';

        function toggleMenu() {
            const sb = document.getElementById('sidebar');
            const ov = document.getElementById('overlay');
            sb.classList.toggle('active');
            ov.style.display = sb.classList.contains('active') ? 'block' : 'none';
        }

        function goFullScreen() {
            if (video.requestFullscreen) video.requestFullscreen();
            else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
            else if (video.msRequestFullscreen) video.msRequestFullscreen();
        }

        window.play = (url) => {
            if (Hls.isSupported()) {
                hls.stopLoad();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
                
                // RECONEXIÓN AUTOMÁTICA SI HAY ERROR
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        switch(data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                console.log("Falla de red, reintentando...");
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                console.log("Error de medio, recuperando...");
                                hls.recoverMediaError();
                                break;
                            default:
                                hls.destroy();
                                break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
            }
        };

        async function cargar() {
            try {
                const res = await fetch(URL_M3U + '?v=' + Date.now());
                const texto = await res.text();
                const lineas = texto.split('\n');
                const select = document.getElementById('lista-canales');
                select.innerHTML = '';
                lineas.forEach((l, i) => {
                    if (l.startsWith('#EXTINF')) {
                        let nombre = l.split(',')[1] || "CANAL";
                        let url = lineas[i+1]?.trim();
                        if(url) select.add(new Option(nombre.toUpperCase(), url));
                    }
                });
                if (select.length > 0) play(select.options[0].value);
            } catch (e) { console.error("Error M3U"); }
        }

        document.getElementById('lista-canales').onchange = (e) => play(e.target.value);
        cargar();
    </script>
</body>
</html>
