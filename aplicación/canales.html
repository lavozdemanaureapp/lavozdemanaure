<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TV Digital - La Voz de Manaure</title>
    
    <link rel="manifest" href="manifest.json?v=35">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        :root { --red-m: #ff0000; --bg: #0c0c0c; --card: #1a1a1a; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }

        /* CONTENEDOR DE VIDEO Y PUBLICIDAD */
        #player-canvas {
            position: relative;
            width: 100%;
            background: #000;
            aspect-ratio: 16/9;
            overflow: hidden;
            border-bottom: 2px solid var(--red-m);
        }

        /* Ajuste para Fullscreen Real */
        #player-canvas:fullscreen { width: 100vw; height: 100vh; border: none; }
        #player-canvas:-webkit-full-screen { width: 100vw; height: 100vh; }

        video, #yt-player { width: 100%; height: 100%; object-fit: contain; }

        /* BANNER SOBRE EL VIDEO */
        #ad-layer {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 380px;
            z-index: 2147483647 !important;
            display: none;
            pointer-events: none;
        }
        #ad-layer img { width: 100%; border-radius: 8px; border: 2px solid var(--red-m); box-shadow: 0 0 20px rgba(0,0,0,0.8); }

        /* BOTÓN DE AMPLIAR */
        .fs-overlay { position: absolute; top: 10px; right: 10px; z-index: 100; }
        .fs-btn { background: rgba(255,0,0,0.7); color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }

        /* CONTENIDO DEBAJO DEL VIDEO */
        .content-area { padding: 15px; max-width: 1000px; margin: 0 auto; }
        
        /* PLAYLIST */
        .playlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; max-height: 180px; overflow-y: auto; background: #111; padding: 10px; border-radius: 8px; border: 1px solid #222; }
        .channel-card { background: var(--card); padding: 12px; border-radius: 8px; text-align: center; cursor: pointer; border: 1px solid #333; font-size: 0.8rem; }
        .channel-card.active { border-color: var(--red-m); background: #251212; }

        /* CHAT RECUPERADO */
        .chat-box { background: var(--card); border-radius: 12px; display: flex; flex-direction: column; height: 300px; border: 1px solid #222; margin-top: 20px; overflow: hidden; }
        .messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; background: #141414; }
        .msg { background: #2a2a2a; padding: 8px 12px; border-radius: 12px; font-size: 0.85rem; border: 1px solid #333; }
        .chat-input { padding: 10px; display: flex; gap: 8px; background: #1a1a1a; }
        input#chat-in { flex: 1; background: #333; border: none; color: white; padding: 10px; border-radius: 20px; outline: none; }
        button#btn-enviar { background: var(--red-m); border: none; color: white; padding: 10px 15px; border-radius: 50%; }
    </style>
</head>
<body>

    <div id="player-canvas">
        <video id="video-player" playsinline></video>
        <div id="yt-player" style="display: none;"></div>
        
        <div id="ad-layer">
            <img src="" id="img-pub">
        </div>

        <div class="fs-overlay">
            <button class="fs-btn" onclick="toggleFS()"><i class="fas fa-expand"></i> AMPLIAR</button>
        </div>
    </div>

    <div class="content-area">
        <div class="playlist" id="channel-list"></div>

        <div class="chat-box">
            <div id="msg-container" class="messages"></div>
            <div class="chat-input">
                <input type="text" id="chat-in" placeholder="Escribe un mensaje...">
                <button id="btn-enviar"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, serverTimestamp, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk",
            databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com",
            projectId: "radiomanaure"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // PUBLICIDAD
        onValue(ref(db, 'publicidad_activa'), (snap) => {
            const data = snap.val();
            const layer = document.getElementById('ad-layer');
            const img = document.getElementById('img-pub');
            if(data && data.imagen !== "OFF") {
                img.src = data.imagen + "?v=" + Date.now();
                layer.style.display = 'block';
            } else {
                layer.style.display = 'none';
            }
        });

        // CHAT
        const chatRef = ref(db, 'mensajes');
        document.getElementById('btn-enviar').onclick = () => {
            const input = document.getElementById('chat-in');
            if(input.value) {
                push(chatRef, { texto: input.value, fecha: serverTimestamp() });
                input.value = "";
            }
        };
        onChildAdded(chatRef, (snap) => {
            const container = document.getElementById('msg-container');
            const div = document.createElement('div');
            div.className = 'msg';
            div.innerHTML = `<b>Invitado:</b> ${snap.val().texto}`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        });
    </script>

    <script>
        const canvas = document.getElementById('player-canvas');
        const video = document.getElementById('video-player');

        // FUNCIÓN PARA FULLSCREEN HORIZONTAL
        function toggleFS() {
            if (canvas.requestFullscreen) canvas.requestFullscreen();
            else if (canvas.webkitRequestFullscreen) canvas.webkitRequestFullscreen();
            // Intenta bloquear la rotación a horizontal si el navegador lo permite
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
        }

        async function loadM3U() {
            const res = await fetch("https://raw.githubusercontent.com/lavozdemanaureapp/lavozdemanaure/refs/heads/main/canales.m3u");
            const text = await res.text();
            const lines = text.split('\n');
            const list = document.getElementById('channel-list');
            
            lines.forEach((line, i) => {
                if (line.startsWith('#EXTINF')) {
                    const name = line.split(',')[1];
                    const url = lines[i+1].trim();
                    const d = document.createElement('div');
                    d.className = 'channel-card';
                    d.innerText = name;
                    d.onclick = () => play(url, d);
                    list.appendChild(d);
                }
            });
        }

        let hls;
        function play(url, el) {
            document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            if (hls) hls.destroy();
            if (Hls.isSupported()) {
                hls = new Hls(); hls.loadSource(url); hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else { video.src = url; video.play(); }
        }

        function onYouTubeIframeAPIReady() { loadM3U(); }
    </script>
</body>
</html>
