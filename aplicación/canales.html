<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TV Manaure - Final</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --rojo: #ff0000; --negro: #0c0c0c; }
        body { margin: 0; background: var(--negro); color: #fff; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }

        /* MENÚ - SIEMPRE POR ENCIMA DE TODO */
        #sidebar { 
            position: fixed; left: -260px; top: 0; width: 250px; height: 100%; 
            background: #000; border-right: 2px solid var(--rojo); 
            z-index: 99999; transition: 0.4s; display: flex; flex-direction: column; align-items: center; padding-top: 20px;
        }
        #sidebar.active { left: 0; }
        .menu-toggle { position: absolute; top: 12px; left: 12px; z-index: 10002; background: rgba(0,0,0,0.8); color: white; border: 1px solid var(--rojo); padding: 10px; border-radius: 5px; cursor: pointer; }

        #main-content { width: 100%; display: flex; flex-direction: column; position: relative; }

        /* EL CONTENEDOR (EL CUADRITO) */
        #video-wrapper { 
            width: 100%; 
            aspect-ratio: 16/9; 
            background: #000; 
            position: relative; 
            border-bottom: 2px solid var(--rojo); 
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* VIDEO EN VISTA NORMAL: MANTIENE BORDES NEGROS */
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            display: block;
        }

        /* --- LA MAGIA PARA ESTIRAR HORIZONTAL AL AMPLIAR --- */
        #video-wrapper:fullscreen { background: #000; width: 100vw; height: 100vh; }
        
        /* ESTO FUERZA EL ESTIRAMIENTO HORIZONTAL SÍ O SÍ */
        #video-wrapper:fullscreen video,
        #video-wrapper:-webkit-full-screen video { 
            object-fit: fill !important; 
            width: 100% !important;
            height: 100% !important;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* PUBLICIDAD A LA DERECHA */
        #capa-publicidad { position: absolute; top: 15px; right: 15px; width: 150px; z-index: 1000; display: none; }
        #banner-img { width: 100%; border-radius: 8px; border: 1px solid white; }

        .btn-vid { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; border: 1px solid var(--rojo); padding: 8px 12px; border-radius: 5px; cursor: pointer; z-index: 101; font-size: 11px; font-weight: bold; }
        
        #interaction-area { flex: 1; display: flex; flex-direction: column; background: #050505; }
        #channel-bar { background: #111; padding: 10px; border-bottom: 1px solid #222; }
        select { background: #000; color: white; border: 1px solid #333; padding: 8px; border-radius: 5px; width: 100%; }
        iframe#chat-frame { width: 100%; height: 100%; border: none; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 10000; }
    </style>
</head>
<body>

    <div class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
    <div id="overlay" onclick="toggleMenu()"></div>

    <div id="sidebar">
        <img src="logo_v2.png" style="width: 70px; margin-bottom: 10px;">
        <h4 style="color: var(--rojo); margin: 0; font-size: 15px;">MANAURE 92.3</h4>
        <div style="margin-top: 20px; width: 100%; display: flex; flex-direction: column; align-items: center;">
            <a href="index.html" style="color:white; padding:10px; text-decoration:none;">Radio</a>
            <a href="canales.html" style="color:white; padding:10px; text-decoration:none; border-left: 3px solid var(--rojo);">TV</a>
        </div>
    </div>

    <div id="main-content">
        <div id="video-wrapper">
            <div id="capa-publicidad"><img id="banner-img" src=""></div>
            <video id="video" playsinline autoplay></video>
            <button id="btn-fs" class="btn-vid" onclick="toggleFS()">AMPLIAR PANTALLA</button>
        </div>
        <div id="interaction-area">
            <div id="channel-bar"><select id="channel-select"></select></div>
            <iframe id="chat-frame" src="chat-manaure.html"></iframe>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk", databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com", projectId: "radiomanaure" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const video = document.getElementById('video');
        const btnFs = document.getElementById('btn-fs');
        const hls = new Hls();

        window.toggleMenu = () => {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').style.display = (document.getElementById('overlay').style.display === 'block') ? 'none' : 'block';
        };

        window.toggleFS = () => {
            const wrapper = document.getElementById('video-wrapper');
            if (!document.fullscreenElement) {
                if (wrapper.requestFullscreen) wrapper.requestFullscreen();
                else if (wrapper.webkitRequestFullscreen) wrapper.webkitRequestFullscreen();
                btnFs.innerText = "VOLVER";
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                btnFs.innerText = "AMPLIAR PANTALLA";
            }
        };

        // Escuchar si el usuario sale de pantalla completa con el botón de "atrás" del teléfono
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) btnFs.innerText = "AMPLIAR PANTALLA";
        });

        async function loadM3U() {
            const r = await fetch('canales.m3u');
            const t = await r.text();
            const lines = t.split('\n');
            const select = document.getElementById('channel-select');
            let name = "";
            lines.forEach(l => {
                if(l.startsWith('#EXTINF')) name = l.split(',')[1];
                else if(l.startsWith('http')) {
                    let o = document.createElement('option'); o.value = l.trim(); o.innerText = name;
                    select.appendChild(o);
                }
            });
            if(select.options.length > 0) play(select.options[0].value);
        }

        function play(url) {
            if (Hls.isSupported()) { hls.loadSource(url); hls.attachMedia(video); }
            else { video.src = url; }
        }

        document.getElementById('channel-select').onchange = (e) => play(e.target.value);
        loadM3U();

        onValue(ref(db, 'publicidad_activa'), (snap) => {
            const d = snap.val();
            const capa = document.getElementById('capa-publicidad');
            if(d && d.imagen !== "OFF") {
                document.getElementById('banner-img').src = d.imagen;
                capa.style.display = 'block';
            } else {
                capa.style.display = 'none';
            }
        });
    </script>
</body>
</html>
