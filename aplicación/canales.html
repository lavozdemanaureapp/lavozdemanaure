<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MANAURE TV - PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --oro: #ffcc00; --rojo: #ff0000; }
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* VIDEO (16:9) */
        #video-container { width: 100%; aspect-ratio: 16 / 9; background: #111; position: relative; flex-shrink: 0; }
        video, iframe { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; border: none; }
        
        /* PUBLICIDAD GRANDE */
        #pub-overlay { 
            position: absolute; top: 10%; left: 10%; width: 80%; 
            z-index: 1000; display: none; pointer-events: none; 
            text-align: center; animation: zoomIn 0.3s ease;
        }
        #pub-overlay img { width: 100%; border: 3px solid var(--oro); border-radius: 12px; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        @keyframes zoomIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        #exit-fs { position: absolute; top: 15px; left: 15px; z-index: 1001; background: var(--rojo); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; display: none; }

        /* CONTROLES */
        #controls { padding: 12px; background: #1a1a1a; border-bottom: 2px solid var(--oro); flex-shrink: 0; }
        select { width: 100%; padding: 14px; background: #2a2a2a; color: var(--oro); border: 1px solid #444; border-radius: 10px; font-size: 16px; font-weight: bold; margin-bottom: 10px; }
        .btn-fs { width: 100%; padding: 14px; background: var(--oro); color: #000; border: none; border-radius: 10px; font-weight: bold; text-transform: uppercase; font-size: 14px; box-shadow: 0 4px 0 #b89600; }
        .btn-fs:active { transform: translateY(2px); box-shadow: none; }

        /* CHAT ESTILO YOUTUBE (FONDO BLANCO) */
        #chat-frame { flex: 1; width: 100%; border: none; background: #fff; }
    </style>
</head>
<body>

    <div id="video-container">
        <button id="exit-fs" onclick="toggleFS()">❌ SALIR DEL MODO CINE</button>
        <video id="vid" playsinline controls autoplay muted></video>
        <iframe id="yt" style="display:none" allow="autoplay; fullscreen" allowfullscreen></iframe>
        
        <audio id="radio-audio" src="https://stream.zeno.fm/a0x4vvcp9whvv"></audio>
        
        <div id="pub-overlay"><img id="pub-img" src=""></div>
    </div>

    <div id="controls">
        <select id="lista" onchange="cambiarCanal(this.value)"><option>CONECTANDO...</option></select>
        <button class="btn-fs" onclick="toggleFS()">Ampliar Pantalla 📺</button>
    </div>

    <iframe id="chat-frame" src="chat-partido.html"></iframe>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk", 
        databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com", 
        projectId: "radiomanaure" 
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const vid = document.getElementById('vid');
    const yt = document.getElementById('yt');
    const radio = document.getElementById('radio-audio');
    const hls = new Hls({ enableWorker: true, lowLatencyMode: true });

    // --- LÓGICA DEL MANDO ---
    // Voz Radio + Muteo Agresivo del Video
    onValue(ref(db, 'radio_activa'), snap => {
        if (snap.val()?.estado === 'ON') { 
            radio.play(); 
            vid.muted = true; // Mutea el M3U8
            // Para YouTube necesitamos enviar un mensaje al iframe o cargarlo muteado
            if(yt.style.display === "block") {
                let currentSrc = yt.src;
                if(!currentSrc.includes('mute=1')) yt.src = currentSrc + "&mute=1";
            }
        } else { 
            radio.pause(); 
            vid.muted = false; 
            if(yt.style.display === "block") {
                yt.src = yt.src.replace("&mute=1", "");
            }
        }
    });

    // Publicidad Gigante
    onValue(ref(db, 'publicidad_activa'), snap => {
        const d = snap.val();
        const div = document.getElementById('pub-overlay');
        if (d?.imagen && d.imagen !== 'OFF') {
            document.getElementById('pub-img').src = d.imagen;
            div.style.display = 'block';
        } else { div.style.display = 'none'; }
    });

    // --- CARGA DE SEÑALES ---
    window.cambiarCanal = (url) => {
        vid.pause(); vid.style.display = "none"; yt.style.display = "none"; yt.src = ""; hls.detachMedia();
        if (url.includes('youtu')) {
            let id = url.split('v=')[1] || url.split('/').pop();
            yt.style.display = "block";
            yt.src = `https://www.youtube.com/embed/${id.split('&')[0]}?autoplay=1&rel=0&modestbranding=1`;
        } else {
            vid.style.display = "block";
            if (Hls.isSupported()) {
                hls.loadSource(url); hls.attachMedia(vid);
                hls.on(Hls.Events.MANIFEST_PARSED, () => vid.play());
            } else { vid.src = url; vid.play(); }
        }
    };

    fetch("https://raw.githubusercontent.com/lavozdemanaureapp/lavozdemanaure/main/canales.m3u")
        .then(r => r.text()).then(data => {
            const select = document.getElementById('lista');
            select.innerHTML = "";
            data.split('\n').forEach((line, i, arr) => {
                if (line.includes('#EXTINF')) {
                    select.add(new Option(line.split(',')[1].trim().toUpperCase(), arr[i+1].trim()));
                }
            });
            if(select.length > 0) cambiarCanal(select.value);
        });

    window.toggleFS = () => {
        const container = document.getElementById('video-container');
        const btnExit = document.getElementById('exit-fs');
        if (!document.fullscreenElement) {
            container.requestFullscreen().catch(() => {});
            btnExit.style.display = "block";
            if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(() => {});
        } else {
            document.exitFullscreen();
            btnExit.style.display = "none";
            if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
        }
    };
</script>
</body>
</html>
