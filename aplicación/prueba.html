<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manaure TV Profesional</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --rojo: #ff0000; --negro: #0c0c0c; }
        body { margin: 0; background: var(--negro); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* ÁREA DEL REPRODUCTOR */
        #player-canvas { width: 100%; aspect-ratio: 16 / 9; background: #000; position: relative; border-bottom: 2px solid var(--rojo); flex-shrink: 0; }
        
        /* Este contenedor es clave para evitar bloqueos visuales */
        #telegram-wrapper { width: 100%; height: 100%; position: absolute; top: 0; left: 0; background: #000; display: none; }
        video { width: 100%; height: 100%; display: none; }
        iframe { width: 100%; height: 100%; border: none; }

        /* INTERFAZ */
        #interaction-area { flex: 1; display: flex; flex-direction: column; background: #050505; }
        #channel-bar { padding: 15px; background: #111; border-bottom: 1px solid #333; text-align: center; }
        select { width: 100%; background: #1a1a1a; color: white; border: 2px solid var(--rojo); padding: 15px; border-radius: 10px; font-size: 18px; font-weight: bold; }
        
        #chat-frame { width: 100%; flex: 1; border: none; }
    </style>
</head>
<body>

    <div id="player-canvas">
        <video id="video" playsinline autoplay controls></video>
        <div id="telegram-wrapper"></div>
    </div>

    <div id="interaction-area">
        <div id="channel-bar">
            <select id="channel-select"><option>Cargando señal...</option></select>
        </div>
        <iframe id="chat-frame" src="chat-manaure.html"></iframe>
    </div>

    <script>
        const videoHLS = document.getElementById('video');
        const tgWrapper = document.getElementById('telegram-wrapper');
        const hls = new Hls();

        window.play = (url) => {
            // Limpiar estados
            tgWrapper.style.display = "none";
            tgWrapper.innerHTML = "";
            videoHLS.style.display = "none";
            videoHLS.pause();

            if (url.includes('t.me/')) {
                tgWrapper.style.display = "block";
                
                // Limpiamos el link para sacar solo el nombre del canal
                const canal = url.split('t.me/')[1].split('/')[0].split('?')[0];
                
                // MÉTODO DE REPRODUCCIÓN POR EMBED SEGURO
                // Añadimos parámetros que Telegram acepta mejor para livestreams
                tgWrapper.innerHTML = `
                    <iframe 
                        src="https://t.me/${canal}?embed=1&live=1&user_id=0" 
                        allow="autoplay; fullscreen; picture-in-picture" 
                        sandbox="allow-scripts allow-same-origin allow-forms allow-presentation"
                        style="width:100%; height:100%;">
                    </iframe>`;
            } else {
                videoHLS.style.display = "block";
                if (Hls.isSupported()) {
                    hls.loadSource(url);
                    hls.attachMedia(videoHLS);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => videoHLS.play().catch(()=>{}));
                }
            }
        };

        async function loadM3U() {
            try {
                const r = await fetch('canales.m3u?v=' + Math.random());
                const t = await r.text();
                const lines = t.split('\n');
                const select = document.getElementById('channel-select');
                select.innerHTML = '';
                
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].startsWith('#EXTINF')) {
                        let name = lines[i].split(',')[1] || "CANAL";
                        let url = lines[i + 1]?.trim() || "";
                        if (url) select.add(new Option(name.toUpperCase(), url));
                    }
                }
                if (select.length > 0) play(select.options[0].value);
            } catch (e) { console.error("Error cargando lista"); }
        }

        document.getElementById('channel-select').onchange = (e) => play(e.target.value);
        loadM3U();
    </script>
</body>
</html>
