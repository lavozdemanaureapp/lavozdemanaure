<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat Partido Manaure</title>
    <style>
        body { margin: 0; background: #0f0f0f; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Contenedor de mensajes */
        #mensajes { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth; }
        
        /* Estilo burbuja tipo YouTube */
        .msg { display: flex; align-items: flex-start; gap: 8px; font-size: 14px; line-height: 1.4; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .user { font-weight: bold; color: #aaa; min-width: fit-content; }
        .text { color: #efefef; word-break: break-word; }
        
        /* Input de mensaje */
        #input-area { padding: 10px; background: #181818; border-top: 1px solid #333; display: flex; gap: 8px; }
        input { flex: 1; background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 20px; outline: none; font-size: 14px; }
        input:focus { border-color: #ffcc00; }
        button { background: #ffcc00; color: #000; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="mensajes"></div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="Nombre..." style="width: 30%;">
        <input type="text" id="msg-input" placeholder="Di algo...">
        <button id="send-btn">➤</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // REFERENCIA INDEPENDIENTE: "chat_partido"
        const chatRef = ref(db, 'chat_partido');

        const box = document.getElementById('mensajes');
        const userInp = document.getElementById('user-input');
        const msgInp = document.getElementById('msg-input');
        const btn = document.getElementById('send-btn');

        // Enviar mensaje
        const enviar = () => {
            const user = userInp.value.trim() || "Anónimo";
            const text = msgInp.value.trim();
            if(text) {
                push(chatRef, { user, text, time: Date.now() });
                msgInp.value = "";
            }
        };

        btn.onclick = enviar;
        msgInp.onkeypress = (e) => { if(e.key === 'Enter') enviar(); };

        // Recibir mensajes (Últimos 50 para que sea rápido)
        const q = query(chatRef, limitToLast(50));
        onChildAdded(q, (snap) => {
            const data = snap.val();
            const div = document.createElement('div');
            div.className = 'msg';
            div.innerHTML = `<span class="user">${data.user}:</span> <span class="text">${data.text}</span>`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight; // Auto-scroll al último
        });
    </script>
</body>
</html>
