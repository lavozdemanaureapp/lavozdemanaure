<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Manaure TV</title>
    <style>
        :root { --oro: #ffcc00; --rojo: #ff0000; }
        
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            background: #ffffff; 
            font-family: sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ÁREA DE MENSAJES CON SCROLL MANUAL */
        #mensajes { 
            flex: 1; 
            overflow-y: scroll; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            -webkit-overflow-scrolling: touch;
        }

        .msg { 
            font-size: 14px; 
            border-bottom: 1px solid #eee; 
            padding-bottom: 8px; 
            color: #111; 
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .user { font-weight: bold; color: var(--rojo); margin-right: 5px; text-transform: uppercase; }

        /* INPUT AREA FIJO ABAJO */
        #input-area { 
            padding: 12px; 
            background: #f1f1f1; 
            border-top: 1px solid #ddd; 
            display: flex; 
            gap: 8px; 
            flex-shrink: 0;
        }

        .inp-nombre { width: 25%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; font-size: 14px; }
        .inp-msg { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; font-size: 14px; }
        
        .btn-send { 
            background: var(--oro); 
            border: none; 
            padding: 10px 18px; 
            border-radius: 5px; 
            font-weight: bold; 
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="mensajes"></div>

    <div id="input-area">
        <input type="text" id="user-input" class="inp-nombre" placeholder="Nombre">
        <input type="text" id="msg-input" class="inp-msg" placeholder="Escribe un mensaje...">
        <button id="send-btn" class="btn-send">OK</button>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set, onDisconnect, query, limitToLast, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk", 
        databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com", 
        projectId: "radiomanaure" 
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- CONTADOR DE AUDIENCIA (SUMA AL MANDO) ---
    const sessionId = localStorage.getItem('manaure_session') || Math.random().toString(36).substring(7);
    localStorage.setItem('manaure_session', sessionId);
    const presenciaRef = ref(db, 'audiencia/' + sessionId);
    set(presenciaRef, true);
    onDisconnect(presenciaRef).remove();

    // --- LÓGICA DEL CHAT ---
    const chatRef = ref(db, 'chat_partido');
    const box = document.getElementById('mensajes');
    const userInp = document.getElementById('user-input');
    const msgInp = document.getElementById('msg-input');
    const btnSend = document.getElementById('send-btn');

    const enviar = () => {
        const user = userInp.value.trim() || "OYENTE";
        const text = msgInp.value.trim();
        if(text) {
            push(chatRef, { user: user.toUpperCase(), text: text, time: Date.now() });
            msgInp.value = "";
            msgInp.focus();
        }
    };

    btnSend.onclick = enviar;
    msgInp.onkeypress = (e) => { if(e.key === 'Enter') enviar(); };

    // Solo cargamos los últimos 50 mensajes
    const q = query(chatRef, limitToLast(50));
    onChildAdded(q, (snap) => {
        const data = snap.val();
        const div = document.createElement('div');
        div.className = 'msg';
        div.innerHTML = `<span class="user">${data.user}:</span><span class="text">${data.text}</span>`;
        box.appendChild(div);
        
        // NO HAY AUTO-SCROLL: El usuario decide cuándo bajar con la barrita
    });
</script>
</body>
</html>
