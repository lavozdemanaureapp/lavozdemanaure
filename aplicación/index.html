<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Voz de Manaure 92.3 FM</title>

    <link rel="manifest" href="manifest.json?v=5">
    <meta name="theme-color" content="#000000"> 

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --red-m: #ff0000; --bg: #0c0c0c; --card: #1a1a1a; --green-live: #00ff00; }
        
        @keyframes pulse-red {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 10px 5px rgba(255, 0, 0, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
        }

        @keyframes live-glow {
            0% { background-color: #ff0000; box-shadow: 0 0 5px #ff0000; }
            50% { background-color: #ff5555; box-shadow: 0 0 15px #ff0000; }
            100% { background-color: #ff0000; box-shadow: 0 0 5px #ff0000; }
        }

        @keyframes loading-bar {
            0% { width: 0; opacity: 0; }
            50% { width: 140px; opacity: 1; }
            100% { width: 0; opacity: 0; }
        }

        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }

        #splash-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; z-index: 30000; 
            transition: opacity 0.8s ease; 
        }

        .navbar { position: fixed; top: 0; left: 0; width: 100%; height: 60px; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; box-sizing: border-box; z-index: 10001; border-bottom: 1px solid #333; }
        
        header { width: 100%; background: #000; padding: 15px 0; text-align: center; border-bottom: 1px solid #222; margin-top: 60px; }
        header h1 { margin: 0; font-size: 1.1rem; color: var(--red-m); letter-spacing: 2px; }

        .logo-nav { height: 35px; width: 35px; border-radius: 50%; border: 1px solid var(--red-m); object-fit: cover; animation: pulse-red 2s infinite; cursor: pointer; }

        .scroll-container { width: 100%; max-width: 600px; padding: 20px; box-sizing: border-box; padding-bottom: 140px; }
        section { width: 100%; margin-bottom: 40px; }
        h2 { font-size: 0.8rem; color: #666; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 20px; }

        .prog-card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; align-items: center; gap: 15px; border-left: 4px solid #333; transition: 0.3s; }
        
        .prog-card.active { 
            border-left-color: var(--green-live); 
            background: rgba(0, 255, 0, 0.15); 
            box-shadow: inset 0 0 15px rgba(0, 255, 0, 0.1);
        }
        .prog-card.active strong { color: #55ff55; }

        .time { font-weight: bold; color: var(--red-m); min-width: 55px; }

        .chat-box { background: var(--card); border-radius: 12px; display: flex; flex-direction: column; height: 380px; border: 1px solid #222; }
        .messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #2a2a2a; padding: 10px 15px; border-radius: 15px; font-size: 0.9rem; align-self: flex-start; max-width: 85%; border: 1px solid #333; }
        .chat-input { padding: 12px; display: flex; gap: 8px; background: #222; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; }
        input { flex: 1; background: #333; border: none; color: white; padding: 10px; border-radius: 20px; outline: none; }
        
        .player-bar { position: fixed; bottom: 0; width: 100%; background: #000; padding: 15px 25px; box-sizing: border-box; display: flex; align-items: center; border-top: 1px solid #333; z-index: 1000; justify-content: space-between; }
        .player-info { flex: 2; overflow: hidden; }
        .player-info strong { display: block; font-size: 1rem; color: #fff; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .live-tag { 
            display: inline-block; background: var(--red-m); color: white; 
            font-size: 10px; font-weight: bold; padding: 3px 8px; 
            border-radius: 4px; animation: live-glow 1.5s infinite ease-in-out; 
            letter-spacing: 1px;
        }

        .play-btn { width: 55px; height: 55px; background: var(--red-m); border: none; border-radius: 50%; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 0 20px rgba(255, 0, 0, 0.4); transition: 0.3s; }

        #panel-menu-manaure { position: fixed; top: 0; left: -100%; width: 280px; height: 100%; background: #0c0c0c; z-index: 10002; transition: 0.4s; border-right: 2px solid var(--red-m); padding: 20px; box-sizing: border-box; }
        .menu-link { text-decoration:none; color:white; padding: 14px; background: #1a1a1a; border-radius: 10px; display: flex; align-items: center; gap: 12px; border: 1px solid #333; margin-bottom: 12px; transition: 0.3s; font-size: 0.95rem; }
        .menu-link:hover { border-color: var(--red-m); background: #222; transform: translateX(5px); }
    </style>
</head>

<body>
    <audio id="sonido-campana" src="campana.mp3" preload="auto"></audio>

    <div id="splash-screen">
        <div style="position: relative;">
            <img src="logo_v2.png" alt="Logo" style="height: 140px; width: 140px; border-radius: 50%; border: 4px solid var(--red-m); animation: pulse-red 1.5s infinite; position: relative; z-index: 2;">
        </div>
        <h2 style="color: white; margin-top: 25px; letter-spacing: 5px; font-size: 1.4rem; font-weight: bold; text-shadow: 0 0 10px rgba(255,0,0,0.5);">MANAURE 92.3</h2>
        <div style="margin-top: 20px; height: 3px; background: var(--red-m); border-radius: 10px; animation: loading-bar 2s infinite;"></div>
    </div>

    <div class="navbar">
        <div style="display: flex; align-items: center; gap: 10px;">
            <div style="font-size: 28px; color: white; cursor: pointer; padding: 5px;" onclick="toggleMenu()">☰</div>
            <img src="logo_v2.png" onclick="accesoAdmin()" class="logo-nav">
            <span style="color: white; font-weight: bold; letter-spacing: 2px; font-size: 13px; margin-left: 5px;">RADIO</span>
        </div>
        <div>
            <a href="notificaciones.html" style="text-decoration: none; font-size: 20px; color: white; padding-right: 10px;">🔔</a>
        </div>
    </div>

    <div id="panel-menu-manaure">
        <div style="text-align: center; margin: 60px 0 30px 0;">
            <img src="logo_v2.png" style="height: 80px; width: 80px; border-radius: 50%; border: 2px solid var(--red-m); margin-bottom: 10px;">
            <h2 style="color: var(--red-m); border: none; margin: 0; font-size: 1rem;">LA VOZ DE MANAURE</h2>
            <small style="color: #666;">COMUNITARIA 92.3 FM - Táchira</small>
        </div>
        <nav>
            <a href="index.html" class="menu-link" style="border-left: 4px solid var(--red-m);"><span>📻</span> Radio en Vivo</a>
            <a href="programas.html" class="menu-link"><span>🎙️</span> Archivo de Programas</a>
            <a href="micambio.html" class="menu-link"><span>💸</span> Mi Cambio</a>
            <a href="canales.html" class="menu-link"><span>📺</span> TV Gratis</a>
        </nav>
    </div>

    <div id="overlay-manaure" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:10000;" onclick="toggleMenu()"></div>

    <header>
        <h1>LA VOZ DE MANAURE 92.3 FM</h1>
    </header>

    <div class="scroll-container">
        <section>
            <h2 id="day-text">Cargando Programación...</h2>
            <div id="daily-grid"></div>
        </section>

        <section>
            <h2>Envía tu comentario</h2>
            <div class="chat-box">
                <div id="msg-container" class="messages">
                    <div style="color: #888; text-align: center; padding: 20px;" id="chat-loading">Conectando al chat...</div>
                </div>
                <div class="chat-input">
                    <input type="text" id="chat-in" placeholder="Tu mensaje...">
                    <button id="btn-enviar" style="background:var(--red-m); border:none; color:white; padding:8px 15px; border-radius:20px; cursor:pointer; font-weight:bold;">Enviar</button>
                </div>
            </div>
        </section>
    </div>

    <div class="player-bar">
        <div class="player-info">
            <div><span class="live-tag">EN VIVO</span></div>
            <strong id="on-air">CARGANDO...</strong>
        </div>
        <audio id="audio-player" src="https://stream.zeno.fm/a0x4vvcp9whvv"></audio>
        <button id="master-play" class="play-btn">▶</button>
    </div>

    <!-- SCRIPT DE CONTROL NATIVO AUTOMÁTICO -->
    <script>
        // 1. ELIMINAR LOGO DE INMEDIATO (Pase lo que pase con Firebase u otros scripts)
        setTimeout(function() {
            var splash = document.getElementById('splash-screen');
            if (splash) {
                splash.style.opacity = '0';
                setTimeout(function() { splash.style.display = 'none'; }, 800);
            }
        }, 1500);

        // Menú Lateral
        window.toggleMenu = function() {
            var menu = document.getElementById('panel-menu-manaure');
            var overlay = document.getElementById('overlay-manaure');
            if(!menu) return;
            var isOpen = menu.style.left === '0px';
            menu.style.left = isOpen ? '-100%' : '0px';
            if(overlay) overlay.style.display = isOpen ? 'none' : 'block';
        }

        // Programación de Radio Integrada
        var programming = {
            0: [{t: "00:00", n: "PROGRAMACIÓN GENERAL"}, {t: "06:00", n: "AMANECER LLANERO"}, {t: "07:00", n: "PROGRAMACION GENERAL"}, {t: "08:00", n: "LOCOMOTORA CAMPESINA - JORGE GAMBOA"}, {t: "10:00", n: "BAILABLES DE AYER, HOY Y SIEMPRE - RUFINO SEGOVIA Y LUIS PARADA"}, {t: "12:00", n: "PROGRAMACIÓN GENERAL"}, {t: "16:00", n: "MIENTRAS PASA EL TIEMPO - MAYRA OMAÑA"}, {t: "18:00", n: "PROGRAMACIÓN GENERAL"}],
            1: [{t: "00:00", n: "ROMÁNTICAS"}, {t: "06:00", n: "AMANECER LLANERO"}, {t: "07:00", n: "CELEBRANDO CON TU MÚSICA - JOSÉ COLMENARES"}, {t: "09:00", n: "LA MAÑANA FELIZ - ALEXIS MEZA Y LUIS PARADA"}, {t: "12:00", n: "LOS PAVOS DE OTOÑO - PLÁCIDO GUTIÉRREZ"}, {t: "13:00", n: "PALABRAS DE VIDA ETERNA - RAÚL RUBIO"}, {t: "14:00", n: "ENTRE LÍNEAS Y MÚSICA - KATERLIN MALDONADO"}, {t: "16:00", n: "RANCHENATO - ALEXANDER RAMÍREZ"}, {t: "18:00", n: "SALSA, SON Y TAMBOR - GIOVANNY ESCALANTE"}, {t: "20:00", n: "PROGRAMACIÓN GENERAL"}],
            2: [{t: "00:00", n: "ROMÁNTICAS"}, {t: "06:00", n: "AMANECER LLANERO"}, {t: "07:00", n: "CELEBRANDO CON TU MÚSICA - JOSÉ COLMENARES"}, {t: "09:00", n: "LA MAÑANA FELIZ - ALEXIS MEZA Y LUIS PARADA"}, {t: "12:00", n: "LOS PAVOS DE OTOÑO - PLÁCIDO GUTIÉRREZ"}, {t: "13:00", n: "CLÁSICOS CRISTIANOS"}, {t: "14:00", n: "ENTRE LÍNEAS Y MÚSICA - KATERLIN MALDONADO"}, {t: "16:00", n: "RANCHENATO - ALEXANDER RAMÍREZ"}, {t: "18:00", n: "SALSA, SON Y TAMBOR - GIOVANNY ESCALANTE"}, {t: "20:00", n: "SENTIR ANDINO - LEONARDO VARGAS"}, {t: "21:00", n: "PROGRAMACIÓN GENERAL"}],
            3: [{t: "00:00", n: "ROMÁNTICAS"}, {t: "06:00", n: "AMANECER LLANERO"}, {t: "07:00", n: "CELEBRANDO CON TU MÚSICA - JOSÉ COLMENARES"}, {t: "09:00", n: "LA MAÑANA FELIZ - ALEXIS MEZA Y LUIS PARADA"}, {t: "12:00", n: "LOS PAVOS DE OTOÑO - PLÁCIDO GUTIÉRREZ"}, {t: "13:00", n: "PALABRAS DE VIDA ETERNA - RAÚL RUBIO"}, {t: "14:00", n: "ENTRE LÍNEAS Y MÚSICA - KATERLIN MALDONADO"},  {t: "16:00", n: "RANCHENATO - ALEXANDER RAMÍREZ"}, {t: "18:00", n: "SALSA, SON Y TAMBOR - GIOVANNY ESCALANTE"}, {t: "20:00", n: "PROGRAMACIÓN GENERAL"}],
            4: [{t: "00:00", n: "ROMÁNTICAS"}, {t: "06:00", n: "AMANECER LLANERO"}, {t: "07:00", n: "CELEBRANDO CON TU MÚSICA - JOSÉ COLMENARES"}, {t: "09:00", n: "LA MAÑANA FELIZ - ALEXIS MEZA Y LUIS PARADA"}, {t: "12:00", n: "LOS PAVOS DE OTOÑO - PLÁCIDO GUTIÉRREZ"}, {t: "13:00", n: "CLÁSICOS CRISTIANOS"}, {t: "14:00", n: "ENTRE LÍNEAS Y MÚSICA - KATERLIN MALDONADO"}, {t: "16:00", n: "RANCHENATO - ALEXANDER RAMÍREZ"}, {t: "18:00", n: "SALSA, SON Y TAMBOR - GIOVANNY ESCALANTE"}, {t: "20:00", n: "PROGRAMACIÓN GENERAL"}],
            5: [{t: "00:00", n: "PROGRAMACIÓN GENERAL"}, {t: "06:00", n: "AMANECER LLANERO"}, {t: "07:00", n: "CELEBRANDO CON TU MÚSICA - JOSÉ COLMENARES"}, {t: "09:00", n: "PROGRAMACION GENERAL"}, {t: "10:00", n: "REPORTE BERNAL"},{t: "12:00", n: "EL INQUISIDOR ILUSTRADO - PLÁCIDO GUTIÉRREZ"}, {t: "13:00", n: "PALABRAS DE VIDA ETERNA - RAÚL RUBIO"}, {t: "14:00", n: "ENTRE LÍNEAS Y MÚSICA - KATERLIN MALDONADO"},  {t: "16:00", n: "RANCHENATO - ALEXANDER RAMÍREZ"}, {t: "18:00", n: "SALSA, SON Y TAMBOR- GIOVANNY ESCALANTE"}, {t: "20:00", n: "PROGRAMACION GENERAL"}],
            6: [{t: "00:00", n: "PROGRAMACIÓN GENERAL"}, {t: "06:00", n: "AMANECER LLANERO"}, {t: "07:00", n: "PROGRAMACION GENERAL"}, {t: "08:00", n: "LOCOMOTORA CAMPESINA - JORGE GAMBOA"}, {t: "10:00", n: "BAILABLES DE AYER, HOY Y SIEMPRE - RUFINO SEGOVIA Y LUIS PARADA"}, {t: "12:00", n: "PROGRAMACIÓN GENERAL"}, {t: "16:00", n: "MIENTRAS PASA EL TIEMPO - MAYRA OMAÑA"}, {t: "18:00", n: "PROGRAMACIÓN GENERAL"}]
        };

        function syncRadio() {
            var now = new Date();
            var day = now.getDay();
            var currentTime = now.getHours() * 100 + now.getMinutes();
            var daysNames = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
            
            var dayElement = document.getElementById('day-text');
            if(dayElement) dayElement.innerText = "Programación de " + daysNames[day];
            
            var today = programming[day] || [];
            var activeIdx = -1;
            for (var i = 0; i < today.length; i++) {
                var pTime = parseInt(today[i].t.replace(':', ''));
                if (currentTime >= pTime) activeIdx = i;
            }

            var gridElement = document.getElementById('daily-grid');
            if(gridElement) {
                gridElement.innerHTML = today.map(function(p, i) {
                    return `
                    <div class="prog-card ${i === activeIdx ? 'active' : ''}">
                        <div class="time">${p.t}</div>
                        <div>
                            <strong>${p.n}</strong><br>
                            ${i === activeIdx ? '<small style="color:var(--green-live); font-weight:bold;">• AL AIRE</small>' : '<small style="color:#666">Programado</small>'}
                        </div>
                    </div>`;
                }).join('');
            }

            var labelOnAir = document.getElementById('on-air');
            if (labelOnAir) {
                labelOnAir.innerText = (activeIdx !== -1) ? today[activeIdx].n : "PROGRAMACIÓN MUSICAL";
            }
        }

        syncRadio();
        setInterval(syncRadio, 30000);

        // Control de Audio Reproductor
        var audio = document.getElementById('audio-player');
        var playBtn = document.getElementById('master-play');

        if(playBtn && audio) {
            playBtn.onclick = function() {
                if (audio.paused) {
                    audio.play();
                    playBtn.innerHTML = "◼";
                    playBtn.style.background = "#fff";
                    playBtn.style.color = "#000";
                } else {
                    audio.pause();
                    audio.src = audio.src; 
                    playBtn.innerHTML = "▶";
                    playBtn.style.background = "var(--red-m)";
                    playBtn.style.color = "#fff";
                }
            };
        }

        window.database = null;
        var toques = 0;

        window.accesoAdmin = function() {
            toques++;
            if (toques === 5) {
                var pin = prompt("🔐 Acceso Administrativo Manaure\nIngrese su clave:");
                if (pin === "9230") {
                    if(window.database) {
                        window.database.ref('estadisticas').once('value').then(function(snap) {
                            var data = snap.val() || {};
                            alert("📊 REPORTE DE GESTIÓN\n\n" +
                                  "📲 Instalaciones App: " + (data.descargas_app || 0) + "\n" +
                                  "✨ Escaneos QR: " + (data.descargas_qr || 0) + "\n\n" +
                                  "Total Digital: " + ((data.descargas_app || 0) + (data.descargas_qr || 0)));
                        });
                    } else {
                        alert("Servidor de estadísticas desconectado temporalmente.");
                    }
                } else {
                    alert("PIN Incorrecto");
                }
                toques = 0;
            }
            setTimeout(function() { toques = 0; }, 3000);
        }
    </script>

    <!-- CARGA DE LIBRERÍAS AL FINAL (SI ESTO TIENE CONFLICTO NO AFECTA EL ARRANQUE) -->
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

    <!-- VINCULACIÓN TOTALMENTE AISLADA CON FIREBASE -->
    <script>
        try {
            if (typeof firebase !== 'undefined') {
                var firebaseConfig = {
                    apiKey: "AIzaSyBtkKwQlTzDgQwP_RpDPnX7WJqoyg1turk",
                    authDomain: "radiomanaure.firebaseapp.com",
                    databaseURL: "https://radiomanaure-default-rtdb.firebaseio.com",
                    projectId: "radiomanaure"
                };

                firebase.initializeApp(firebaseConfig);
                window.database = firebase.database();
                var chatRef = window.database.ref('mensajes');

                var loadingIndicator = document.getElementById('chat-loading');
                if(loadingIndicator) loadingIndicator.remove();

                document.getElementById('btn-enviar').onclick = function() {
                    var input = document.getElementById('chat-in');
                    if(!input.value) return;
                    chatRef.push({ texto: input.value, fecha: firebase.database.ServerValue.TIMESTAMP });
                    input.value = "";
                };

                var campana = document.getElementById('sonido-campana');
                var inicial = true;

                chatRef.on('child_added', function(snapshot) {
                    var data = snapshot.val();
                    var container = document.getElementById('msg-container');
                    if(container) {
                        var div = document.createElement('div');
                        div.className = 'msg';
                        div.innerHTML = `<b>Oyente:</b> ${data.texto}`;
                        container.appendChild(div);
                        container.scrollTop = container.scrollHeight;
                        if (!inicial && campana) { campana.play().catch(function(){}); }
                    }
                });
                setTimeout(function() { inicial = false; }, 3000);

                var params = new URLSearchParams(window.location.search);
                if (params.get('utm_source') === 'qr') {
                    window.database.ref('estadisticas/descargas_qr').transaction(function(c) { return (c || 0) + 1; });
                    window.history.replaceState({}, document.title, window.location.pathname);
                }

                window.addEventListener('appinstalled', function() {
                    window.database.ref('estadisticas/descargas_app').transaction(function(c) { return (c || 0) + 1; });
                });
            }
        } catch(e) {
            console.log("Firebase omitido por seguridad en entorno local.");
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js?v=6').catch(function(){});
        }
    </script>
</body>
